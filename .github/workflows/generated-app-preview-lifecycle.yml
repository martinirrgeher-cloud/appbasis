name: Generated App Preview Lifecycle

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Generated AppBasis app id
        required: true
        type: string
      operation:
        description: Explicit preview lifecycle operation
        required: true
        type: choice
        options:
          - hyperdrive
          - migrate
          - bootstrap
          - deploy
      apply:
        description: Explicitly authorize this mutating preview operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generated-app-preview-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  preview:
    name: Generated app preview ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ format('generated-preview-{0}', inputs.app_id) }}
    env:
      APPBASIS_GENERATED_APP_ID: ${{ inputs.app_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Resolve and validate selected generated app
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/generated-app-preview-plan.mjs)"
          printf 'worker_name=%s\n' "$(jq -r '.workerName' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'migration_target=%s\n' "$(jq -r '.migrationTarget' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'database=%s\n' "$(jq -r '.database' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'entrypoint=%s\n' "$(jq -r '.entrypoint' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Require explicit operation authorization
        shell: bash
        env:
          APPBASIS_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPBASIS_APPLY" = '1' || {
            echo 'Generated app preview operation was not explicitly authorized.' >&2
            exit 1
          }

      - name: Validate and mask dedicated preview database
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_DATABASE_URL" || {
            echo 'Missing dedicated generated app preview database connection.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_DATABASE_URL"

      - name: Validate and mask Cloudflare deployment credentials
        if: inputs.operation != 'migrate'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare deployment credential.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Validate protected identity secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || { echo 'Missing protected Better Auth secret.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          node --input-type=module <<'NODE'
          const secret = process.env.APPBASIS_BETTER_AUTH_SECRET;
          if (
            typeof secret !== "string" ||
            secret.trim() !== secret ||
            secret.length < 32
          ) {
            process.exit(1);
          }
          NODE

      - name: Create dedicated generated preview Hyperdrive
        if: inputs.operation == 'hyperdrive'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_APPLY_HYPERDRIVE: ${{ inputs.apply && '1' || '0' }}
        run: node ./tooling/generated-app-preview-hyperdrive.mjs ensure

      - name: Apply generated database manifest
        if: inputs.operation == 'migrate'
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_MIGRATION_TARGET: ${{ steps.plan.outputs.migration_target }}
          APPBASIS_APPLY_MIGRATIONS: ${{ inputs.apply && '1' || '0' }}
        run: node ./tooling/generated-app-preview-migrate.mjs

      - name: Resolve generated workers.dev origin
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header 'Accept: application/json'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          ORIGIN="https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Resolve dedicated generated preview Hyperdrive
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/generated-app-preview-hyperdrive.mjs resolve)"
          test -n "$HYPERDRIVE_ID" || { echo 'Dedicated generated preview Hyperdrive was not resolved.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          printf 'id=%s\n' "$HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"

      - name: Render generated preview config
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
          APPBASIS_ENTRYPOINT: ${{ steps.plan.outputs.entrypoint }}
          APPBASIS_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewBootstrapWranglerConfig,
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          const appId = process.env.APPBASIS_GENERATED_APP_ID;
          const outputPath =
            process.env.APPBASIS_OPERATION === "bootstrap"
              ? `./apps/${appId}/wrangler.preview.bootstrap.generated.json`
              : `./apps/${appId}/wrangler.preview.generated.json`;
          const input = {
            appId,
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: "./worker/preview.ts",
            outputPath,
          };
          if (process.env.APPBASIS_OPERATION === "bootstrap") {
            await writeGeneratedPreviewBootstrapWranglerConfig(input);
          } else {
            await writeGeneratedPreviewWranglerConfig(input);
          }
          NODE

      - name: Create generated preview Worker when absent
        if: inputs.operation == 'bootstrap'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +e
          HTTP_STATUS="$(curl --silent --show-error             --output /dev/null             --write-out '%{http_code}'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APPBASIS_GENERATED_WORKER_NAME}")"
          CURL_STATUS=$?
          set -e
          if (( CURL_STATUS != 0 )); then
            echo 'Unable to determine whether the generated preview Worker exists.' >&2
            exit 1
          fi
          case "$HTTP_STATUS" in
            200)
              echo 'Generated preview Worker already exists; bootstrap deploy skipped.'
              ;;
            404)
              pnpm exec wrangler deploy                 --cwd "../${APPBASIS_GENERATED_APP_ID}"                 --config wrangler.preview.bootstrap.generated.json                 --experimental-provision=false                 --experimental-auto-create=false
              ;;
            *)
              echo 'Unable to determine whether the generated preview Worker exists.' >&2
              exit 1
              ;;
          esac

      - name: Require bootstrapped generated preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'Generated preview Worker is not bootstrapped.' >&2
            exit 1
          }

      - name: Validate generated Worker bundle without provisioning
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../${{ inputs.app_id }}"
          --config wrangler.preview.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize required Worker secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET             --name "$APPBASIS_GENERATED_WORKER_NAME"             --experimental-provision=false             --experimental-auto-create=false >/dev/null
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'Generated preview Worker is missing BETTER_AUTH_SECRET after synchronization.' >&2
            exit 1
          }

      - name: Deploy generated preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../${{ inputs.app_id }}"
          --config wrangler.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify generated preview UI and protected runtime
        if: inputs.operation == 'deploy'
        run: node ./tooling/generated-app-preview-smoke.mjs

      - name: Verify generated preview database binding
        if: inputs.operation == 'deploy'
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Remove generated deployment config
        if: always()
        shell: bash
        run: |
          rm -f "./apps/${APPBASIS_GENERATED_APP_ID}/wrangler.preview.generated.json"
          rm -f "./apps/${APPBASIS_GENERATED_APP_ID}/wrangler.preview.bootstrap.generated.json"

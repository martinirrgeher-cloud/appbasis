name: M3 Preview Initial Version

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upload the one-time initial m3-preview Worker version without deploying traffic
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m3-preview-initial-version-appbasis-m3-preview
  cancel-in-progress: false

jobs:
  upload:
    name: M3 preview initial version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: m3-preview
    env:
      APPBASIS_GENERATED_APP_ID: m3-preview
      APPBASIS_GENERATED_WORKER_NAME: appbasis-m3-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask protected read-only inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare Worker credential.' >&2; exit 1; }
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing dedicated m3-preview database connection.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$APPBASIS_DATABASE_URL"

      - name: Verify migrated m3-preview database before initial version
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: node ./apps/m3-preview/tooling/verify-preview-schema.mjs

      - name: Resolve exact m3-preview Hyperdrive
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/m3-preview-hyperdrive.mjs resolve)"
          test -n "$HYPERDRIVE_ID" || { echo 'Dedicated m3-preview Hyperdrive was not resolved.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          printf 'id=%s\n' "$HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"

      - name: Require exact pre-provisioned m3-preview Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_APPLY_WORKER: "0"
        run: node ./tooling/m3-preview-worker-bootstrap.mjs ensure

      - name: Resolve generated workers.dev origin
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2; exit 1; }
          ORIGIN="https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Require pristine Worker version state
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ./tooling/m3-preview-initial-version.mjs preflight

      - name: Render required-secret version config
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeGeneratedPreviewWranglerConfig } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: process.env.APPBASIS_GENERATED_APP_ID,
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: "./worker/preview.ts",
            outputPath: "./apps/m3-preview/wrangler.preview.generated.json",
          });
          NODE

      - name: Require explicit initial version confirmation
        shell: bash
        env:
          APPBASIS_APPLY_INITIAL_VERSION: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPBASIS_APPLY_INITIAL_VERSION" = '1' || {
            echo 'm3-preview initial version upload was not explicitly confirmed.' >&2
            exit 1
          }

      - name: Upload initial Worker version with protected secret and no traffic
        id: version
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"
          trap 'rm -rf "$temporary_directory"' EXIT
          secrets_file="$temporary_directory/secrets.json"
          output_file="$temporary_directory/wrangler-output.json"

          node ../../tooling/m3-preview-initial-version.mjs write-secrets-file "$secrets_file"

          pnpm exec wrangler versions upload \
            --cwd ../m3-preview \
            --config wrangler.preview.generated.json \
            --name "$APPBASIS_GENERATED_WORKER_NAME" \
            --secrets-file "$secrets_file" \
            --strict \
            --dry-run \
            --experimental-provision=false \
            --experimental-auto-create=false

          WRANGLER_OUTPUT_FILE_PATH="$output_file" pnpm exec wrangler versions upload \
            --cwd ../m3-preview \
            --config wrangler.preview.generated.json \
            --name "$APPBASIS_GENERATED_WORKER_NAME" \
            --secrets-file "$secrets_file" \
            --strict \
            --tag m3-preview-initial-v1 \
            --message "AppBasis m3-preview initial version ${GITHUB_SHA}" \
            --experimental-provision=false \
            --experimental-auto-create=false

          VERSION_ID="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$output_file" | tail -n 1)"
          [[ "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || {
            echo 'Wrangler did not return a canonical m3-preview version ID.' >&2
            exit 1
          }
          echo "::add-mask::$VERSION_ID"

          node ../../tooling/m3-preview-initial-version.mjs verify-upload "$VERSION_ID"
          printf 'id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Remove generated version config
        if: always()
        run: rm -f ./apps/m3-preview/wrangler.preview.generated.json

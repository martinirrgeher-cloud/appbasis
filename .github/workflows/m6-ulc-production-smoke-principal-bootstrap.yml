name: M6 ULC Production Smoke Principal Bootstrap

run-name: ${{ inputs.chain_attempt_id || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BOOTSTRAP-ULC-M6-SMOKE-PRINCIPAL to provision the dedicated production smoke principal'
        required: true
        type: string
      m5_run_id:
        description: 'Successful exact-head M5 production evidence run ID'
        required: true
        type: string
      expected_head_sha:
        description: 'Optional exact commit SHA; required by the M6 production refresh chain'
        required: false
        type: string
      chain_attempt_id:
        description: 'Optional unique parent-chain attempt ID for fail-closed dispatch correlation'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  bootstrap-smoke-principal:
    name: Bootstrap dedicated production smoke principal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: m4-dr

    steps:
      - name: Require exact chain head when supplied
        if: inputs.expected_head_sha != ''
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Chain-dispatched child reruns cannot reuse an earlier M6 production approval.' >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected chain head SHA is invalid.' >&2; exit 1; }
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA" || { echo 'Workflow head differs from the chain-approved exact SHA.' >&2; exit 1; }

      - name: Require explicit production write approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          M5_RUN_ID: ${{ inputs.m5_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Smoke principal bootstrap must run from main.' >&2; exit 1; }
          test "$CONFIRMATION" = "BOOTSTRAP-ULC-M6-SMOKE-PRINCIPAL" || { echo 'Exact smoke principal bootstrap confirmation is required.' >&2; exit 1; }
          [[ "$M5_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'M5 evidence run ID is invalid.' >&2; exit 1; }

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require trusted M5 production evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M5_RUN_ID: ${{ inputs.m5_run_id }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          run_file="$RUNNER_TEMP/run-$M5_RUN_ID.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${M5_RUN_ID}" > "$run_file"

          trusted_heads="$RUNNER_TEMP/trusted-repair-heads.txt"
          printf '%s\n' "$GITHUB_SHA" > "$trusted_heads"

          if test -z "$EXPECTED_HEAD_SHA"; then
            cursor="$GITHUB_SHA"
            for depth in 1 2 3 4 5 6 7 8; do
              commit_file="$RUNNER_TEMP/repair-commit-$depth.json"
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${cursor}" > "$commit_file"

              if ! jq -e --arg cursor "$cursor" '
                .sha == $cursor
                and (.parents | length) == 1
                and (.files | length) > 0
                and all(.files[];
                  .filename == "apps/ulc-linz/tooling/bootstrap-production-smoke-principal.mjs" or
                  .filename == "apps/ulc-linz/tooling/revoke-production-http-smoke-session.mjs" or
                  .filename == "tooling/ulc-linz-m6-production-closeout-workflows.test.mjs" or
                  .filename == ".github/workflows/m6-ulc-production-smoke-principal-bootstrap.yml" or
                  .filename == ".github/workflows/m6-ulc-production-post-deploy-smoke.yml"
                )
              ' "$commit_file" >/dev/null; then
                break
              fi

              parent="$(jq -er '.parents[0].sha' "$commit_file")"
              printf '%s\n' "$parent" >> "$trusted_heads"
              cursor="$parent"
            done
          fi

          # Chain-dispatched mode retains the canonical exact-head invariant: .head_sha == $sha
          jq -e '
            .path == ".github/workflows/m5-ulc-production-evidence.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' "$run_file" >/dev/null || { echo 'M5 production evidence prerequisite metadata is invalid.' >&2; exit 1; }

          m5_head="$(jq -er '.head_sha' "$run_file")"
          grep -Fxq "$m5_head" "$trusted_heads" || { echo 'M5 production evidence is not on the exact current head or within the bounded allowlisted smoke-repair ancestry.' >&2; exit 1; }

      - name: Validate and mask protected smoke bootstrap inputs
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
          ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD }}
          ULC_LINZ_PRODUCTION_SMOKE_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ULC_LINZ_PRODUCTION_DATABASE_URL \
            ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET \
            ULC_LINZ_PRODUCTION_ADMIN_PASSWORD \
            ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD \
            ULC_LINZ_PRODUCTION_SMOKE_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing protected input: $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          test "$ULC_LINZ_PRODUCTION_ADMIN_PASSWORD" != "$ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD" || { echo 'Production admin and smoke bootstrap passwords must differ.' >&2; exit 1; }
          test "$ULC_LINZ_PRODUCTION_ADMIN_PASSWORD" != "$ULC_LINZ_PRODUCTION_SMOKE_PASSWORD" || { echo 'Production admin and steady-state smoke passwords must differ.' >&2; exit 1; }
          test "$ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD" != "$ULC_LINZ_PRODUCTION_SMOKE_PASSWORD" || { echo 'Smoke bootstrap and steady-state passwords must differ.' >&2; exit 1; }

      - name: Restore canonical M5 permission provisioning before smoke principal write
        working-directory: apps/ulc-linz
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-transform-types --import ./tooling/register-native-typescript-resolution.mjs --input-type=module <<'NODE'
          import { createPostgresDatabase } from "@appbasis/database/node-runtime";
          import { provisionPostgresPermissions } from "../../packages/permissions/src/postgres-permission-provisioning.ts";
          import { ULC_LINZ_M5_PERMISSION_PROVISIONING_BUNDLE } from "../../tooling/ulc-linz-m5-permission-provisioning.mjs";
          import { parseUlcLinzProductionDatabaseUrl } from "../../tooling/ulc-linz-m6-production-hyperdrive.mjs";

          const connectionString = process.env.ULC_LINZ_PRODUCTION_DATABASE_URL ?? "";
          parseUlcLinzProductionDatabaseUrl(connectionString);
          const { client } = createPostgresDatabase(connectionString);
          try {
            await provisionPostgresPermissions(client, ULC_LINZ_M5_PERMISSION_PROVISIONING_BUNDLE);
          } finally {
            await client.end({ timeout: 5 });
          }
          console.log("Canonical ULC M5 permission provisioning restored for M6 smoke.");
          NODE

      - name: Provision dedicated smoke principal before post-deploy smoke
        working-directory: apps/ulc-linz
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
          ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD }}
          ULC_LINZ_PRODUCTION_SMOKE_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_PASSWORD }}
        run: node --experimental-transform-types --import ./tooling/register-native-typescript-resolution.mjs ./tooling/bootstrap-production-smoke-principal.mjs

      - name: Record bounded bootstrap result
        if: success()
        run: |
          {
            echo '### ULC M6 production smoke principal bootstrap'
            echo '- principal: `ulc.m6.smoke`'
            echo '- role: `trainer`'
            echo '- permission: `countdown:view` only'
            echo '- organization: dedicated smoke scope'
            echo '- canonical M5 permission provisioning: restored idempotently before principal write'
            echo '- production administrator: verified read-only before provisioning'
            echo '- required password change: completed before smoke'
            echo '- production domain activation: not performed'
            echo '- post-deploy smoke: not performed'
            echo '- final production release: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"

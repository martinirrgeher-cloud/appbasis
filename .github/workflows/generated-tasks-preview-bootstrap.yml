name: Generated Tasks Preview Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-tasks-preview-worker-appbasis-tasks-minimal
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generated tasks preview bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: generated-tasks-preview
    env:
      APPBASIS_GENERATED_APP_ID: tasks-minimal
      APPBASIS_GENERATED_WORKER_NAME: appbasis-tasks-minimal

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask deployment-only inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing dedicated generated preview database connection.' >&2; exit 1; }
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || { echo 'Missing protected Better Auth secret.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          node --input-type=module <<'NODE' || {
          const secret = process.env.APPBASIS_BETTER_AUTH_SECRET;
          if (
            typeof secret !== "string" ||
            secret.trim() !== secret ||
            secret.length < 32
          ) {
            process.exit(1);
          }
          NODE
            echo 'Protected Better Auth secret does not satisfy the generated runtime contract.' >&2
            exit 1
          }

      - name: Resolve generated workers.dev origin
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2; exit 1; }
          ORIGIN="https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Resolve and verify dedicated generated preview Hyperdrive
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/generated-tasks-preview-hyperdrive.mjs resolve)"
          test -n "$HYPERDRIVE_ID" || { echo 'Dedicated generated preview Hyperdrive was not resolved.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          printf 'id=%s\n' "$HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"

      - name: Render secretless bootstrap config
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeGeneratedPreviewBootstrapWranglerConfig } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewBootstrapWranglerConfig({
            appId: process.env.APPBASIS_GENERATED_APP_ID,
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: "./worker/preview.ts",
            outputPath: "./apps/tasks-minimal/wrangler.bootstrap.generated.json",
          });
          NODE

      - name: Create generated Worker only when confirmed absent
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          HTTP_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APPBASIS_GENERATED_WORKER_NAME}")"
          CURL_STATUS=$?
          set -e

          if (( CURL_STATUS != 0 )); then
            echo 'Unable to determine whether the generated preview Worker exists.' >&2
            exit 1
          fi

          case "$HTTP_STATUS" in
            200)
              echo 'Generated preview Worker already exists; bootstrap deploy skipped.'
              ;;
            404)
              pnpm exec wrangler deploy \
                --cwd ../tasks-minimal \
                --config wrangler.bootstrap.generated.json \
                --experimental-provision=false \
                --experimental-auto-create=false
              ;;
            *)
              echo 'Unable to determine whether the generated preview Worker exists.' >&2
              exit 1
              ;;
          esac

      - name: Install required Worker secret outside the Worker runtime
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET \
            --name "$APPBASIS_GENERATED_WORKER_NAME" \
            --experimental-provision=false \
            --experimental-auto-create=false >/dev/null

      - name: Verify required Worker secret exists
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'Required generated preview Worker secret was not found after bootstrap.' >&2
            exit 1
          }

      - name: Remove generated bootstrap config
        if: always()
        run: rm -f ./apps/tasks-minimal/wrangler.bootstrap.generated.json

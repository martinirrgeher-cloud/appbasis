name: ULC E7A6 Training Blocks Preview

run-name: ULC E7A6 Preview · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit E7A6 isolated-preview operation
        required: true
        type: choice
        options:
          - inspect
          - migrate
          - deploy
      apply:
        description: Explicitly authorize the selected mutating preview operation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  preview:
    name: E7A6 isolated preview ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require exact main preview scope
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC E7A6 preview operations are main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Render E7A6 repository plan
        run: node ./tooling/ulc-linz-training-blocks-parity-preview.mjs plan

      - name: Require explicit authorization for mutation
        if: inputs.operation != 'inspect'
        shell: bash
        env:
          APPBASIS_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPBASIS_APPLY" = '1' || {
            echo 'ULC E7A6 preview mutation was not explicitly authorized.' >&2
            exit 1
          }

      - name: Validate and mask isolated preview database credentials
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in APPBASIS_MIGRATION_DATABASE_URL APPBASIS_DATABASE_URL APPBASIS_SECURITY_LOG_DATABASE_URL; do
            value="${!name:-}"
            test -n "$value" || {
              echo "Missing protected input: $name" >&2
              exit 1
            }
            echo "::add-mask::$value"
          done

          node --input-type=module <<'NODE'
          import { validateUlcLinzD4PreviewDatabaseCredentials } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";

          const credentials = validateUlcLinzD4PreviewDatabaseCredentials({
            migrationDatabaseUrl: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            applicationDatabaseUrl: process.env.APPBASIS_DATABASE_URL,
            securityLogDatabaseUrl: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          });
          if (
            credentials.migration.database !== "appbasis_ulc_linz_preview" ||
            credentials.migration.user !== "appbasis_ulc_linz_preview_migration"
          ) {
            throw new Error("E7A6 database credential does not identify the exact isolated preview target.");
          }
          NODE

      - name: Inspect current training-blocks preview state
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-training-blocks-parity-preview.mjs inspect

      - name: Apply training-blocks schema v2
        if: inputs.operation == 'migrate'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_MIGRATIONS: "1"
          APPBASIS_APPLY_TRAINING_BLOCKS_PARITY_PREVIEW: "1"
        run: node ./tooling/ulc-linz-training-blocks-parity-preview.mjs apply

      - name: Reconcile preview runtime database access after migration
        if: inputs.operation == 'migrate'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_DATABASE_ACCESS: "1"
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs reconcile

      - name: Verify training-blocks schema after migration
        if: inputs.operation == 'migrate'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-training-blocks-parity-preview.mjs verify

      - name: Verify preview runtime database access after migration
        if: inputs.operation == 'migrate'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs preflight-existing

      - name: Require current training-blocks schema before deploy
        if: inputs.operation == 'deploy'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-training-blocks-parity-preview.mjs verify

      - name: Require exact preview runtime database access before deploy
        if: inputs.operation == 'deploy'
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs preflight-existing

      - name: Validate and mask deploy credentials
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPBASIS_BETTER_AUTH_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            value="${!name:-}"
            test -n "$value" || {
              echo "Missing protected input: $name" >&2
              exit 1
            }
            echo "::add-mask::$value"
          done

      - name: Resolve preview worker and URL
        if: inputs.operation == 'deploy'
        id: preview
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/ulc-linz-d4-preview-plan.mjs)"
          WORKER_NAME="$(jq -r '.workerName' <<<"$PLAN")"
          [[ "$WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'ULC preview worker name is invalid.' >&2
            exit 1
          }

          RESPONSE="$(curl --fail-with-body --silent --show-error             --header 'Accept: application/json'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          BASE_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          printf 'worker_name=%s\nbase_url=%s\n' "$WORKER_NAME" "$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Require existing isolated preview worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'ULC preview Worker is not bootstrapped.' >&2
            exit 1
          }

      - name: Verify existing preview remains on the standard-module runtime
        if: inputs.operation == 'deploy'
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Resolve isolated ULC preview Hyperdrives
        if: inputs.operation == 'deploy'
        id: hyperdrives
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          TARGETS="$(node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs resolve)"
          APPLICATION_ID="$(jq -r '.applicationId' <<<"$TARGETS")"
          SECURITY_LOG_ID="$(jq -r '.securityLogId' <<<"$TARGETS")"
          test -n "$APPLICATION_ID"
          test -n "$SECURITY_LOG_ID"
          test "$APPLICATION_ID" != "$SECURITY_LOG_ID"
          echo "::add-mask::$APPLICATION_ID"
          echo "::add-mask::$SECURITY_LOG_ID"
          printf 'application_id=%s\nsecurity_log_id=%s\n' "$APPLICATION_ID" "$SECURITY_LOG_ID" >> "$GITHUB_OUTPUT"

      - name: Render current standard-module preview config
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.application_id }}
          APPBASIS_SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.security_log_id }}
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: "ulc-linz",
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            securityLogHyperdriveId:
              process.env.APPBASIS_SECURITY_LOG_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_BASE_URL,
            entrypoint: "./worker/preview-exercise-catalog-standard.ts",
            r2BucketName: "appbasis-ulc-linz-preview-exercise-media",
            r2Jurisdiction: "eu",
            outputPath:
              "./apps/ulc-linz/wrangler.preview.e7a6.generated.json",
          });
          NODE

      - name: Validate preview bundle without provisioning
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.e7a6.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize preview identity secret
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET"             | pnpm exec wrangler secret put BETTER_AUTH_SECRET                 --name "$APPBASIS_GENERATED_WORKER_NAME" >/dev/null

      - name: Deploy E7A6 standard-module preview runtime
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.e7a6.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify deployed preview remains on the standard-module runtime
        if: inputs.operation == 'deploy'
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Verify preview application database binding
        if: inputs.operation == 'deploy'
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Verify training-blocks UI and protected API are live
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          HTML="$(curl --fail-with-body --silent --show-error "$APPBASIS_GENERATED_PREVIEW_URL/")"
          grep -F 'id="training-block-new"' <<<"$HTML" >/dev/null || {
            echo 'The deployed preview does not contain the training-blocks UI.' >&2
            exit 1
          }
          grep -F 'id="training-block-favorite"' <<<"$HTML" >/dev/null || {
            echo 'The deployed preview does not contain the training-block favorite control.' >&2
            exit 1
          }
          grep -F 'id="training-block-usage-info"' <<<"$HTML" >/dev/null || {
            echo 'The deployed preview does not contain the training-block usage summary.' >&2
            exit 1
          }

          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/e7a6-training-blocks-api.json"             --write-out '%{http_code}'             "$APPBASIS_GENERATED_PREVIEW_URL/api/modules/training-blocks")"
          case "$STATUS" in
            401|403) ;;
            *)
              echo "Unauthenticated training-blocks API returned unexpected HTTP $STATUS." >&2
              exit 1
              ;;
          esac

      - name: Record E7A6 preview operation
        shell: bash
        run: |
          {
            echo "ULC E7A6 operation: ${{ inputs.operation }}."
            echo 'Target is the isolated generated-preview-ulc-linz environment only.'
            echo 'Migration and deployment are separate explicitly authorized operations.'
            echo 'Production was not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated E7A6 config
        if: always()
        shell: bash
        run: rm -f ./apps/ulc-linz/wrangler.preview.e7a6.generated.json

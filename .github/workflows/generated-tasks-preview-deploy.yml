name: Generated Tasks Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-tasks-preview-worker-appbasis-tasks-minimal
  cancel-in-progress: false

jobs:
  deploy:
    name: Generated tasks preview deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reference-preview
    env:
      APPBASIS_GENERATED_APP_ID: tasks-minimal
      APPBASIS_GENERATED_WORKER_NAME: appbasis-tasks-minimal

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask deployment-only inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_HYPERDRIVE_ID: ${{ secrets.APPBASIS_HYPERDRIVE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          test -n "$APPBASIS_HYPERDRIVE_ID" || { echo 'Missing required generated preview Hyperdrive binding.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$APPBASIS_HYPERDRIVE_ID"

      - name: Resolve generated workers.dev origin
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2; exit 1; }
          ORIGIN="https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Render required-secret deployment config
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ secrets.APPBASIS_HYPERDRIVE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { writeGeneratedPreviewWranglerConfig } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: process.env.APPBASIS_GENERATED_APP_ID,
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            outputPath: "./apps/tasks-minimal/wrangler.preview.generated.json",
          });
          NODE

      - name: Require bootstrapped Worker and required secret
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'Generated preview Worker is not bootstrapped.' >&2
            exit 1
          }
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'Generated preview Worker is missing BETTER_AUTH_SECRET.' >&2
            exit 1
          }

      - name: Validate generated Worker bundle without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd ../tasks-minimal
          --config wrangler.preview.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Deploy generated Worker without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd ../tasks-minimal
          --config wrangler.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify deployed generated health
        env:
          APPBASIS_GENERATED_APP_ID: tasks-minimal
        run: node ./tooling/generated-preview-smoke.mjs

      - name: Remove generated deployment config
        if: always()
        run: rm -f ./apps/tasks-minimal/wrangler.preview.generated.json

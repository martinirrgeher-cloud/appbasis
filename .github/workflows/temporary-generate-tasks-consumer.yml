name: Temporary generate tasks consumer

on:
  push:
    branches:
      - agent/generated-tasks-consumer

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/generated-tasks-consumer
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install current workspace
        run: pnpm install --frozen-lockfile

      - name: Align generator integration expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tooling/create-app.test.mjs')
          text = path.read_text()
          needle = '"@appbasis/identity": "workspace:*",\n    hono: "4.13.1",'
          replacement = '"@appbasis/identity": "workspace:*",\n    "@appbasis/tasks": "workspace:*",\n    hono: "4.13.1",'
          if needle not in text:
              raise SystemExit('expected generator dependency assertion not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Generate tasks consumer with production generator
        run: pnpm appbasis:create -- --app-id tasks-minimal --display-name "AppBasis Tasks Minimal" --module tasks --platform-service identity

      - name: Verify generated consumer
        run: |
          pnpm run verify:apps
          pnpm --filter @appbasis/app-tasks-minimal typecheck
          pnpm --filter @appbasis/app-tasks-minimal test

      - name: Commit generated consumer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/create-app.test.mjs apps/tasks-minimal pnpm-lock.yaml
          git diff --cached --check
          git commit -m "feat: add generated tasks consumer"
          git push origin HEAD:agent/generated-tasks-consumer

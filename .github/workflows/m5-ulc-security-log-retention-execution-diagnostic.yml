name: M5 ULC Security Log Retention Execution Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  diagnose-retention-execution:
    name: Diagnose ULC production retention execution read-only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: m4-dr
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact repository contracts
        run: pnpm run verify:repo

      - name: Validate and mask protected diagnostic credentials
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::$value"
          done

      - name: Run read-only execution diagnostic
        env:
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
        run: node ./tooling/ulc-linz-m5-security-log-retention-execution-diagnostic.mjs

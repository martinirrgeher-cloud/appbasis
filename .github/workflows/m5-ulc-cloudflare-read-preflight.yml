name: M5 ULC Cloudflare Read Preflight

on:
  pull_request:
    paths:
      - 'tooling/ulc-linz-m5-cloudflare-read-preflight.mjs'
      - 'tooling/ulc-linz-m5-cloudflare-read-preflight.test.mjs'
      - '.github/workflows/m5-ulc-cloudflare-read-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tooling/ulc-linz-m5-cloudflare-read-preflight.mjs'
      - 'tooling/ulc-linz-m5-cloudflare-read-preflight.test.mjs'
      - '.github/workflows/m5-ulc-cloudflare-read-preflight.yml'
      - 'tooling/ulc-linz-m5-production-evidence-observer.mjs'
      - '.github/workflows/m5-ulc-production-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-ulc-cloudflare-read-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Test bounded Cloudflare preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Test Cloudflare read preflight
        run: node --test ./tooling/ulc-linz-m5-cloudflare-read-preflight.test.mjs

  cloudflare-read-preflight:
    name: Verify M5 Cloudflare read access before restore
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: m4-dr
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Verify Cloudflare M5 read surface
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            test -n "${!name:-}" || { echo "Missing protected M5 Cloudflare input: $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node ./tooling/ulc-linz-m5-cloudflare-read-preflight.mjs

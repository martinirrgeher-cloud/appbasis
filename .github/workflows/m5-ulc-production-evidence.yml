name: M5 ULC Production Evidence

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type VERIFY-ULC-M5-PRODUCTION to run the correlated production evidence and isolated restore rehearsal'
        required: true
        type: string
      apply_restore:
        description: 'Write only to the configured isolated restore database; production source remains read-only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  production-evidence:
    name: Verify all ULC M5 production owners on one snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: m4-dr

    steps:
      - name: Require exact controlled restore approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          APPLY_RESTORE: ${{ inputs.apply_restore }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'ULC M5 production evidence must run from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "VERIFY-ULC-M5-PRODUCTION" || {
            echo 'Exact ULC M5 production evidence confirmation is required.' >&2
            exit 1
          }
          test "$APPLY_RESTORE" = "true" || {
            echo 'M5 High-Privacy evidence requires the explicitly approved isolated restore rehearsal.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and canonical ULC backup contract
        run: |
          pnpm run verify:repo
          node ./tooling/ulc-linz-m5-backup-contract.mjs

      - name: Validate and mask protected inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
          ULC_LINZ_M5_DPA_ACCOUNT_BINDING_EVIDENCE: ${{ secrets.ULC_LINZ_M5_DPA_ACCOUNT_BINDING_EVIDENCE }}
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            NEON_API_KEY \
            NEON_ORG_ID \
            ULC_LINZ_PRODUCTION_DATABASE_URL \
            ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL \
            ULC_LINZ_M5_DPA_ACCOUNT_BINDING_EVIDENCE \
            APPBASIS_M4_RESTORE_DATABASE_URL \
            APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL \
            APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL \
            APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL; do
            test -n "${!name:-}" || { echo "Missing protected ULC M5 input: $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node --input-type=module <<'NODE'
          const app = new URL(process.env.ULC_LINZ_PRODUCTION_DATABASE_URL);
          const backup = new URL(process.env.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL);
          const restoreOwner = new URL(process.env.APPBASIS_M4_RESTORE_DATABASE_URL);
          const restoreApp = new URL(process.env.APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL);
          const restoreIngest = new URL(process.env.APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL);
          const restoreRead = new URL(process.env.APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL);
          const endpoint = (url) => `${url.hostname.toLowerCase()}:${url.port || "5432"}${url.pathname}`;
          if (endpoint(app) !== endpoint(backup) || app.username === backup.username) {
            throw new Error("ULC M5 backup credential must target the production database with a dedicated principal.");
          }
          const restoreCredentials = [restoreOwner, restoreApp, restoreIngest, restoreRead];
          if (restoreCredentials.some((url) => endpoint(url) !== endpoint(restoreOwner))) {
            throw new Error("All ULC M5 restore credentials must target the exact same isolated restore database.");
          }
          if (new Set(restoreCredentials.map((url) => url.username)).size !== restoreCredentials.length) {
            throw new Error("ULC M5 restore owner, application, ingest and read credentials must use distinct principals.");
          }
          NODE

      - name: Create restricted temporary evidence workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/appbasis-ulc-m5-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$WORK"
          mkdir -p "$WORK"
          printf 'path=%s\n' "$WORK" >> "$GITHUB_OUTPUT"

      - name: Verify isolated restore target is empty and separate
        shell: bash
        env:
          APPBASIS_M4_SOURCE_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
        run: node ./tooling/m4-r2-restore-target.mjs verify-empty

      - name: Capture one exported source snapshot and create authorized backup
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          SNAPSHOT_PATH="$WORK/source.snapshot"
          RELEASE_PATH="$WORK/source.snapshot.release"
          APPBASIS_M5_SNAPSHOT_PATH="$SNAPSHOT_PATH" \
          APPBASIS_M5_SNAPSHOT_RELEASE_PATH="$RELEASE_PATH" \
            node ./tooling/ulc-linz-m5-exported-snapshot.mjs &
          SNAPSHOT_PID=$!
          release_snapshot() {
            touch "$RELEASE_PATH" 2>/dev/null || true
            wait "$SNAPSHOT_PID" 2>/dev/null || true
          }
          trap release_snapshot EXIT
          for _ in $(seq 1 300); do
            if test -s "$SNAPSHOT_PATH"; then
              break
            fi
            if ! kill -0 "$SNAPSHOT_PID" 2>/dev/null; then
              wait "$SNAPSHOT_PID"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$SNAPSHOT_PATH" || {
            echo 'ULC M5 exported snapshot was not created.' >&2
            exit 1
          }
          DATABASE_SNAPSHOT="$(tr -d '\r\n' < "$SNAPSHOT_PATH")"
          test -n "$DATABASE_SNAPSHOT"
          echo "::add-mask::$DATABASE_SNAPSHOT"

          DATABASE_URL="$ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL" \
          DATABASE_SNAPSHOT="$DATABASE_SNAPSHOT" \
            node ./tooling/ulc-linz-m5-restore-fingerprint.mjs > "$WORK/source-fingerprint.json"

          docker run --rm \
            --env ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL \
            --env DATABASE_SNAPSHOT="$DATABASE_SNAPSHOT" \
            --volume "$WORK:/evidence" \
            postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            sh -ceu 'pg_dump --format=custom --no-owner --snapshot="$DATABASE_SNAPSHOT" --dbname="$ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL" --file=/evidence/production.pgdump'
          test -s "$WORK/production.pgdump" || {
            echo 'ULC production dump was not created.' >&2
            exit 1
          }
          touch "$RELEASE_PATH"
          wait "$SNAPSHOT_PID"
          trap - EXIT

      - name: Restore production dump atomically into isolated target
        shell: bash
        env:
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env APPBASIS_M4_RESTORE_DATABASE_URL \
            --volume "$WORK:/evidence:ro" \
            postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            sh -ceu 'pg_restore --single-transaction --no-owner --exit-on-error --dbname="$APPBASIS_M4_RESTORE_DATABASE_URL" /evidence/production.pgdump'

      - name: Capture and compare sanitized restored fingerprint
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          node ./tooling/ulc-linz-m5-restore-fingerprint.mjs > "$WORK/restore-fingerprint.json"
          cmp -s "$WORK/source-fingerprint.json" "$WORK/restore-fingerprint.json" || {
            echo 'ULC production restore fingerprint does not match the production source snapshot.' >&2
            exit 1
          }

      - name: Verify restore application principal is isolated from audit ownership and access
        shell: bash
        env:
          APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          RESULT="$(docker run --rm \
            --env APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL \
            postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 \
            sh -ceu 'psql "$APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
              SELECT CASE WHEN
                current_user <> pg_catalog.pg_get_userbyid((SELECT relowner FROM pg_catalog.pg_class WHERE oid = to_regclass(\$\$public.ulc_linz_security_event_log\$\$)))
                AND current_user <> pg_catalog.pg_get_userbyid((SELECT relowner FROM pg_catalog.pg_class WHERE oid = to_regclass(\$\$public.ulc_linz_security_event_log_id_seq\$\$)))
                AND current_user <> pg_catalog.pg_get_userbyid((SELECT proowner FROM pg_catalog.pg_proc WHERE oid = to_regprocedure(\$\$public.appbasis_ulc_linz_purge_expired_security_events()\$\$)))
                AND NOT pg_catalog.has_table_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$SELECT\$\$)
                AND NOT pg_catalog.has_table_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$INSERT\$\$)
                AND NOT pg_catalog.has_table_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$UPDATE\$\$)
                AND NOT pg_catalog.has_table_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$DELETE\$\$)
                AND NOT pg_catalog.has_table_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$TRUNCATE\$\$)
                AND NOT pg_catalog.has_any_column_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$SELECT\$\$)
                AND NOT pg_catalog.has_any_column_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$INSERT\$\$)
                AND NOT pg_catalog.has_any_column_privilege(current_user, \$\$public.ulc_linz_security_event_log\$\$, \$\$UPDATE\$\$)
                AND NOT pg_catalog.has_sequence_privilege(current_user, \$\$public.ulc_linz_security_event_log_id_seq\$\$, \$\$USAGE\$\$)
                AND NOT pg_catalog.has_sequence_privilege(current_user, \$\$public.ulc_linz_security_event_log_id_seq\$\$, \$\$SELECT\$\$)
                AND NOT pg_catalog.has_sequence_privilege(current_user, \$\$public.ulc_linz_security_event_log_id_seq\$\$, \$\$UPDATE\$\$)
                AND NOT pg_catalog.has_function_privilege(current_user, \$\$public.appbasis_ulc_linz_purge_expired_security_events()\$\$, \$\$EXECUTE\$\$)
              THEN \$\$isolated\$\$ ELSE \$\$unsafe\$\$ END;
            "')"
          test "$RESULT" = "isolated" || {
            echo 'Restore application principal owns or can access protected audit objects.' >&2
            exit 1
          }
          printf '%s\n' '{"schemaVersion":1,"application":"ulc-linz","restoreApplicationPrincipalSeparated":true,"auditObjectOwnershipRejected":true,"auditAccessRejected":true}' > "$WORK/restore-application-access.json"

      - name: Verify ULC auth permissions reconciliation retention and security ACLs on the exact restored database
        env:
          DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          APPBASIS_M5_RESTORE_RECONCILIATION_EVIDENCE_PATH: ${{ steps.workspace.outputs.path }}/restore-reconciliation.json
        run: pnpm --filter @appbasis/app-ulc-linz exec vitest run ./test/restored-production.postgres.e2e.test.ts

      - name: Record sanitized controlled restore observation
        shell: bash
        env:
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          RESTORE_TARGET_BINDING_ID="$(node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const url = new URL(process.env.APPBASIS_M4_RESTORE_DATABASE_URL);
          const port = url.port || "5432";
          const identity = `${url.hostname.toLowerCase()}:${port}${url.pathname}`;
          process.stdout.write(`sha256-${createHash("sha256").update(identity).digest("hex")}`);
          NODE
          )"
          echo "::add-mask::$RESTORE_TARGET_BINDING_ID"
          RESTORE_TESTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          RESTORE_TARGET_BINDING_ID="$RESTORE_TARGET_BINDING_ID" RESTORE_TESTED_AT="$RESTORE_TESTED_AT" node --input-type=module <<'NODE' > "$WORK/restore-observation.json"
          import { readFile } from "node:fs/promises";
          const reconciliation = JSON.parse(
            await readFile(`${process.env.WORK}/restore-reconciliation.json`, "utf8"),
          );
          const restoreApplicationAccess = JSON.parse(
            await readFile(`${process.env.WORK}/restore-application-access.json`, "utf8"),
          );
          if (
            reconciliation?.schemaVersion !== 1 ||
            reconciliation?.application !== "ulc-linz" ||
            reconciliation?.authoritativeSourceBound !== true ||
            reconciliation?.restoredTargetBound !== true ||
            !Number.isSafeInteger(reconciliation?.requiredDeletionCount) ||
            reconciliation.requiredDeletionCount < 0 ||
            reconciliation?.reconciledIdentityCount !== reconciliation.requiredDeletionCount ||
            reconciliation?.positiveAuthenticationVerified !== true ||
            reconciliation?.securityAclVerified !== true ||
            reconciliation?.restoreReconciliationVerified !== true ||
            restoreApplicationAccess?.schemaVersion !== 1 ||
            restoreApplicationAccess?.application !== "ulc-linz" ||
            restoreApplicationAccess?.restoreApplicationPrincipalSeparated !== true ||
            restoreApplicationAccess?.auditObjectOwnershipRejected !== true ||
            restoreApplicationAccess?.auditAccessRejected !== true
          ) {
            throw new Error("ULC restored-production reconciliation or restore-application isolation evidence is invalid.");
          }
          const value = {
            restoreTargetBindingId: process.env.RESTORE_TARGET_BINDING_ID,
            restoreTestedAt: process.env.RESTORE_TESTED_AT,
            restoreSucceeded: true,
            dataIntegrityVerified: true,
            authVerified: reconciliation.positiveAuthenticationVerified,
            permissionsVerified: true,
            applicationSmokeVerified: true,
            restoreReconciliationVerified: reconciliation.restoreReconciliationVerified,
          };
          process.stdout.write(`${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Observe exact current providers and compose one correlated owner bundle
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
          ULC_LINZ_M5_DPA_ACCOUNT_BINDING_EVIDENCE: ${{ secrets.ULC_LINZ_M5_DPA_ACCOUNT_BINDING_EVIDENCE }}
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          node ./tooling/ulc-linz-m5-production-evidence-observer.mjs "$WORK/restore-observation.json" > "$WORK/m5-base-bundle.json"
          node ./tooling/ulc-linz-m5-production-g-evidence.mjs "$WORK/m5-base-bundle.json" > "$WORK/m5-g-baseline-bundle.json"
          node ./tooling/ulc-linz-m5-production-dpa-evidence.mjs "$WORK/m5-g-baseline-bundle.json" > "$WORK/m5-g-bundle.json"
          node ./tooling/ulc-linz-m5-production-f-evidence.mjs "$WORK/m5-g-bundle.json" > "$WORK/m5-bundle.json"
          rm -f -- "$WORK/m5-base-bundle.json" "$WORK/m5-g-baseline-bundle.json" "$WORK/m5-g-bundle.json"

      - name: Require canonical M5 Security and Privacy Ready 12 of 12
        shell: bash
        env:
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          node ./tooling/ulc-linz-m5-production-evidence-runner.mjs "$WORK/m5-bundle.json" --require-ready > "$WORK/m5-result.json"
          RESULT_PATH="$WORK/m5-result.json" node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(process.env.RESULT_PATH, "utf8"));
          if (
            result?.application !== "ulc-linz" ||
            result?.environment !== "production" ||
            result?.securityPrivacyReady !== true ||
            result?.verifiedCount !== 12 ||
            result?.requiredCount !== 12 ||
            result?.productionReleaseAuthorized !== false ||
            !Array.isArray(result?.criteria) ||
            result.criteria.length !== 12 ||
            result.criteria.some((criterion) => criterion?.status !== "verified")
          ) {
            throw new Error("ULC M5 production evidence did not reach canonical 12/12 readiness.");
          }
          await appendFile(
            process.env.GITHUB_STEP_SUMMARY,
            `ULC Linz Security & Privacy Ready: 12/12 verified on one correlated production snapshot. Production release remains unauthorized.\n`,
          );
          NODE

      - name: Remove temporary production and restore evidence
        if: always()
        shell: bash
        env:
          WORK: ${{ steps.workspace.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -n "${WORK:-}" && "$WORK" == "$RUNNER_TEMP"/appbasis-ulc-m5-* ]]; then
            rm -rf -- "$WORK"
          fi
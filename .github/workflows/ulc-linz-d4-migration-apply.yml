name: ULC D4 Migration Apply

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ulc-linz-d4-migration-apply.yml

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply isolated ULC D4 preview migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require main branch
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC D4 preview mutations are main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Resolve and validate ULC preview app
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/ulc-linz-d4-preview-plan.mjs)"
          test "$(jq -r '.appId' <<<"$PLAN")" = 'ulc-linz' || {
            echo 'ULC D4 preview plan resolved an unexpected app.' >&2
            exit 1
          }
          printf 'migration_target=%s\n' "$(jq -r '.migrationTarget' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Validate and mask isolated preview database credentials
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in APPBASIS_MIGRATION_DATABASE_URL APPBASIS_DATABASE_URL APPBASIS_SECURITY_LOG_DATABASE_URL; do
            value="${!name:-}"
            test -n "$value" || { echo "Missing protected input: $name" >&2; exit 1; }
            echo "::add-mask::$value"
          done
          node --input-type=module <<'NODE'
          import { validateUlcLinzD4PreviewDatabaseCredentials } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";
          validateUlcLinzD4PreviewDatabaseCredentials({
            migrationDatabaseUrl: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            applicationDatabaseUrl: process.env.APPBASIS_DATABASE_URL,
            securityLogDatabaseUrl: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          });
          NODE

      - name: Align isolated preview role passwords with protected URLs
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          PROJECT_NAME: appbasis-ulc-linz-preview
          DATABASE_NAME: appbasis_ulc_linz_preview
          MIGRATION_ROLE: appbasis_ulc_linz_preview_migration
          APPLICATION_ROLE: appbasis_ulc_linz_preview_application
          SECURITY_LOG_ROLE: appbasis_ulc_linz_preview_security_log
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || { echo 'Missing NEON_API_KEY.' >&2; exit 1; }
          test -n "$NEON_ORG_ID" || { echo 'Missing NEON_ORG_ID.' >&2; exit 1; }
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$NEON_ORG_ID"

          API='https://console.neon.tech/api/v2'
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail-with-body --silent --show-error             "${AUTH[@]}"             "$API/projects?org_id=$NEON_ORG_ID&search=$PROJECT_NAME&limit=100"             -o "$TMP_DIR/projects.json"
          PROJECT_ID="$(jq -r --arg name "$PROJECT_NAME" '
            (if type == "array" then . else (.projects // []) end)
            | map(select(.name == $name))
            | if length == 1 then .[0].id else empty end
          ' "$TMP_DIR/projects.json")"
          test -n "$PROJECT_ID" || { echo 'Exact isolated ULC D4 Neon project was not uniquely resolved.' >&2; exit 1; }

          curl --fail-with-body --silent --show-error             "${AUTH[@]}" "$API/projects/$PROJECT_ID/branches" -o "$TMP_DIR/branches.json"
          BRANCH_ID="$(jq -r '
            ((.branches // []) | map(select(.default == true)) | .[0].id) //
            ((.branches // [])[0].id) // empty
          ' "$TMP_DIR/branches.json")"
          test -n "$BRANCH_ID" || { echo 'ULC D4 Neon default branch was not resolved.' >&2; exit 1; }

          curl --fail-with-body --silent --show-error             "${AUTH[@]}" "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/roles" -o "$TMP_DIR/roles.json"
          curl --fail-with-body --silent --show-error             "${AUTH[@]}" "$API/projects/$PROJECT_ID/branches/$BRANCH_ID/databases" -o "$TMP_DIR/databases.json"

          ADMIN_ROLE="$(jq -r '
            ((.roles // []) | map(select(.name == "neondb_owner")) | .[0].name) //
            ((.roles // [])[0].name) // empty
          ' "$TMP_DIR/roles.json")"
          ADMIN_DB="$(jq -r '
            ((.databases // []) | map(select(.name == "neondb")) | .[0].name) //
            ((.databases // [])[0].name) // empty
          ' "$TMP_DIR/databases.json")"
          test -n "$ADMIN_ROLE" || { echo 'Neon owner role was not resolved.' >&2; exit 1; }
          test -n "$ADMIN_DB" || { echo 'Neon admin database was not resolved.' >&2; exit 1; }

          curl --fail-with-body --silent --show-error             "${AUTH[@]}"             "$API/projects/$PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=$ADMIN_DB&role_name=$ADMIN_ROLE&pooled=false"             -o "$TMP_DIR/admin-uri.json"
          ADMIN_URL="$(jq -r '.uri // .connection_uri // empty' "$TMP_DIR/admin-uri.json")"
          test -n "$ADMIN_URL" || { echo 'Direct Neon admin connection URI was not resolved.' >&2; exit 1; }
          echo "::add-mask::$ADMIN_URL"

          extract_password() {
            URL_VALUE="$1" node --input-type=module <<'NODE'
          const url = new URL(process.env.URL_VALUE);
          process.stdout.write(decodeURIComponent(url.password));
          NODE
          }

          MIGRATION_PASSWORD="$(extract_password "$APPBASIS_MIGRATION_DATABASE_URL")"
          APPLICATION_PASSWORD="$(extract_password "$APPBASIS_DATABASE_URL")"
          SECURITY_LOG_PASSWORD="$(extract_password "$APPBASIS_SECURITY_LOG_DATABASE_URL")"
          test -n "$MIGRATION_PASSWORD" || { echo 'Migration URL contains no password.' >&2; exit 1; }
          test -n "$APPLICATION_PASSWORD" || { echo 'Application URL contains no password.' >&2; exit 1; }
          test -n "$SECURITY_LOG_PASSWORD" || { echo 'Security-log URL contains no password.' >&2; exit 1; }
          echo "::add-mask::$MIGRATION_PASSWORD"
          echo "::add-mask::$APPLICATION_PASSWORD"
          echo "::add-mask::$SECURITY_LOG_PASSWORD"

          align_role_password() {
            local role="$1"
            local password="$2"
            psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q               --set=role="$role"               --set=pw="$password" >/dev/null <<'SQL'
          SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'pw') \gexec
          SQL
          }

          align_role_password "$MIGRATION_ROLE" "$MIGRATION_PASSWORD"
          align_role_password "$APPLICATION_ROLE" "$APPLICATION_PASSWORD"
          align_role_password "$SECURITY_LOG_ROLE" "$SECURITY_LOG_PASSWORD"

          echo 'ULC D4 preview role passwords aligned with protected environment credentials.'

      - name: Diagnose protected URL identity and direct authentication
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          PROJECT_NAME: appbasis-ulc-linz-preview
          DATABASE_NAME: appbasis_ulc_linz_preview
          MIGRATION_ROLE: appbasis_ulc_linz_preview_migration
          APPLICATION_ROLE: appbasis_ulc_linz_preview_application
          SECURITY_LOG_ROLE: appbasis_ulc_linz_preview_security_log
        run: |
          set -euo pipefail
          API='https://console.neon.tech/api/v2'
          AUTH=(-H "Authorization: Bearer $NEON_API_KEY" -H 'Accept: application/json')
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail-with-body --silent --show-error             "${AUTH[@]}"             "$API/projects?org_id=$NEON_ORG_ID&search=$PROJECT_NAME&limit=100"             -o "$TMP_DIR/projects.json"
          PROJECT_ID="$(jq -r --arg name "$PROJECT_NAME" '
            (if type == "array" then . else (.projects // []) end)
            | map(select(.name == $name))
            | if length == 1 then .[0].id else empty end
          ' "$TMP_DIR/projects.json")"
          test -n "$PROJECT_ID" || { echo 'DIAG_PROJECT_MATCH=false'; exit 1; }

          curl --fail-with-body --silent --show-error             "${AUTH[@]}" "$API/projects/$PROJECT_ID/branches" -o "$TMP_DIR/branches.json"
          BRANCH_ID="$(jq -r '
            ((.branches // []) | map(select(.default == true)) | .[0].id) //
            ((.branches // [])[0].id) // empty
          ' "$TMP_DIR/branches.json")"
          test -n "$BRANCH_ID" || { echo 'DIAG_BRANCH_MATCH=false'; exit 1; }

          curl --fail-with-body --silent --show-error             "${AUTH[@]}"             "$API/projects/$PROJECT_ID/connection_uri?branch_id=$BRANCH_ID&database_name=neondb&role_name=neondb_owner&pooled=false"             -o "$TMP_DIR/admin-uri.json"
          ADMIN_URL="$(jq -r '.uri // .connection_uri // empty' "$TMP_DIR/admin-uri.json")"
          test -n "$ADMIN_URL" || { echo 'DIAG_ADMIN_URI=false'; exit 1; }
          echo "::add-mask::$ADMIN_URL"
          export ADMIN_URL

          URLS_JSON="$(node --input-type=module <<'NODE'
          const values = {
            migration: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            application: process.env.APPBASIS_DATABASE_URL,
            security: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
            admin: process.env.ADMIN_URL,
          };
          const parsed = Object.fromEntries(
            Object.entries(values).map(([key, value]) => {
              const u = new URL(value);
              return [key, {
                host: u.hostname.toLowerCase(),
                user: decodeURIComponent(u.username),
                database: decodeURIComponent(u.pathname.slice(1)),
              }];
            }),
          );
          process.stdout.write(JSON.stringify(parsed));
          NODE
          )"

          migration_user_ok="$(jq -r --arg expected "$MIGRATION_ROLE" '.migration.user == $expected' <<<"$URLS_JSON")"
          application_user_ok="$(jq -r --arg expected "$APPLICATION_ROLE" '.application.user == $expected' <<<"$URLS_JSON")"
          security_user_ok="$(jq -r --arg expected "$SECURITY_LOG_ROLE" '.security.user == $expected' <<<"$URLS_JSON")"
          migration_host_ok="$(jq -r '.migration.host == .admin.host' <<<"$URLS_JSON")"
          application_host_ok="$(jq -r '.application.host == .admin.host' <<<"$URLS_JSON")"
          security_host_ok="$(jq -r '.security.host == .admin.host' <<<"$URLS_JSON")"
          migration_db_ok="$(jq -r --arg expected "$DATABASE_NAME" '.migration.database == $expected' <<<"$URLS_JSON")"
          application_db_ok="$(jq -r --arg expected "$DATABASE_NAME" '.application.database == $expected' <<<"$URLS_JSON")"
          security_db_ok="$(jq -r --arg expected "$DATABASE_NAME" '.security.database == $expected' <<<"$URLS_JSON")"

          echo "DIAG_MIGRATION_USER_MATCH=$migration_user_ok"
          echo "DIAG_APPLICATION_USER_MATCH=$application_user_ok"
          echo "DIAG_SECURITY_USER_MATCH=$security_user_ok"
          echo "DIAG_MIGRATION_HOST_MATCH=$migration_host_ok"
          echo "DIAG_APPLICATION_HOST_MATCH=$application_host_ok"
          echo "DIAG_SECURITY_HOST_MATCH=$security_host_ok"
          echo "DIAG_MIGRATION_DATABASE_MATCH=$migration_db_ok"
          echo "DIAG_APPLICATION_DATABASE_MATCH=$application_db_ok"
          echo "DIAG_SECURITY_DATABASE_MATCH=$security_db_ok"

          identity_ok=true
          for value in             "$migration_user_ok" "$application_user_ok" "$security_user_ok"             "$migration_host_ok" "$application_host_ok" "$security_host_ok"             "$migration_db_ok" "$application_db_ok" "$security_db_ok"; do
            test "$value" = true || identity_ok=false
          done
          test "$identity_ok" = true || {
            echo 'Protected database URLs do not identify the exact isolated ULC D4 Neon principals/project.' >&2
            exit 1
          }

          if psql "$APPBASIS_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
            echo 'DIAG_APPLICATION_PSQL_AUTH=true'
          else
            echo 'DIAG_APPLICATION_PSQL_AUTH=false'
            exit 1
          fi
          if psql "$APPBASIS_SECURITY_LOG_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
            echo 'DIAG_SECURITY_PSQL_AUTH=true'
          else
            echo 'DIAG_SECURITY_PSQL_AUTH=false'
            exit 1
          fi
          if psql "$APPBASIS_MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; then
            echo 'DIAG_MIGRATION_PSQL_AUTH=true'
          else
            echo 'DIAG_MIGRATION_PSQL_AUTH=false'
            exit 1
          fi

      - name: Diagnose AppBasis postgres-js authentication
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const targets = [
            ["migration", process.env.APPBASIS_MIGRATION_DATABASE_URL],
            ["application", process.env.APPBASIS_DATABASE_URL],
            ["security", process.env.APPBASIS_SECURITY_LOG_DATABASE_URL],
          ];

          let failed = false;
          for (const [label, url] of targets) {
            const client = postgres(url, { prepare: false, connect_timeout: 10 });
            try {
              const rows = await client.unsafe("SELECT current_user AS current_user");
              console.log(`POSTGRES_JS_${label.toUpperCase()}=success rows=${rows.length}`);
            } catch (error) {
              failed = true;
              const safe = {
                name: typeof error?.name === "string" ? error.name : "unknown",
                code: typeof error?.code === "string" ? error.code : "unknown",
                severity: typeof error?.severity === "string" ? error.severity : "unknown",
                routine: typeof error?.routine === "string" ? error.routine : "unknown",
              };
              console.log(`POSTGRES_JS_${label.toUpperCase()}=failure ${JSON.stringify(safe)}`);
            } finally {
              await client.end({ timeout: 1 }).catch(() => {});
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Preflight separated ULC preview runtime principals
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs preflight >/dev/null

      - name: Apply ULC preview database manifest
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_MIGRATION_TARGET: ${{ steps.plan.outputs.migration_target }}
          APPBASIS_APPLY_MIGRATIONS: "1"
        run: node ./tooling/ulc-linz-d4-preview-migrate.mjs

      - name: Reconcile separated ULC preview runtime database access
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_DATABASE_ACCESS: "1"
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs >/dev/null

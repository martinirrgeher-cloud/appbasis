name: Reference Preview Smoke

on:
  workflow_dispatch:
    inputs:
      mutate:
        description: Create and toggle a persistent smoke task
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/reference-preview-smoke.yml
      - .github/workflows/reference-preview-deploy.yml
      - .github/workflows/reference-preview-permission-cutover.yml
      - apps/reference/tooling/reference-preview-permission-foundation.ts
      - apps/reference/tooling/vite.permission-foundation.config.ts
      - apps/reference/tooling/reference-preview-permission-cutover.ts
      - apps/reference/tooling/vite.permission-cutover.config.ts
      - tooling/reference-preview-smoke.mjs

permissions:
  contents: read

jobs:
  smoke:
    name: Reference preview smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: reference-preview
    env:
      APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
      APPBASIS_TRUSTED_PREVIEW_ORIGIN: ${{ vars.APPBASIS_PREVIEW_URL }}
      APPBASIS_SMOKE_USERNAME: ${{ secrets.APPBASIS_SMOKE_USERNAME }}
      APPBASIS_SMOKE_PASSWORD: ${{ secrets.APPBASIS_SMOKE_PASSWORD }}
      APPBASIS_SMOKE_NEW_PASSWORD: ${{ secrets.APPBASIS_SMOKE_NEW_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate automated Demo v0.1 smoke identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$APPBASIS_SMOKE_USERNAME" = 'demo.user' || { echo 'Automated Demo v0.1 smoke requires demo.user.' >&2; exit 1; }
          test -n "$APPBASIS_SMOKE_PASSWORD" || { echo 'Missing protected Demo v0.1 smoke credential.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_SMOKE_PASSWORD"
          if [ -n "$APPBASIS_SMOKE_NEW_PASSWORD" ]; then
            echo "::add-mask::$APPBASIS_SMOKE_NEW_PASSWORD"
          fi

      - name: Run manual Reference preview smoke
        if: github.event_name == 'workflow_dispatch'
        env:
          APPBASIS_SMOKE_MUTATE: ${{ inputs.mutate && '1' || '0' }}
        run: node ./tooling/reference-preview-smoke.mjs

      - name: Run automated Demo v0.1 smoke after smoke-contract changes
        if: github.event_name == 'push'
        env:
          APPBASIS_SMOKE_MUTATE: '1'
        run: node ./tooling/reference-preview-smoke.mjs

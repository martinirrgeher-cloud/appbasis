name: M6 ULC Production Database Binding

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE-ULC-PRODUCTION-HYPERDRIVE to create the dedicated production database binding when absent'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-db-binding
  cancel-in-progress: false

jobs:
  bind-database:
    name: Bind ULC production database
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require explicit main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'M6 production database binding must be dispatched from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "CREATE-ULC-PRODUCTION-HYPERDRIVE" || {
            echo 'Exact production database-binding confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate and mask production binding inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "$ULC_LINZ_PRODUCTION_DATABASE_URL" || { echo 'Missing ULC_LINZ_PRODUCTION_DATABASE_URL.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$ULC_LINZ_PRODUCTION_DATABASE_URL"

      - name: Ensure exact dedicated production Hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_APPLY_PRODUCTION_HYPERDRIVE: '1'
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/ulc-linz-m6-production-hyperdrive.mjs ensure)"
          test -n "$HYPERDRIVE_ID" || { echo 'Production Hyperdrive ensure did not return an ID.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          echo 'Exact ULC production Hyperdrive is ready.'

      - name: Read back exact production Hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/ulc-linz-m6-production-hyperdrive.mjs resolve)"
          test -n "$HYPERDRIVE_ID" || { echo 'Production Hyperdrive read-back did not resolve an ID.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          echo 'ULC production database binding verified.'

name: M5 ULC Security Log Retention

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PURGE-ULC-M5-SECURITY-LOG-RETENTION to delete only security events already older than their exact 12-calendar-month boundary'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  retention-cleanup:
    name: Purge only expired ULC production security events
    if: github.ref == 'refs/heads/main'
    environment: m4-dr
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require explicit production retention approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'ULC M5-F retention cleanup must run from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "PURGE-ULC-M5-SECURITY-LOG-RETENTION" || {
            echo 'Exact ULC M5-F production retention confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact repository contracts before production delete
        run: pnpm run verify:repo

      - name: Validate and mask protected ULC security-log database credentials
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in \
            ULC_LINZ_PRODUCTION_DATABASE_URL \
            ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL
          do
            value="${!name:-}"
            test -n "$value" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::$value"
          done
          node --input-type=module <<'NODE'
          import { parseUlcLinzProductionDatabaseUrl } from './tooling/ulc-linz-m6-production-hyperdrive.mjs';
          const urls = [
            process.env.ULC_LINZ_PRODUCTION_DATABASE_URL,
            process.env.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL,
            process.env.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL,
            process.env.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL,
            process.env.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL,
          ].map((value) => parseUlcLinzProductionDatabaseUrl(value));
          if (new Set(urls.map((entry) => entry.user)).size !== 5) {
            throw new Error('ULC M5-F production security-log principals must be distinct, including backup.');
          }
          if (urls.some((entry) => entry.host !== urls[0].host || entry.database !== urls[0].database)) {
            throw new Error('ULC M5-F production and backup principals must select one production database.');
          }
          NODE

      - name: Verify canonical protected audit access boundary before production delete
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { collectUlcLinzM5SecurityLogAccessEvidence } from './tooling/ulc-linz-m5-security-log-access-evidence.mjs';
          import { parseUlcLinzProductionDatabaseUrl } from './tooling/ulc-linz-m6-production-hyperdrive.mjs';

          const ingest = parseUlcLinzProductionDatabaseUrl(
            process.env.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL,
          );
          const evidence = await collectUlcLinzM5SecurityLogAccessEvidence({
            productionDatabaseUrl: process.env.ULC_LINZ_PRODUCTION_DATABASE_URL,
            backupDatabaseUrl: process.env.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL,
            cleanupDatabaseUrl: process.env.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL,
            readDatabaseUrl: process.env.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL,
            ingestUsername: ingest.user,
          });
          if (
            evidence?.leastPrivilegeAccessVerified !== true ||
            evidence?.protectedOperationalAccessVerified !== true ||
            evidence?.providerMinimumRetentionVerified !== true
          ) {
            throw new Error('ULC M5-F canonical security-log access boundary is incomplete.');
          }
          NODE

      - name: Run exact server-owned twelve-calendar-month cleanup
        id: retention
        shell: bash
        env:
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          RESULT="$RUNNER_TEMP/ulc-m5-f-retention-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node ./tooling/ulc-linz-m5-security-log-retention-run.mjs > "$RESULT"
          RESULT="$RESULT" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile(process.env.RESULT, 'utf8'));
          if (
            result?.schemaVersion !== 1 ||
            result?.application !== 'ulc-linz' ||
            result?.environment !== 'production' ||
            result?.evidenceSource !== 'controlled-production-retention-run' ||
            result?.cleanupAccessVerified !== true ||
            result?.cleanupSucceeded !== true ||
            result?.cleanupResultVerified !== true ||
            result?.expiredRowsRemaining !== false ||
            result?.productionReleaseAuthorized !== false ||
            typeof result?.observedAt !== 'string' ||
            !/^sha256:[0-9a-f]{64}$/.test(result?.enforcementContractDigest ?? '')
          ) {
            throw new Error('ULC M5-F production retention evidence is invalid.');
          }
          NODE
          rm -f -- "$RESULT"

      - name: Record sanitized retention outcome
        shell: bash
        run: |
          printf '%s\n' 'ULC Linz M5-F security-log retention cleanup completed after the canonical protected audit access boundary was verified and the server-owned exact 12-calendar-month contract executed. This does not authorize production release.' >> "$GITHUB_STEP_SUMMARY"

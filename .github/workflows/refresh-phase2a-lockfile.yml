name: Refresh Phase 2A lockfile

on:
  push:
    branches:
      - feature/persistence-identity-foundation-v3

permissions:
  contents: write

concurrency:
  group: refresh-phase2a-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate generated scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^ M pnpm-lock\.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh phase 2A lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}

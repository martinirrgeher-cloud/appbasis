name: ULC D4 Deploy Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ulc-linz-d4-deploy-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch approved ULC D4 preview deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch canonical deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer ${GH_TOKEN}"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ulc-linz-d4-preview.yml/dispatches"             --data '{"ref":"main","inputs":{"operation":"deploy","apply":true}}'

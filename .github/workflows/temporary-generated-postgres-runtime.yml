name: Temporary Generated PostgreSQL Runtime

on:
  push:
    branches:
      - agent/generated-postgres-worker-runtime

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align create-app contract expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tooling/create-app.test.mjs")
          text = path.read_text()
          old = '  assert.deepEqual(packageJson.dependencies, {\n    "@appbasis/identity": "workspace:*",\n    "@appbasis/permissions": "workspace:*",\n    "@appbasis/tasks": "workspace:*",\n    hono: "4.13.1",\n  });\n\n  const worker = await readFile('
          new = '  assert.deepEqual(packageJson.dependencies, {\n    "@appbasis/database": "workspace:*",\n    "@appbasis/identity": "workspace:*",\n    "@appbasis/permissions": "workspace:*",\n    "@appbasis/tasks": "workspace:*",\n    hono: "4.13.1",\n  });\n  assert.equal(packageJson.scripts.test, "vitest run ./test/app.test.ts");\n  assert.equal(\n    packageJson.scripts["test:postgres"],\n    "vitest run --config vitest.postgres.config.ts",\n  );\n\n  const postgresRuntime = await readFile(\n    join(root, "apps", "checklist", "worker", "postgres.ts"),\n    "utf8",\n  );\n  assert.match(postgresRuntime, /createPostgresDatabase/);\n  assert.match(postgresRuntime, /PostgresTaskRepository/);\n\n  const worker = await readFile('
          if text.count(old) != 1:
              raise SystemExit(f"expected one create-app test match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate tasks-minimal through production generator
        run: |
          rm -rf apps/tasks-minimal
          node ./tooling/create-app.mjs \
            --app-id tasks-minimal \
            --display-name "AppBasis Tasks Minimal" \
            --module tasks \
            --platform-service identity \
            --platform-service permissions

      - name: Verify generated runtime
        run: |
          pnpm verify:apps
          pnpm --filter @appbasis/app-tasks-minimal typecheck
          pnpm --filter @appbasis/app-tasks-minimal test
          git diff --check

      - name: Commit generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/create-app.test.mjs apps/tasks-minimal pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat: regenerate PostgreSQL tasks runtime"
            git push origin HEAD:agent/generated-postgres-worker-runtime
          fi

name: ULC Linz – Einmaliger Club-Admin Passwort-Reset

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET-ULC-ADMIN-FIRST-LOGIN to reset only existing ulc.admin'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact reviewed main SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  recovery:
    name: Recover existing ulc.admin first-login credential
    if: github.ref == 'refs/heads/main'
    environment: m4-dr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require exact operator confirmation and first attempt
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = RESET-ULC-ADMIN-FIRST-LOGIN
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify repository and reset contract before write
        run: |
          pnpm run verify:repo
          node --check apps/ulc-linz/tooling/recover-production-club-admin-password.mjs
          cd apps/ulc-linz
          node --experimental-transform-types --import ./tooling/register-native-typescript-resolution.mjs -e "import('./tooling/recover-production-club-admin-password.mjs').then(m => { if (typeof m.recoverProductionClubAdminPassword !== 'function') process.exit(1) })"
          cd ../..
          node --test apps/ulc-linz/tooling/recover-production-club-admin-password-contract.node-check.mjs
      - name: Require live expiry-enforcing production runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            --header "cache-control: no-cache" \
            https://appbasis-ulc-linz-production.martin-irrgeher.workers.dev/api/health/club-admin-recovery \
            | jq -e '.appId == "ulc-linz" and .recoveryGuardVersion == "club-admin-expiry-v1"' >/dev/null
      - name: Reset only existing first-login club administrator
        env:
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
          ULC_LINZ_CLUB_ADMIN_RESET_PASSWORD: ${{ secrets.ULC_LINZ_CLUB_ADMIN_RESET_PASSWORD }}
        working-directory: apps/ulc-linz
        shell: bash
        run: |
          set -euo pipefail
          for secret in ULC_LINZ_PRODUCTION_DATABASE_URL ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET ULC_LINZ_PRODUCTION_ADMIN_PASSWORD ULC_LINZ_CLUB_ADMIN_RESET_PASSWORD; do
            value="${!secret:-}"
            test -n "$value" || { echo "Missing protected input: $secret"; exit 1; }
            echo "::add-mask::$value"
          done
          node --experimental-transform-types --import ./tooling/register-native-typescript-resolution.mjs ./tooling/recover-production-club-admin-password.mjs
      - name: Record sanitized recovery result
        if: success()
        run: |
          echo '### ULC Linz existing club admin credential recovery' >> "$GITHUB_STEP_SUMMARY"
          echo '- exact existing account: ulc.admin' >> "$GITHUB_STEP_SUMMARY"
          echo '- previous sessions revoked; mandatory password change remains required' >> "$GITHUB_STEP_SUMMARY"
          echo '- no worker deployment or pilot ingress change' >> "$GITHUB_STEP_SUMMARY"
          echo '- reset secret must be removed after first login; recovery password expires after 2 hours' >> "$GITHUB_STEP_SUMMARY"

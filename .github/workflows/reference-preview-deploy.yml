name: Reference Preview Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Reference preview deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reference-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask local deployment metadata
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ secrets.APPBASIS_HYPERDRIVE_ID }}
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
        run: |
          test -n "$APPBASIS_HYPERDRIVE_ID" || { echo 'Missing required Reference deployment binding.' >&2; exit 1; }
          test -n "$APPBASIS_PREVIEW_URL" || { echo 'Missing required Reference preview origin.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_HYPERDRIVE_ID"
          echo "::add-mask::$APPBASIS_PREVIEW_URL"

      - name: Render and validate ephemeral deployment configs
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ secrets.APPBASIS_HYPERDRIVE_ID }}
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
        run: node ./tooling/reference-preview-deploy-config.mjs

      - name: Require existing Reference Workers
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          for worker in appbasis-reference appbasis-reference-role-admin; do
            if ! pnpm exec wrangler deployments list --name "$worker" --json >/dev/null 2>&1; then
              echo "Expected pre-created Worker $worker was not found or is not readable." >&2
              exit 1
            fi
          done

      - name: Build isolated persistent permission authority verifier
        run: pnpm --filter @appbasis/reference build:permission-authority

      - name: Verify persistent permission authority before deploy
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_PERMISSION_AUTHORITY_TARGET: reference-preview
        run: |
          set -euo pipefail
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing protected Reference preview database connection.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          node ./apps/reference/tooling/.permission-authority-dist/reference-preview-permission-authority.mjs

      - name: Disable Reference Hyperdrive query caching for fresh reads
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_HYPERDRIVE_ID: ${{ secrets.APPBASIS_HYPERDRIVE_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          test -n "$APPBASIS_HYPERDRIVE_ID" || { echo 'Missing required Reference deployment binding.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$APPBASIS_HYPERDRIVE_ID"
          pnpm exec wrangler hyperdrive update "$APPBASIS_HYPERDRIVE_ID" \
            --caching-disabled \
            --experimental-provision=false \
            --experimental-auto-create=false >/dev/null

      - name: Build Reference preview
        working-directory: apps/reference
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: ./wrangler.preview.generated.json
        run: pnpm run build

      - name: Deploy internal Reference role administration Worker
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --config ./wrangler.role-admin.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Snapshot deployed role administration Worker bindings
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/appbasis-reference-role-admin/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output ./apps/reference/tooling/.reference-role-admin-worker-settings-after-deploy.json
          test -s ./apps/reference/tooling/.reference-role-admin-worker-settings-after-deploy.json || { echo 'Deployed role administration Worker settings snapshot is empty.' >&2; exit 1; }

      - name: Verify internal role administration Worker authority
        env:
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
          APPBASIS_REFERENCE_ROLE_ADMIN_DEPLOYED_WORKER_SETTINGS_PATH: ${{ github.workspace }}/apps/reference/tooling/.reference-role-admin-worker-settings-after-deploy.json
        run: node ./tooling/reference-preview-worker-settings.mjs

      - name: Verify role administration Worker has no public ingress
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          command -v jq >/dev/null || { echo 'jq is required for the role administration ingress gate.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          worker='appbasis-reference-role-admin'
          api='https://api.cloudflare.com/client/v4'
          authorization="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          subdomain_json="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/subdomain" \
            -H "$authorization")"
          test "$(jq -r '.success' <<<"$subdomain_json")" = 'true' || { echo 'Role administration Worker subdomain state could not be verified.' >&2; exit 1; }
          test "$(jq -r '.result.enabled' <<<"$subdomain_json")" = 'false' || { echo 'Role administration Worker is exposed through workers.dev.' >&2; exit 1; }
          test "$(jq -r '.result.previews_enabled' <<<"$subdomain_json")" = 'false' || { echo 'Role administration Worker exposes Preview URLs.' >&2; exit 1; }

          domains_json="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --get \
            "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "$authorization" \
            --data-urlencode "service=${worker}" \
            --data-urlencode 'per_page=100')"
          test "$(jq -r '.success' <<<"$domains_json")" = 'true' || { echo 'Role administration Worker custom domains could not be verified.' >&2; exit 1; }
          test "$(jq '.result | length' <<<"$domains_json")" -eq 0 || { echo 'Role administration Worker has a public custom domain.' >&2; exit 1; }

          page=1
          while :; do
            zones_json="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --get \
              "${api}/zones" \
              -H "$authorization" \
              --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
              --data-urlencode 'per_page=50' \
              --data-urlencode "page=${page}")"
            test "$(jq -r '.success' <<<"$zones_json")" = 'true' || { echo 'Cloudflare zones could not be enumerated for the role administration route gate.' >&2; exit 1; }
            while IFS= read -r zone_id; do
              test -n "$zone_id" || continue
              routes_json="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
                "${api}/zones/${zone_id}/workers/routes" \
                -H "$authorization")"
              test "$(jq -r '.success' <<<"$routes_json")" = 'true' || { echo 'Worker routes could not be verified for a Cloudflare zone.' >&2; exit 1; }
              if jq -e --arg worker "$worker" '.result[] | select(.script == $worker)' <<<"$routes_json" >/dev/null; then
                echo 'Role administration Worker has a public zone route.' >&2
                exit 1
              fi
            done < <(jq -r '.result[].id' <<<"$zones_json")
            total_pages="$(jq -r '.result_info.total_pages // 1' <<<"$zones_json")"
            test "$page" -lt "$total_pages" || break
            page=$((page + 1))
          done

      - name: Deploy Reference preview with repository-owned plaintext variables
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Snapshot deployed Reference Worker bindings
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/appbasis-reference/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output ./apps/reference/tooling/.reference-worker-settings-after-deploy.json
          test -s ./apps/reference/tooling/.reference-worker-settings-after-deploy.json || { echo 'Deployed Reference Worker settings snapshot is empty.' >&2; exit 1; }

      - name: Verify deployed Reference Worker binding authority
        env:
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
          APPBASIS_REFERENCE_DEPLOYED_WORKER_SETTINGS_PATH: ${{ github.workspace }}/apps/reference/tooling/.reference-worker-settings-after-deploy.json
        run: node ./tooling/reference-preview-worker-settings.mjs

      - name: Verify deployed health
        env:
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
          APPBASIS_SMOKE_USERNAME: ''
          APPBASIS_SMOKE_PASSWORD: ''
          APPBASIS_SMOKE_NEW_PASSWORD: ''
          APPBASIS_SMOKE_MUTATE: '0'
        run: node ./tooling/reference-preview-smoke.mjs

      - name: Validate protected demo smoke credential
        shell: bash
        env:
          APPBASIS_SMOKE_PASSWORD: ${{ secrets.APPBASIS_SMOKE_PASSWORD }}
          APPBASIS_SMOKE_NEW_PASSWORD: ${{ secrets.APPBASIS_SMOKE_NEW_PASSWORD }}
        run: |
          test -n "$APPBASIS_SMOKE_PASSWORD" || { echo 'Missing protected demo smoke credential.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_SMOKE_PASSWORD"
          if [ -n "$APPBASIS_SMOKE_NEW_PASSWORD" ]; then
            echo "::add-mask::$APPBASIS_SMOKE_NEW_PASSWORD"
          fi

      - name: Run automated Demo v0.1 acceptance smoke
        env:
          APPBASIS_PREVIEW_URL: ${{ vars.APPBASIS_PREVIEW_URL }}
          APPBASIS_TRUSTED_PREVIEW_ORIGIN: ${{ vars.APPBASIS_PREVIEW_URL }}
          APPBASIS_SMOKE_USERNAME: demo.user
          APPBASIS_SMOKE_PASSWORD: ${{ secrets.APPBASIS_SMOKE_PASSWORD }}
          APPBASIS_SMOKE_NEW_PASSWORD: ${{ secrets.APPBASIS_SMOKE_NEW_PASSWORD }}
          APPBASIS_SMOKE_MUTATE: '1'
          APPBASIS_SMOKE_ROLE_ADMIN_GATEWAY: '1'
        run: node ./tooling/reference-preview-smoke.mjs

      - name: Remove generated permission authority and Worker settings artifacts
        if: always()
        shell: bash
        run: |
          rm -f ./apps/reference/wrangler.preview.generated.json
          rm -f ./apps/reference/wrangler.role-admin.preview.generated.json
          rm -f ./apps/reference/tooling/.reference-worker-settings-after-deploy.json
          rm -f ./apps/reference/tooling/.reference-role-admin-worker-settings-after-deploy.json
          rm -rf ./apps/reference/tooling/.permission-authority-dist

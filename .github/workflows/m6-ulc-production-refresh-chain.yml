name: M6 ULC Production Refresh Chain

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Execute exactly one canonical M6 production-preparation step; rerun this workflow for the next step'
        required: true
        default: runtime_refresh
        type: choice
        options:
          - runtime_refresh
          - private_deploy
          - security_smoke
          - lifecycle_preflight
          - m5_evidence
          - pilot_ingress
          - smoke_principal
          - post_deploy_smoke
      approve_step:
        description: 'Fresh operator approval for this selected step only'
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: m6-ulc-production-refresh-chain
  cancel-in-progress: false

jobs:
  production-refresh-chain:
    name: Execute one approved canonical M6 production step
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require fresh approval and execute selected step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_STEP: ${{ inputs.step }}
          APPROVE_STEP: ${{ inputs.approve_step }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          steps=(runtime_refresh private_deploy security_smoke lifecycle_preflight m5_evidence pilot_ingress smoke_principal post_deploy_smoke)

          valid_step=false
          for step in "${steps[@]}"; do
            if test "$step" = "$SELECTED_STEP"; then
              valid_step=true
              break
            fi
          done
          test "$valid_step" = true || {
            echo 'Selected M6 refresh-chain step is invalid.' >&2
            exit 1
          }
          test "$APPROVE_STEP" = true || {
            echo "Fresh explicit approval is required for selected step: $SELECTED_STEP." >&2
            exit 1
          }

          assert_main_head() {
            local branch_file="$RUNNER_TEMP/m6-chain-main.json"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${AUTH[@]}" "$API/branches/main" > "$branch_file"
            jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha' "$branch_file" >/dev/null || {
              echo 'main moved before the selected M6 step could be dispatched.' >&2
              exit 1
            }
          }

          latest_success_run() {
            local workflow="$1"
            local file="$RUNNER_TEMP/m6-chain-latest-${workflow//[^a-zA-Z0-9]/_}.json"
            assert_main_head
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${AUTH[@]}" "$API/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100" > "$file"
            local id
            id="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' "$file")"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || {
              echo "No successful exact-head prerequisite run exists for $workflow." >&2
              exit 1
            }
            printf '%s\n' "$id"
          }

          dispatch_and_wait() {
            local workflow="$1" inputs_json="$2" label="$3"
            local safe="${workflow//[^a-zA-Z0-9]/_}"
            local payload="$RUNNER_TEMP/m6-chain-dispatch-$safe.json"
            local dispatched="$RUNNER_TEMP/m6-chain-dispatched-$safe.json"
            local run="$RUNNER_TEMP/m6-chain-run-$safe.json"

            assert_main_head
            inputs_json="$(jq -c --arg expected_head_sha "$GITHUB_SHA" '. + {expected_head_sha:$expected_head_sha}' <<<"$inputs_json")"
            jq -cn --arg ref main --argjson inputs "$inputs_json" '{ref:$ref,inputs:$inputs}' > "$payload"
            echo "Dispatching $label..." >&2
            http_status="$(
              curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "$dispatched" --write-out '%{http_code}' \
                --request POST "${AUTH[@]}" --header 'Content-Type: application/json' \
                --data-binary "@$payload" "$API/actions/workflows/$workflow/dispatches"
            )"
            if test "$http_status" != 200; then
              echo "GitHub did not return the pinned workflow-dispatch run identity for $label (HTTP $http_status). The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            fi

            local run_id
            run_id="$(jq -r '.workflow_run_id // empty' "$dispatched")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "GitHub returned an invalid dispatched run ID for $label. The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            }
            jq -e --arg runUrl "$API/actions/runs/$run_id" \
              '.run_url == $runUrl and (.html_url | type == "string" and length > 0)' "$dispatched" >/dev/null || {
              echo "GitHub returned an invalid dispatched run binding for $label. The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            }

            cancel_and_confirm_child() {
              local reason="$1"
              echo "$label: $reason Requesting cancellation of exact child run $run_id before parent exit." >&2
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              for _ in $(seq 1 120); do
                if curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
                  "${AUTH[@]}" "$API/actions/runs/$run_id" > "$run"; then
                  if test "$(jq -r '.status' "$run")" = completed; then
                    conclusion="$(jq -r '.conclusion // ""' "$run")"
                    echo "$label ended with conclusion '$conclusion' after cancellation request." >&2
                    return 0
                  fi
                else
                  echo "$label cancellation status poll failed transiently; retrying bounded cleanup." >&2
                fi
                sleep 5
              done
              echo "$label cancellation could not be confirmed inside the reserved cleanup window; inspect exact child run $run_id before any retry." >&2
              return 1
            }

            local poll_failures=0
            for _ in $(seq 1 1800); do
              if ! curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
                "${AUTH[@]}" "$API/actions/runs/$run_id" > "$run"; then
                poll_failures=$((poll_failures + 1))
                echo "$label child status poll failed ($poll_failures/6); retrying exact known run." >&2
                if test "$poll_failures" -ge 6; then
                  cancel_and_confirm_child 'Child status polling repeatedly failed.' || true
                  echo "$label child status could not be tracked reliably; no retry is safe without inspecting exact child run $run_id." >&2
                  exit 1
                fi
                sleep 5
                continue
              fi
              poll_failures=0

              jq -e --arg sha "$GITHUB_SHA" --arg path ".github/workflows/$workflow" \
                '.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .path == $path' "$run" >/dev/null || {
                cancel_and_confirm_child 'Child-run identity drifted.' || true
                echo "$label child-run identity drifted; stopping fail-closed." >&2
                exit 1
              }
              status="$(jq -r '.status' "$run")"
              if test "$status" = completed; then
                conclusion="$(jq -r '.conclusion // ""' "$run")"
                if test "$conclusion" != success; then
                  {
                    echo '### M6 refresh chain stopped'
                    echo "- step: \`$SELECTED_STEP\`"
                    echo "- child run: \`$run_id\`"
                    echo "- conclusion: \`$conclusion\`"
                    echo '- retry: rerun only this failed step with a new explicit approval'
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "$label failed in child run $run_id. No automatic retry will be attempted." >&2
                  exit 1
                fi
                echo "$label succeeded in child run $run_id." >&2
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done

            cancel_and_confirm_child 'Exceeded the bounded 150-minute queue/execution wait window.' || true
            echo "$label exceeded the bounded wait window; inspect exact child run $run_id before any retry." >&2
            exit 1
          }

          case "$SELECTED_STEP" in
            runtime_refresh)
              dispatch_and_wait \
                'm6-ulc-production-runtime-refresh-config.yml' \
                "$(jq -cn --arg confirmation 'REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME' '{confirmation:$confirmation}')" \
                'runtime refresh configuration' >/dev/null
              ;;
            private_deploy)
              latest_success_run 'm6-ulc-production-runtime-refresh-config.yml' >/dev/null
              dispatch_and_wait \
                'm6-ulc-private-production-refresh-deploy.yml' \
                "$(jq -cn --arg confirmation 'REFRESH-DEPLOY-ULC-PRIVATE-PRODUCTION' '{confirmation:$confirmation}')" \
                'private production refresh deploy' >/dev/null
              ;;
            security_smoke)
              latest_success_run 'm6-ulc-private-production-refresh-deploy.yml' >/dev/null
              dispatch_and_wait \
                'm5-ulc-private-security-smoke.yml' \
                "$(jq -cn --arg confirmation 'RUN-ULC-M5-PRIVATE-SECURITY-SMOKE' '{confirmation:$confirmation}')" \
                'private security logging smoke' >/dev/null
              ;;
            lifecycle_preflight)
              latest_success_run 'm5-ulc-private-security-smoke.yml' >/dev/null
              dispatch_and_wait \
                'm5-ulc-protected-lifecycle-operations.yml' \
                "$(jq -cn --arg operation preflight --arg confirmation 'VERIFY-ULC-M5-LIFECYCLE-BINDING' --arg administrator_username 'ulc.production.admin' '{operation:$operation,confirmation:$confirmation,administrator_username:$administrator_username}')" \
                'protected lifecycle preflight' >/dev/null
              ;;
            m5_evidence)
              latest_success_run 'm5-ulc-protected-lifecycle-operations.yml' >/dev/null
              dispatch_and_wait \
                'm5-ulc-production-evidence.yml' \
                "$(jq -cn --arg confirmation 'VERIFY-ULC-M5-PRODUCTION' '{confirmation:$confirmation,apply_restore:true}')" \
                'M5 production evidence' >/dev/null
              ;;
            pilot_ingress)
              m5_run_id="$(latest_success_run 'm5-ulc-production-evidence.yml')"
              dispatch_and_wait \
                'm6-ulc-production-pilot-ingress.yml' \
                "$(jq -cn --arg confirmation 'ACTIVATE-ULC-M6-PILOT-INGRESS' --arg m5_run_id "$m5_run_id" '{confirmation:$confirmation,m5_run_id:$m5_run_id}')" \
                'workers.dev pilot ingress' >/dev/null
              ;;
            smoke_principal)
              m5_run_id="$(latest_success_run 'm5-ulc-production-evidence.yml')"
              dispatch_and_wait \
                'm6-ulc-production-smoke-principal-bootstrap.yml' \
                "$(jq -cn --arg confirmation 'BOOTSTRAP-ULC-M6-SMOKE-PRINCIPAL' --arg m5_run_id "$m5_run_id" '{confirmation:$confirmation,m5_run_id:$m5_run_id}')" \
                'production smoke principal bootstrap' >/dev/null
              ;;
            post_deploy_smoke)
              pilot_run_id="$(latest_success_run 'm6-ulc-production-pilot-ingress.yml')"
              smoke_principal_run_id="$(latest_success_run 'm6-ulc-production-smoke-principal-bootstrap.yml')"
              dispatch_and_wait \
                'm6-ulc-production-post-deploy-smoke.yml' \
                "$(jq -cn --arg confirmation 'RUN-ULC-M6-PRODUCTION-SMOKE' --arg pilot_ingress_run_id "$pilot_run_id" --arg smoke_principal_run_id "$smoke_principal_run_id" '{confirmation:$confirmation,pilot_ingress_run_id:$pilot_run_id,smoke_principal_run_id:$smoke_principal_run_id}')" \
                'production post-deploy smoke' >/dev/null
              ;;
          esac

          {
            echo '### M6 ULC production refresh chain'
            echo "- exact head: \`$GITHUB_SHA\`"
            echo "- executed step: \`$SELECTED_STEP\`"
            echo '- this dispatch authorizes exactly one canonical production-preparation step'
            echo '- later steps require a separate workflow dispatch and a fresh operator approval'
            echo '- successful exact-head prerequisite runs are reused instead of rerun'
            echo '- parent waits up to 150 minutes, tolerates bounded transient child-status polling failures, and reserves cleanup time to cancel the exact child before its own 180-minute timeout'
            echo '- child workflows remain the canonical executors; the chain performs no provider/database mutation itself'
            echo '- failed child workflows are never retried automatically'
            echo '- final production release: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"

name: M6 ULC Production Refresh Chain

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: 'First canonical step to execute; earlier steps are not rerun'
        required: true
        default: runtime_refresh
        type: choice
        options:
          - runtime_refresh
          - private_deploy
          - security_smoke
          - lifecycle_preflight
          - m5_evidence
          - pilot_ingress
          - smoke_principal
          - post_deploy_smoke
      stop_after:
        description: 'Last canonical step to execute in this attempt'
        required: true
        default: post_deploy_smoke
        type: choice
        options:
          - runtime_refresh
          - private_deploy
          - security_smoke
          - lifecycle_preflight
          - m5_evidence
          - pilot_ingress
          - smoke_principal
          - post_deploy_smoke
      approve_runtime_refresh:
        description: 'Approve this attempt to upload the exact current private runtime configuration'
        required: true
        default: false
        type: boolean
      approve_private_deploy:
        description: 'Approve this attempt to deploy the exact current runtime privately'
        required: true
        default: false
        type: boolean
      approve_security_smoke:
        description: 'Approve this attempt to execute the private production security-log smoke'
        required: true
        default: false
        type: boolean
      approve_lifecycle_preflight:
        description: 'Approve this attempt to execute the isolated protected lifecycle preflight'
        required: true
        default: false
        type: boolean
      approve_m5_evidence:
        description: 'Approve this attempt to write only to the isolated restore target and collect M5 evidence'
        required: true
        default: false
        type: boolean
      approve_pilot_ingress:
        description: 'Approve this attempt to verify/enable only canonical workers.dev pilot ingress with previews disabled'
        required: true
        default: false
        type: boolean
      approve_smoke_principal:
        description: 'Approve this attempt to provision/reconcile the dedicated production smoke principal'
        required: true
        default: false
        type: boolean
      approve_post_deploy_smoke:
        description: 'Approve this attempt to execute the production pilot post-deploy smoke'
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: m6-ulc-production-refresh-chain
  cancel-in-progress: false

jobs:
  production-refresh-chain:
    name: Orchestrate canonical M6 production refresh steps
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Require explicit per-step approvals and execute selected range
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
          STOP_AFTER: ${{ inputs.stop_after }}
          APPROVE_RUNTIME_REFRESH: ${{ inputs.approve_runtime_refresh }}
          APPROVE_PRIVATE_DEPLOY: ${{ inputs.approve_private_deploy }}
          APPROVE_SECURITY_SMOKE: ${{ inputs.approve_security_smoke }}
          APPROVE_LIFECYCLE_PREFLIGHT: ${{ inputs.approve_lifecycle_preflight }}
          APPROVE_M5_EVIDENCE: ${{ inputs.approve_m5_evidence }}
          APPROVE_PILOT_INGRESS: ${{ inputs.approve_pilot_ingress }}
          APPROVE_SMOKE_PRINCIPAL: ${{ inputs.approve_smoke_principal }}
          APPROVE_POST_DEPLOY_SMOKE: ${{ inputs.approve_post_deploy_smoke }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2026-03-10'
          )
          steps=(runtime_refresh private_deploy security_smoke lifecycle_preflight m5_evidence pilot_ingress smoke_principal post_deploy_smoke)
          declare -A rank=(
            [runtime_refresh]=1
            [private_deploy]=2
            [security_smoke]=3
            [lifecycle_preflight]=4
            [m5_evidence]=5
            [pilot_ingress]=6
            [smoke_principal]=7
            [post_deploy_smoke]=8
          )
          declare -A approval_var=(
            [runtime_refresh]=APPROVE_RUNTIME_REFRESH
            [private_deploy]=APPROVE_PRIVATE_DEPLOY
            [security_smoke]=APPROVE_SECURITY_SMOKE
            [lifecycle_preflight]=APPROVE_LIFECYCLE_PREFLIGHT
            [m5_evidence]=APPROVE_M5_EVIDENCE
            [pilot_ingress]=APPROVE_PILOT_INGRESS
            [smoke_principal]=APPROVE_SMOKE_PRINCIPAL
            [post_deploy_smoke]=APPROVE_POST_DEPLOY_SMOKE
          )

          test -n "${rank[$START_AT]:-}" && test -n "${rank[$STOP_AFTER]:-}" || {
            echo 'Selected M6 refresh-chain range is invalid.' >&2
            exit 1
          }
          start_rank="${rank[$START_AT]}"
          stop_rank="${rank[$STOP_AFTER]}"
          (( start_rank <= stop_rank )) || {
            echo 'M6 refresh-chain start_at must not be after stop_after.' >&2
            exit 1
          }

          selected() {
            local step="$1" step_rank="${rank[$1]}"
            (( step_rank >= start_rank && step_rank <= stop_rank ))
          }

          for step in "${steps[@]}"; do
            if selected "$step"; then
              variable="${approval_var[$step]}"
              test "${!variable:-false}" = true || {
                echo "Fresh explicit approval is required for selected step: $step." >&2
                exit 1
              }
            fi
          done

          assert_main_head() {
            local branch_file="$RUNNER_TEMP/m6-chain-main.json"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${AUTH[@]}" "$API/branches/main" > "$branch_file"
            jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha' "$branch_file" >/dev/null || {
              echo 'main moved during the M6 refresh chain; no further child workflow will be dispatched.' >&2
              exit 1
            }
          }

          latest_success_run() {
            local workflow="$1"
            local file="$RUNNER_TEMP/m6-chain-latest-${workflow//[^a-zA-Z0-9]/_}.json"
            assert_main_head
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              "${AUTH[@]}" "$API/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100" > "$file"
            local id
            id="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' "$file")"
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || {
              echo "No successful exact-head prerequisite run exists for $workflow." >&2
              exit 1
            }
            printf '%s\n' "$id"
          }

          dispatch_and_wait() {
            local workflow="$1" inputs_json="$2" label="$3"
            local safe="${workflow//[^a-zA-Z0-9]/_}"
            local payload="$RUNNER_TEMP/m6-chain-dispatch-$safe.json"
            local dispatched="$RUNNER_TEMP/m6-chain-dispatched-$safe.json"
            local run="$RUNNER_TEMP/m6-chain-run-$safe.json"

            assert_main_head
            jq -cn --arg ref main --argjson inputs "$inputs_json" '{ref:$ref,inputs:$inputs}' > "$payload"
            echo "Dispatching $label..." >&2
            http_status="$(
              curl --silent --show-error --connect-timeout 10 --max-time 30 \
                --output "$dispatched" --write-out '%{http_code}' \
                --request POST "${AUTH[@]}" --header 'Content-Type: application/json' \
                --data-binary "@$payload" "$API/actions/workflows/$workflow/dispatches"
            )"
            if test "$http_status" != 200; then
              echo "GitHub did not return the pinned workflow-dispatch run identity for $label (HTTP $http_status). The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            fi

            local run_id
            run_id="$(jq -r '.workflow_run_id // empty' "$dispatched")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo "GitHub returned an invalid dispatched run ID for $label. The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            }
            jq -e --arg runUrl "$API/actions/runs/$run_id" \
              '.run_url == $runUrl and (.html_url | type == "string" and length > 0)' "$dispatched" >/dev/null || {
              echo "GitHub returned an invalid dispatched run binding for $label. The child attempt may exist, so any retry requires fresh approval." >&2
              exit 1
            }

            for _ in $(seq 1 480); do
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
                "${AUTH[@]}" "$API/actions/runs/$run_id" > "$run"
              jq -e --arg sha "$GITHUB_SHA" --arg path ".github/workflows/$workflow" \
                '.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .path == $path' "$run" >/dev/null || {
                echo "$label child-run identity drifted; stopping fail-closed." >&2
                exit 1
              }
              status="$(jq -r '.status' "$run")"
              if test "$status" = completed; then
                conclusion="$(jq -r '.conclusion // ""' "$run")"
                if test "$conclusion" != success; then
                  {
                    echo "### M6 refresh chain stopped"
                    echo "- step: \`$label\`"
                    echo "- child run: \`$run_id\`"
                    echo "- conclusion: \`$conclusion\`"
                    echo '- retry: requires a new explicit approval for every step selected in the next attempt'
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "$label failed in child run $run_id. No automatic retry will be attempted." >&2
                  exit 1
                fi
                echo "$label succeeded in child run $run_id." >&2
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done

            echo "$label did not complete inside the bounded wait window. No automatic retry will be attempted." >&2
            exit 1
          }

          m5_run_id=''
          pilot_run_id=''
          smoke_principal_run_id=''

          if selected runtime_refresh; then
            dispatch_and_wait \
              'm6-ulc-production-runtime-refresh-config.yml' \
              "$(jq -cn --arg confirmation 'REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME' '{confirmation:$confirmation}')" \
              'runtime refresh configuration' >/dev/null
          fi

          if selected private_deploy; then
            dispatch_and_wait \
              'm6-ulc-private-production-refresh-deploy.yml' \
              "$(jq -cn --arg confirmation 'REFRESH-DEPLOY-ULC-PRIVATE-PRODUCTION' '{confirmation:$confirmation}')" \
              'private production refresh deploy' >/dev/null
          fi

          if selected security_smoke; then
            dispatch_and_wait \
              'm5-ulc-private-security-smoke.yml' \
              "$(jq -cn --arg confirmation 'RUN-ULC-M5-PRIVATE-SECURITY-SMOKE' '{confirmation:$confirmation}')" \
              'private security logging smoke' >/dev/null
          fi

          if selected lifecycle_preflight; then
            dispatch_and_wait \
              'm5-ulc-protected-lifecycle-operations.yml' \
              "$(jq -cn --arg operation preflight --arg confirmation 'VERIFY-ULC-M5-LIFECYCLE-BINDING' --arg administrator_username 'ulc.production.admin' '{operation:$operation,confirmation:$confirmation,administrator_username:$administrator_username}')" \
              'protected lifecycle preflight' >/dev/null
          fi

          if selected m5_evidence; then
            m5_run_id="$(dispatch_and_wait \
              'm5-ulc-production-evidence.yml' \
              "$(jq -cn --arg confirmation 'VERIFY-ULC-M5-PRODUCTION' '{confirmation:$confirmation,apply_restore:true}')" \
              'M5 production evidence')"
          fi

          if selected pilot_ingress; then
            if test -z "$m5_run_id"; then
              m5_run_id="$(latest_success_run 'm5-ulc-production-evidence.yml')"
            fi
            pilot_run_id="$(dispatch_and_wait \
              'm6-ulc-production-pilot-ingress.yml' \
              "$(jq -cn --arg confirmation 'ACTIVATE-ULC-M6-PILOT-INGRESS' --arg m5_run_id "$m5_run_id" '{confirmation:$confirmation,m5_run_id:$m5_run_id}')" \
              'workers.dev pilot ingress')"
          fi

          if selected smoke_principal; then
            if test -z "$m5_run_id"; then
              m5_run_id="$(latest_success_run 'm5-ulc-production-evidence.yml')"
            fi
            smoke_principal_run_id="$(dispatch_and_wait \
              'm6-ulc-production-smoke-principal-bootstrap.yml' \
              "$(jq -cn --arg confirmation 'BOOTSTRAP-ULC-M6-SMOKE-PRINCIPAL' --arg m5_run_id "$m5_run_id" '{confirmation:$confirmation,m5_run_id:$m5_run_id}')" \
              'production smoke principal bootstrap')"
          fi

          if selected post_deploy_smoke; then
            if test -z "$pilot_run_id"; then
              pilot_run_id="$(latest_success_run 'm6-ulc-production-pilot-ingress.yml')"
            fi
            if test -z "$smoke_principal_run_id"; then
              smoke_principal_run_id="$(latest_success_run 'm6-ulc-production-smoke-principal-bootstrap.yml')"
            fi
            dispatch_and_wait \
              'm6-ulc-production-post-deploy-smoke.yml' \
              "$(jq -cn --arg confirmation 'RUN-ULC-M6-PRODUCTION-SMOKE' --arg pilot_ingress_run_id "$pilot_run_id" --arg smoke_principal_run_id "$smoke_principal_run_id" '{confirmation:$confirmation,pilot_ingress_run_id:$pilot_ingress_run_id,smoke_principal_run_id:$smoke_principal_run_id}')" \
              'production post-deploy smoke' >/dev/null
          fi

          {
            echo '### M6 ULC production refresh chain'
            echo "- exact head: \`$GITHUB_SHA\`"
            echo "- executed range: \`$START_AT\` → \`$STOP_AFTER\`"
            echo '- each selected production/provider step required its own fresh boolean approval in this dispatch'
            echo '- child workflows remain the canonical executors; the chain performs no provider/database mutation itself'
            echo '- failed child workflows are never retried automatically'
            echo '- final production release: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"

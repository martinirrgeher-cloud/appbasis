name: M4 Restore Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-restore-verification
  cancel-in-progress: false

jobs:
  restore-verification:
    name: Read-only restored database verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: m4-dr

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask restore verification inputs
        shell: bash
        env:
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT: ${{ secrets.APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_M4_RESTORE_DATABASE_URL" || { echo 'Missing M4 restore database connection.' >&2; exit 1; }
          test -n "$APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT" || { echo 'Missing M4 expected restore fingerprint.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_M4_RESTORE_DATABASE_URL"
          echo "::add-mask::$APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT"

      - name: Verify restored database fingerprint
        env:
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT: ${{ secrets.APPBASIS_M4_EXPECTED_RESTORE_FINGERPRINT }}
        run: node ./tooling/m4-restore-verification.mjs verify

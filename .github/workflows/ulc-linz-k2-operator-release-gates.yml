name: K2 operator release gates offline regression
on:
  pull_request:
    paths:
      - "apps/ulc-linz/docs/K2-P01-OPERATOR-RELEASE-GATES.md"
      - "tooling/ulc-linz-k2-operator-release-gates.test.mjs"
      - ".github/workflows/ulc-linz-k2-operator-release-gates.yml"
permissions:
  contents: read
jobs:
  offline-operator-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Check operator gates without provider access
        run: node --test tooling/ulc-linz-k2-operator-release-gates.test.mjs

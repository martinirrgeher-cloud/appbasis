name: Generated Tasks Preview Hyperdrive Bootstrap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create the dedicated generated preview Hyperdrive only when absent
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generated-tasks-preview-hyperdrive-appbasis-tasks-minimal
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generated tasks preview Hyperdrive bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: generated-tasks-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate protected provisioning inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare Hyperdrive credential.' >&2; exit 1; }
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing dedicated generated preview database connection.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$APPBASIS_DATABASE_URL"

      - name: Ensure dedicated generated preview Hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_APPLY_HYPERDRIVE: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/generated-tasks-preview-hyperdrive.mjs ensure)"
          test -n "$HYPERDRIVE_ID" || { echo 'Dedicated generated preview Hyperdrive was not resolved.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          echo 'Dedicated generated preview Hyperdrive target is ready.'

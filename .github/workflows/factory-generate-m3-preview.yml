name: Generate M3 Preview Through Factory

on:
  push:
    branches:
      - agent/m3-preview-factory-create

permissions:
  contents: write

concurrency:
  group: factory-generate-m3-preview
  cancel-in-progress: false

jobs:
  generate:
    name: Generate m3-preview
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out generation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m3-preview-factory-create
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Factory and create app
        shell: bash
        run: |
          set -euo pipefail
          node tooling/factory-ui/server.mjs >/tmp/appbasis-factory.log 2>&1 &
          FACTORY_PID=$!
          trap 'kill "$FACTORY_PID" 2>/dev/null || true; cat /tmp/appbasis-factory.log || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4174/api/factory/snapshot >/tmp/factory-before.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Factory did not become ready." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H 'Origin: http://127.0.0.1:4174' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"appId":"m3-preview","displayName":"AppBasis M3 Preview","modules":["tasks"],"platformServices":["identity","permissions"]}' \
            http://127.0.0.1:4174/api/factory/apps \
            >/tmp/factory-create.json

          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/factory-create.json", "utf8"));
            if (result?.app?.appId !== "m3-preview" || result?.relativeDestination !== "apps/m3-preview") {
              throw new Error("Factory create response did not confirm m3-preview.");
            }
          '

          curl --fail --silent --show-error \
            http://127.0.0.1:4174/api/factory/snapshot >/tmp/factory-after.json
          node -e '
            const fs = require("node:fs");
            const snapshot = JSON.parse(fs.readFileSync("/tmp/factory-after.json", "utf8"));
            if (!snapshot.apps?.some((app) => app.appId === "m3-preview")) {
              throw new Error("Factory snapshot did not re-recognize m3-preview.");
            }
          '

          kill "$FACTORY_PID"
          wait "$FACTORY_PID" || true
          trap - EXIT

      - name: Verify generated app contracts
        run: pnpm run verify:apps

      - name: Remove one-time generator workflow and validate diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/factory-generate-m3-preview.yml
          git add -A -- apps/m3-preview pnpm-lock.yaml .github/workflows/factory-generate-m3-preview.yml

          if git diff --cached --quiet; then
            echo "Factory generation produced no committed result." >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              apps/m3-preview/*|pnpm-lock.yaml|.github/workflows/factory-generate-m3-preview.yml) ;;
              *)
                echo "Unexpected generated path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          test -f apps/m3-preview/appbasis.app.json
          test -f apps/m3-preview/appbasis.database.json
          test -f apps/m3-preview/package.json
          test -f apps/m3-preview/worker/index.ts
          test ! -e .github/workflows/factory-generate-m3-preview.yml
          git diff --cached --check

      - name: Commit canonical Factory output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: generate m3-preview through Factory'
          git push origin HEAD:agent/m3-preview-factory-create

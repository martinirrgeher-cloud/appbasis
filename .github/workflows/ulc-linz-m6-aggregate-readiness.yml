name: ULC M6 Consolidated Read-only Readiness Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AUDIT-ULC-M6-READINESS to check all known production gates without writes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ulc-m6-consolidated-read-only-audit
  cancel-in-progress: false

jobs:
  initial-provider-and-app-inventory:
    name: Initial production provider, Worker, Hyperdrive and app contract audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ULC_LINZ_PRODUCTION_CLOUDFLARE_API_TOKEN }}
      ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
      ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
      ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
    steps:
      - name: Require exact read-only approval from main
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "AUDIT-ULC-M6-READINESS"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Summarize current 69-table P3 release scope without a second workflow
        run: node tooling/ulc-linz-p3-release-inventory.mjs
      - name: Verify read-only auditor syntax
        run: node --check tooling/ulc-linz-m6-aggregate-readiness.mjs
      - name: Collect all sanitized initial production blockers without writes
        run: node tooling/ulc-linz-m6-aggregate-readiness.mjs

  protected-followup-secret-inventory:
    name: Protected pilot-chain credentials and read-only Cloudflare probes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m4-dr
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
      ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
      ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL }}
      ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
      ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
      ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
      ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
      ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
      ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD }}
      ULC_LINZ_PRODUCTION_SMOKE_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_SMOKE_PASSWORD }}
    steps:
      - name: Require exact protected read-only approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "AUDIT-ULC-M6-READINESS"
      - name: Evaluate presence and validity of existing protected pilot prerequisites
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const names = [
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_API_WRITE_TOKEN",
            "ULC_LINZ_PRODUCTION_DATABASE_URL",
            "ULC_LINZ_PRODUCTION_BACKUP_DATABASE_URL",
            "ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL",
            "ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL",
            "ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL",
            "ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET",
            "ULC_LINZ_PRODUCTION_ADMIN_PASSWORD",
            "ULC_LINZ_PRODUCTION_SMOKE_BOOTSTRAP_PASSWORD",
            "ULC_LINZ_PRODUCTION_SMOKE_PASSWORD",
          ];
          const results = names.map(name => ({
            name, result: process.env[name] ? "PASS" : "BLOCKED"
          }));
          for (const tokenName of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_API_WRITE_TOKEN"]) {
            let status = "not checked";
            if (process.env[tokenName] && process.env.CLOUDFLARE_ACCOUNT_ID) {
              try {
                const response = await fetch(
                  "https://api.cloudflare.com/client/v4/accounts/" +
                    process.env.CLOUDFLARE_ACCOUNT_ID + "/workers/subdomain",
                  {method:"GET",headers:{Authorization:"Bearer " + process.env[tokenName]},
                    signal: AbortSignal.timeout(18000)}
                );
                status = "HTTP " + response.status;
              } catch {status = "transport failure";}
            }
            results.push({name:tokenName+" Cloudflare GET probe",
              result:status==="HTTP 200"?"PASS":"BLOCKED",observation:status});
          }
          const count=results.filter(x=>x.result==="BLOCKED").length;
          const output=[
            "## ULC M6 protected follow-up inventory (read-only)",
            "",
            "| Credential or access probe | Status | Sanitized observation |",
            "|---|---|---|",
            ...results.map(x=>"| "+x.name+" | "+x.result+" | "+(x.observation||"present / missing only")+" |"),
            "",
            "No credentials, provider response bodies, row data, or secrets were printed.",
          ];
          for(const x of results)
            console.log("["+x.result+"] "+x.name+(x.observation?" "+x.observation:""));
          if(process.env.GITHUB_STEP_SUMMARY)
            await appendFile(process.env.GITHUB_STEP_SUMMARY,output.join("\n")+"\n");
          if(count)process.exitCode=1;
          NODE

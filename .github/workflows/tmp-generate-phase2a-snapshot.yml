name: Temporary Phase 2A snapshot generation

on:
  push:
    branches:
      - feature/persistence-identity-foundation-v3

permissions:
  contents: write

concurrency:
  group: phase2a-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle artifacts
        run: pnpm run db:generate

      - name: Commit generated artifacts if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/database/drizzle; then
            echo "Drizzle artifacts already reproducible; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/drizzle
          git commit -m "chore(database): generate phase 2A drizzle snapshot"
          git push origin HEAD:feature/persistence-identity-foundation-v3

name: M6 ULC Production Pilot Ingress

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ACTIVATE-ULC-M6-PILOT-INGRESS to enable only the canonical workers.dev endpoint after exact-head M5 evidence'
        required: true
        type: string
      m5_run_id:
        description: 'Successful M5 ULC Production Evidence run ID on this exact main head'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  activate-pilot-ingress:
    name: Activate guarded ULC workers.dev pilot ingress
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m4-dr
    env:
      TARGET_WORKER: appbasis-ulc-linz-production

    steps:
      - name: Require explicit main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          M5_RUN_ID: ${{ inputs.m5_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Pilot ingress activation must be dispatched from main.' >&2; exit 1; }
          test "$CONFIRMATION" = "ACTIVATE-ULC-M6-PILOT-INGRESS" || { echo 'Exact pilot ingress activation confirmation is required.' >&2; exit 1; }
          [[ "$M5_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'M5 run ID is invalid.' >&2; exit 1; }

      - name: Require successful fresh exact-head M5 production evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M5_RUN_ID: ${{ inputs.m5_run_id }}
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/m5-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${M5_RUN_ID}" > "$run"
          jq -e --arg sha "$GITHUB_SHA" \
            '.name == "M5 ULC Production Evidence" and .path == ".github/workflows/m5-ulc-production-evidence.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success"' \
            "$run" >/dev/null || { echo 'M5 production evidence is not a successful exact-head main run.' >&2; exit 1; }
          created_at="$(jq -er '.created_at | select(type == "string")' "$run")"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null)" || { echo 'M5 production evidence creation time is invalid.' >&2; exit 1; }
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - created_epoch))"
          if (( age_seconds < 0 || age_seconds > 900 )); then
            echo 'M5 production evidence is outside the fail-closed 15-minute freshness window.' >&2
            exit 1
          fi

      - name: Validate and mask protected provider inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_API_WRITE_TOKEN; do
            test -n "${!name:-}" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done

      - name: Recheck exact pilot ingress state before write
        id: before
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pilot-before.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/subdomain" > "$response"
          jq -e '.success == true and (.result | type == "object") and (.result.enabled | type == "boolean") and (.result.previews_enabled | type == "boolean")' "$response" >/dev/null || { echo 'Worker pilot-ingress state is malformed or unsuccessful.' >&2; exit 1; }
          enabled="$(jq -r '.result.enabled' "$response")"
          previews="$(jq -r '.result.previews_enabled' "$response")"
          if test "$enabled" = true && test "$previews" = false; then
            echo 'write_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'write_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Revalidate fresh exact-head M5 evidence immediately before write
        if: steps.before.outputs.write_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M5_RUN_ID: ${{ inputs.m5_run_id }}
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/m5-run-before-write.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${M5_RUN_ID}" > "$run"
          jq -e --arg sha "$GITHUB_SHA" \
            '.name == "M5 ULC Production Evidence" and .path == ".github/workflows/m5-ulc-production-evidence.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $sha and .status == "completed" and .conclusion == "success"' \
            "$run" >/dev/null || { echo 'M5 production evidence changed or is no longer a successful exact-head main run.' >&2; exit 1; }
          created_at="$(jq -er '.created_at | select(type == "string")' "$run")"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null)" || { echo 'M5 production evidence creation time is invalid.' >&2; exit 1; }
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - created_epoch))"
          if (( age_seconds < 0 || age_seconds > 900 )); then
            echo 'M5 production evidence expired before pilot-ingress activation.' >&2
            exit 1
          fi

      - name: Enable canonical workers.dev pilot ingress with previews disabled
        if: steps.before.outputs.write_required == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pilot-enable.json"
          http_status="$(
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"enabled":true,"previews_enabled":false}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/subdomain"
          )"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            jq -r '(.errors // [])[:5][] | "Cloudflare error \(.code // "unknown"): \((.message // "unspecified") | tostring | gsub("[\\r\\n]"; " ") | .[0:300])"' "$response" >&2 2>/dev/null || true
            echo "Cloudflare pilot ingress activation failed with HTTP $http_status." >&2
            exit 1
          fi
          jq -e '.success == true and .result.enabled == true and .result.previews_enabled == false' "$response" >/dev/null || { echo 'Cloudflare pilot ingress activation returned an unexpected response.' >&2; exit 1; }

      - name: Verify exact pilot ingress state after activation
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pilot-after.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/subdomain" > "$response"
          jq -e '.success == true and .result.enabled == true and .result.previews_enabled == false' "$response" >/dev/null || { echo 'Canonical workers.dev pilot ingress is not provably enabled with previews disabled.' >&2; exit 1; }
          {
            echo '### ULC M6 temporary Cloudflare pilot ingress'
            echo '- canonical workers.dev endpoint: enabled'
            echo '- preview URLs: disabled'
            echo '- exact-head M5 Security & Privacy evidence: verified prerequisite'
            echo '- custom organizational domain: not activated'
            echo '- final organizational go-live: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"

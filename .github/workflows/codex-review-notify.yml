name: Codex review notification

on:
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created

permissions:
  pull-requests: write

jobs:
  notify:
    name: Notify PR author
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       startsWith(github.event.comment.body, 'Codex Review:'))
    concurrency:
      group: >-
        codex-review-notify-${{ github.event.pull_request.number || github.event.issue.number }}-${{
          github.event.review.id || github.event.comment.id
        }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Mention PR author
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          REVIEW_ID: ${{ github.event.review.id }}
          CURRENT_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request_review" ]]; then
            EVENT_KEY="review-${REVIEW_ID}"
          else
            EVENT_KEY="clean-${CURRENT_COMMENT_ID}"
          fi

          MARKER="<!-- codex-review-notify:${EVENT_KEY} -->"
          PAGE=1
          while :; do
            EXISTING_COMMENTS="$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100&page=${PAGE}")"

            if jq -e --arg marker "${MARKER}" 'any(.[]; ((.body // "") | contains($marker)))' <<<"${EXISTING_COMMENTS}" >/dev/null; then
              echo "Notification already exists for ${EVENT_KEY}."
              exit 0
            fi

            COMMENT_COUNT="$(jq 'length' <<<"${EXISTING_COMMENTS}")"
            if [[ "${COMMENT_COUNT}" -lt 100 ]]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          BODY="$(printf '@%s Codex-Code-Review fertig. Du kannst jetzt in ChatGPT **fertig** schreiben.\n\n%s' "${PR_AUTHOR}" "${MARKER}")"
          PAYLOAD="$(jq -n --arg body "$BODY" '{body: $body}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data "$PAYLOAD"

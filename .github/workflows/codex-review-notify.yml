name: Codex review notification

on:
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  notify:
    name: Notify PR author
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       startsWith(github.event.comment.body, 'Codex Review:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Mention PR author
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail

          BODY="@${PR_AUTHOR} Codex-Code-Review fertig. Du kannst jetzt in ChatGPT **fertig** schreiben."
          PAYLOAD="$(jq -n --arg body "$BODY" '{body: $body}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data "$PAYLOAD"

name: ULC E6H Preview Parity

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply exercise-catalog schema v3 and deploy the standard-module preview runtime with the pre-created R2 binding
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  plan:
    name: Plan E6H preview parity rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Require main branch
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC E6H preview parity rollout is main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Render E6H parity plan
        run: node ./tooling/ulc-linz-exercise-catalog-preview-parity.mjs plan

  apply:
    name: Apply E6H parity to isolated ULC preview
    needs: plan
    if: ${{ inputs.apply == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require exact main mutation scope
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC E6H preview parity mutation is main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and mask protected inputs
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_ROOT_ADMIN_PASSWORD: ${{ secrets.APPBASIS_ROOT_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPBASIS_MIGRATION_DATABASE_URL APPBASIS_DATABASE_URL APPBASIS_SECURITY_LOG_DATABASE_URL APPBASIS_BETTER_AUTH_SECRET APPBASIS_ROOT_ADMIN_PASSWORD CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            value="${!name:-}"
            test -n "$value" || {
              echo "Missing protected input: $name" >&2
              exit 1
            }
            echo "::add-mask::$value"
          done

          node --input-type=module <<'NODE'
          import { validateUlcLinzD4PreviewDatabaseCredentials } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";

          const credentials = validateUlcLinzD4PreviewDatabaseCredentials({
            migrationDatabaseUrl: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            applicationDatabaseUrl: process.env.APPBASIS_DATABASE_URL,
            securityLogDatabaseUrl: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          });
          if (
            credentials.migration.database !== "appbasis_ulc_linz_preview" ||
            credentials.migration.user !== "appbasis_ulc_linz_preview_migration"
          ) {
            throw new Error("E6H protected migration credential does not identify the exact preview target.");
          }
          NODE

      - name: Resolve preview worker and URL
        id: preview
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/ulc-linz-d4-preview-plan.mjs)"
          WORKER_NAME="$(jq -r '.workerName' <<<"$PLAN")"
          [[ "$WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'ULC preview worker name is invalid.' >&2
            exit 1
          }

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          BASE_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          printf 'worker_name=%s\nbase_url=%s\n' "$WORKER_NAME" "$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Require existing standard-module preview runtime
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'ULC preview Worker is not bootstrapped.' >&2
            exit 1
          }
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'ULC preview Worker is missing BETTER_AUTH_SECRET.' >&2
            exit 1
          }

      - name: Verify current runtime remains standard-module
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Inspect current E6H parity state
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-exercise-catalog-preview-parity.mjs inspect

      - name: Record least-privilege R2 prerequisite
        shell: bash
        run: |
          {
            echo 'The dedicated preview R2 bucket is treated as pre-created infrastructure.'
            echo 'The Worker deployment token intentionally does not require R2 management permissions.'
            echo 'Required bucket: appbasis-ulc-linz-preview-exercise-media (jurisdiction: eu)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply additive exercise-catalog schema v3
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_EXERCISE_CATALOG_PARITY: "1"
        run: node ./tooling/ulc-linz-exercise-catalog-preview-parity.mjs apply

      - name: Verify schema v3 and runtime DML privileges
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-exercise-catalog-preview-parity.mjs verify

      - name: Resolve isolated ULC preview Hyperdrives
        id: hyperdrives
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          TARGETS="$(node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs resolve)"
          APPLICATION_ID="$(jq -r '.applicationId' <<<"$TARGETS")"
          SECURITY_LOG_ID="$(jq -r '.securityLogId' <<<"$TARGETS")"
          test -n "$APPLICATION_ID"
          test -n "$SECURITY_LOG_ID"
          test "$APPLICATION_ID" != "$SECURITY_LOG_ID"
          echo "::add-mask::$APPLICATION_ID"
          echo "::add-mask::$SECURITY_LOG_ID"
          printf 'application_id=%s\nsecurity_log_id=%s\n' "$APPLICATION_ID" "$SECURITY_LOG_ID" >> "$GITHUB_OUTPUT"

      - name: Render E6H standard-module preview config
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.application_id }}
          APPBASIS_SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.security_log_id }}
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: "ulc-linz",
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            securityLogHyperdriveId:
              process.env.APPBASIS_SECURITY_LOG_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_BASE_URL,
            entrypoint: "./worker/preview-exercise-catalog-standard.ts",
            r2BucketName: "appbasis-ulc-linz-preview-exercise-media",
            r2Jurisdiction: "eu",
            outputPath:
              "./apps/ulc-linz/wrangler.preview.e6h.generated.json",
          });
          NODE

      - name: Validate E6H preview bundle without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.e6h.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Deploy E6H standard-module preview runtime
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! pnpm exec wrangler deploy \
            --cwd "../ulc-linz" \
            --config wrangler.preview.e6h.generated.json \
            --experimental-provision=false \
            --experimental-auto-create=false; then
            echo 'E6H preview deployment failed.' >&2
            echo 'The deployment token intentionally has no R2 management requirement.' >&2
            echo 'Verify that the dedicated bucket appbasis-ulc-linz-preview-exercise-media exists, then rerun.' >&2
            exit 1
          fi

      - name: Verify E6H standard-module runtime is live
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Verify ULC preview application database binding
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Verify ULC preview UI and protected audit path
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: node ./tooling/ulc-linz-d4-preview-audit-smoke.mjs

      - name: Verify private exercise media end-to-end
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_ROOT_ADMIN_PASSWORD: ${{ secrets.APPBASIS_ROOT_ADMIN_PASSWORD }}
        run: >-
          node
          --experimental-transform-types
          --import ./apps/ulc-linz/tooling/register-native-typescript-resolution.mjs
          ./tooling/ulc-linz-exercise-catalog-preview-media-smoke.mjs

      - name: Re-verify E6H parity after deploy
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-exercise-catalog-preview-parity.mjs verify

      - name: Record E6H preview rollout
        shell: bash
        run: |
          {
            echo 'ULC E6H exercise-catalog schema v3 is verified in the isolated preview.'
            echo 'The preview remains on the standard-module runtime.'
            echo 'Private exercise media is bound to the dedicated pre-created EU-jurisdiction preview R2 bucket.'
            echo 'Live private-media upload, full/range download and delete were verified.'
            echo 'Production was not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated E6H config
        if: always()
        shell: bash
        run: rm -f ./apps/ulc-linz/wrangler.preview.e6h.generated.json

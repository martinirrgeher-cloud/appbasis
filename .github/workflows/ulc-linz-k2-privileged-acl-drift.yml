name: K2 privileged ACL drift offline regression
on:
  pull_request:
    paths:
      - "tooling/ulc-linz-k2-acl-object-drift.mjs"
      - "tooling/ulc-linz-k2-acl-object-drift.test.mjs"
      - "tooling/ulc-linz-k2-acl-object-readonly.sql"
      - "tooling/ulc-linz-k2-acl-direct-readonly.sql"
      - "tooling/ulc-linz-k2-quarantine-function-revoke-proposal.sql"
      - "apps/ulc-linz/docs/K2-A03-ACCESS-RESTORE-PROPOSAL.md"
      - ".github/workflows/ulc-linz-k2-privileged-acl-drift.yml"
permissions:
  contents: read
jobs:
  k2-privileged-acl-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect unauthorized PUBLIC and SECURITY DEFINER privileges without provider access
        run: node --test tooling/ulc-linz-k2-acl-object-drift.test.mjs
      - name: Explicit PASS limitation
        if: success()
        run: |
          echo "Only synthetic offline regression PASS. Real K2 restore ACL drift remains HARD NO-GO; no provider writes, GRANT/REVOKE or app deploy." >> "$GITHUB_STEP_SUMMARY"

name: ULC Linz D4 Preview

run-name: ULC D4 Preview · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit ULC D4 preview lifecycle operation
        required: true
        type: choice
        options:
          - hyperdrives
          - migrate
          - bootstrap
          - deploy
      apply:
        description: Explicitly authorize this mutating preview operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  preview:
    name: ULC Linz D4 preview ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require main branch
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC D4 preview mutations are main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Resolve and validate ULC preview app
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/generated-app-preview-plan.mjs)"
          test "$(jq -r '.appId' <<<"$PLAN")" = 'ulc-linz' || {
            echo 'ULC D4 preview plan resolved an unexpected app.' >&2
            exit 1
          }
          printf 'worker_name=%s\n' "$(jq -r '.workerName' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'migration_target=%s\n' "$(jq -r '.migrationTarget' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'entrypoint=%s\n' "$(jq -r '.entrypoint' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Require explicit preview authorization
        shell: bash
        env:
          APPBASIS_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPBASIS_APPLY" = '1' || {
            echo 'ULC D4 preview operation was not explicitly authorized.' >&2
            exit 1
          }

      - name: Validate and mask isolated preview database credentials
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_DATABASE_URL" || {
            echo 'Missing ULC D4 application database credential.' >&2
            exit 1
          }
          test -n "$APPBASIS_SECURITY_LOG_DATABASE_URL" || {
            echo 'Missing ULC D4 security-log database credential.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          echo "::add-mask::$APPBASIS_SECURITY_LOG_DATABASE_URL"
          node --input-type=module <<'NODE'
          import { validateUlcLinzD4PreviewDatabaseUrls } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";
          validateUlcLinzD4PreviewDatabaseUrls(
            process.env.APPBASIS_DATABASE_URL,
            process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          );
          NODE

      - name: Validate and mask Cloudflare credentials
        if: inputs.operation != 'migrate'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Validate protected identity secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || {
            echo 'Missing protected Better Auth secret.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          node --input-type=module <<'NODE'
          const secret = process.env.APPBASIS_BETTER_AUTH_SECRET;
          if (
            typeof secret !== "string" ||
            secret.trim() !== secret ||
            secret.length < 32
          ) {
            process.exit(1);
          }
          NODE

      - name: Create or reconcile isolated ULC preview Hyperdrives
        if: inputs.operation == 'hyperdrives'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_HYPERDRIVES: ${{ inputs.apply && '1' || '0' }}
        run: node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs ensure >/dev/null

      - name: Apply ULC preview database manifest
        if: inputs.operation == 'migrate'
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_MIGRATION_TARGET: ${{ steps.plan.outputs.migration_target }}
          APPBASIS_APPLY_MIGRATIONS: ${{ inputs.apply && '1' || '0' }}
        run: node --experimental-transform-types ./tooling/generated-app-preview-migrate.mjs

      - name: Bind and verify ULC preview security-log ingest role
        if: inputs.operation == 'migrate' || inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_SECURITY_LOG_ROLE_BINDING: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createPostgresDatabase } from "./packages/database/src/node-runtime.mjs";
          import { validateUlcLinzD4PreviewDatabaseUrls } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";

          if (process.env.APPBASIS_APPLY_SECURITY_LOG_ROLE_BINDING !== "1") {
            throw new Error("ULC D4 security-log role binding requires explicit authorization.");
          }

          const applicationDatabaseUrl = process.env.APPBASIS_DATABASE_URL;
          const securityLogDatabaseUrl = process.env.APPBASIS_SECURITY_LOG_DATABASE_URL;
          const { securityLog } = validateUlcLinzD4PreviewDatabaseUrls(
            applicationDatabaseUrl,
            securityLogDatabaseUrl,
          );
          const protectedRole = "ulc_linz_security_event_ingest";
          const loginRole = requiredRoleName(securityLog.user);

          const ownerDatabase = createPostgresDatabase(applicationDatabaseUrl);
          try {
            const roles = await ownerDatabase.client.unsafe(
              `SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole,
                      rolreplication, rolbypassrls
               FROM pg_catalog.pg_roles
               WHERE rolname = ANY($1::text[])
               ORDER BY rolname`,
              [[protectedRole, loginRole]],
            );
            const byName = new Map(roles.map((row) => [row?.rolname, row]));
            const group = byName.get(protectedRole);
            const login = byName.get(loginRole);
            if (
              byName.size !== 2 ||
              group?.rolcanlogin !== false ||
              group?.rolsuper !== false ||
              group?.rolcreatedb !== false ||
              group?.rolcreaterole !== false ||
              group?.rolreplication !== false ||
              group?.rolbypassrls !== false ||
              login?.rolcanlogin !== true ||
              login?.rolsuper !== false ||
              login?.rolcreatedb !== false ||
              login?.rolcreaterole !== false ||
              login?.rolreplication !== false ||
              login?.rolbypassrls !== false
            ) {
              throw new Error("ULC D4 security-log role inventory is unsafe or incomplete.");
            }

            let memberships = await readMemberships(ownerDatabase.client, loginRole);
            validateMemberships(memberships, loginRole, true);
            const effective = memberships.some(
              (edge) =>
                edge.parent === protectedRole &&
                edge.member === loginRole &&
                edge.admin_option === false &&
                edge.inherit_option === true &&
                edge.set_option === true,
            );
            if (!effective) {
              if (typeof ownerDatabase.client.begin !== "function") {
                throw new Error("ULC D4 security-log role-binding transaction is unavailable.");
              }
              await ownerDatabase.client.begin(async (transaction) => {
                if (transaction == null || typeof transaction.unsafe !== "function") {
                  throw new Error("ULC D4 security-log role-binding transaction is invalid.");
                }
                await transaction.unsafe(
                  `GRANT ${quoteIdentifier(protectedRole)} TO ${quoteIdentifier(loginRole)} WITH INHERIT TRUE, SET TRUE`,
                );
              });
              memberships = await readMemberships(ownerDatabase.client, loginRole);
            }
            validateMemberships(memberships, loginRole, false);
          } finally {
            await ownerDatabase.client.end().catch(() => {});
          }

          const securityDatabase = createPostgresDatabase(securityLogDatabaseUrl);
          try {
            const rows = await securityDatabase.client.unsafe(
              `SELECT current_user AS current_user,
                      pg_has_role(current_user, 'ulc_linz_security_event_ingest', 'USAGE') AS has_ingest_role,
                      has_table_privilege(current_user, 'public.ulc_linz_security_event_log', 'INSERT') AS can_insert,
                      has_sequence_privilege(current_user, 'public.ulc_linz_security_event_log_id_seq', 'USAGE') AS can_use_sequence,
                      has_table_privilege(current_user, 'public.ulc_linz_security_event_log', 'SELECT') AS can_select,
                      has_table_privilege(current_user, 'public.ulc_linz_security_event_log', 'UPDATE') AS can_update,
                      has_table_privilege(current_user, 'public.ulc_linz_security_event_log', 'DELETE') AS can_delete,
                      has_table_privilege(current_user, 'public.ulc_linz_security_event_log', 'TRUNCATE') AS can_truncate,
                      has_sequence_privilege(current_user, 'public.ulc_linz_security_event_log_id_seq', 'SELECT') AS can_select_sequence,
                      has_sequence_privilege(current_user, 'public.ulc_linz_security_event_log_id_seq', 'UPDATE') AS can_update_sequence`,
            );
            const access = rows[0];
            if (
              rows.length !== 1 ||
              access?.current_user !== loginRole ||
              access?.has_ingest_role !== true ||
              access?.can_insert !== true ||
              access?.can_use_sequence !== true ||
              access?.can_select !== false ||
              access?.can_update !== false ||
              access?.can_delete !== false ||
              access?.can_truncate !== false ||
              access?.can_select_sequence !== false ||
              access?.can_update_sequence !== false
            ) {
              throw new Error("ULC D4 security-log ingest ACL is not exact.");
            }
          } finally {
            await securityDatabase.client.end().catch(() => {});
          }

          function requiredRoleName(value) {
            if (
              typeof value !== "string" ||
              value.length === 0 ||
              value.length > 63 ||
              value !== value.trim() ||
              value.includes("\u0000")
            ) {
              throw new Error("ULC D4 security-log login role is invalid.");
            }
            return value;
          }

          function quoteIdentifier(value) {
            return `"${requiredRoleName(value).replaceAll('"', '""')}"`;
          }

          function readMemberships(client, member) {
            return client.unsafe(
              `SELECT parent.rolname AS parent, child.rolname AS member,
                      membership.admin_option, membership.inherit_option, membership.set_option
               FROM pg_catalog.pg_auth_members AS membership
               JOIN pg_catalog.pg_roles AS parent ON parent.oid = membership.roleid
               JOIN pg_catalog.pg_roles AS child ON child.oid = membership.member
               WHERE child.rolname = $1
               ORDER BY parent.rolname`,
              [member],
            );
          }

          function validateMemberships(rows, member, allowRepairable) {
            if (!Array.isArray(rows) || rows.length > 1) {
              throw new Error("ULC D4 security-log role membership is not exact.");
            }
            for (const edge of rows) {
              if (
                edge?.member !== member ||
                edge?.parent !== protectedRole ||
                edge?.admin_option !== false ||
                (!allowRepairable && edge?.inherit_option !== true) ||
                (!allowRepairable && edge?.set_option !== true) ||
                (allowRepairable && edge?.inherit_option !== true && edge?.inherit_option !== false) ||
                (allowRepairable && edge?.set_option !== true && edge?.set_option !== false)
              ) {
                throw new Error("ULC D4 security-log role membership is unsafe.");
              }
            }
            if (!allowRepairable && rows.length !== 1) {
              throw new Error("ULC D4 security-log role membership is missing.");
            }
          }
          NODE

      - name: Resolve ULC workers.dev origin
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          echo "APPBASIS_GENERATED_PREVIEW_URL=https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev" >> "$GITHUB_ENV"

      - name: Resolve isolated ULC preview Hyperdrives
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        id: hyperdrives
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          TARGETS="$(node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs resolve)"
          APPLICATION_ID="$(jq -r '.applicationId' <<<"$TARGETS")"
          SECURITY_LOG_ID="$(jq -r '.securityLogId' <<<"$TARGETS")"
          test -n "$APPLICATION_ID" || { echo 'ULC D4 application Hyperdrive was not resolved.' >&2; exit 1; }
          test -n "$SECURITY_LOG_ID" || { echo 'ULC D4 security-log Hyperdrive was not resolved.' >&2; exit 1; }
          test "$APPLICATION_ID" != "$SECURITY_LOG_ID" || { echo 'ULC D4 Hyperdrive IDs must be distinct.' >&2; exit 1; }
          echo "::add-mask::$APPLICATION_ID"
          echo "::add-mask::$SECURITY_LOG_ID"
          printf 'application_id=%s\nsecurity_log_id=%s\n' "$APPLICATION_ID" "$SECURITY_LOG_ID" >> "$GITHUB_OUTPUT"

      - name: Render ULC preview config
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.application_id }}
          APPBASIS_SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.security_log_id }}
          APPBASIS_ENTRYPOINT: ${{ steps.plan.outputs.entrypoint }}
          APPBASIS_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewBootstrapWranglerConfig,
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          const outputPath =
            process.env.APPBASIS_OPERATION === "bootstrap"
              ? "./apps/ulc-linz/wrangler.preview.bootstrap.generated.json"
              : "./apps/ulc-linz/wrangler.preview.generated.json";
          const input = {
            appId: "ulc-linz",
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            securityLogHyperdriveId:
              process.env.APPBASIS_SECURITY_LOG_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: process.env.APPBASIS_ENTRYPOINT,
            outputPath,
          };
          if (process.env.APPBASIS_OPERATION === "bootstrap") {
            await writeGeneratedPreviewBootstrapWranglerConfig(input);
          } else {
            await writeGeneratedPreviewWranglerConfig(input);
          }
          NODE

      - name: Create ULC preview Worker when absent
        if: inputs.operation == 'bootstrap'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +e
          HTTP_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APPBASIS_GENERATED_WORKER_NAME}")"
          CURL_STATUS=$?
          set -e
          if (( CURL_STATUS != 0 )); then
            echo 'Unable to determine whether the ULC preview Worker exists.' >&2
            exit 1
          fi
          case "$HTTP_STATUS" in
            200)
              echo 'ULC preview Worker already exists; bootstrap deploy skipped.'
              ;;
            404)
              pnpm exec wrangler deploy \
                --cwd "../ulc-linz" \
                --config wrangler.preview.bootstrap.generated.json \
                --experimental-provision=false \
                --experimental-auto-create=false
              ;;
            *)
              echo 'Unable to determine whether the ULC preview Worker exists.' >&2
              exit 1
              ;;
          esac

      - name: Require bootstrapped ULC preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'ULC preview Worker is not bootstrapped.' >&2
            exit 1
          }

      - name: Validate ULC preview bundle without provisioning
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize ULC preview identity secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET \
            --name "$APPBASIS_GENERATED_WORKER_NAME" \
            --experimental-provision=false \
            --experimental-auto-create=false >/dev/null
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'ULC preview Worker is missing BETTER_AUTH_SECRET after synchronization.' >&2
            exit 1
          }

      - name: Deploy ULC preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify ULC preview UI and protected countdown runtime
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ env.APPBASIS_GENERATED_PREVIEW_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { verifyGeneratedAppPreviewUi } from "./tooling/generated-app-preview-smoke.mjs";
          import { verifyGeneratedPreviewHealth } from "./tooling/generated-preview-smoke.mjs";

          const baseURL = process.env.APPBASIS_GENERATED_PREVIEW_URL;
          await verifyGeneratedPreviewHealth({ baseURL, appId: "ulc-linz" });
          await verifyGeneratedAppPreviewUi({ baseURL });

          const origin = new URL(baseURL).origin;
          const response = await fetch(`${origin}/api/modules/countdown`, {
            method: "GET",
            headers: { accept: "application/json" },
            redirect: "error",
            signal: AbortSignal.timeout(10_000),
          });
          if (response.status !== 401 || response.headers.has("set-cookie")) {
            throw new Error("ULC D4 protected countdown runtime did not fail closed.");
          }
          let payload;
          try {
            payload = await response.json();
          } catch {
            throw new Error("ULC D4 protected countdown runtime returned invalid JSON.");
          }
          const keys = payload && typeof payload === "object" && !Array.isArray(payload)
            ? Object.keys(payload)
            : [];
          const error = keys.length === 1 ? payload.error : null;
          if (
            error === null ||
            typeof error !== "object" ||
            Array.isArray(error) ||
            Object.keys(error).length !== 2 ||
            error.code !== "SESSION_INVALID" ||
            error.message !== "A valid session is required."
          ) {
            throw new Error("ULC D4 protected countdown runtime returned an unexpected denial.");
          }
          console.log("ULC D4 preview health, UI and protected countdown smoke passed.");
          NODE

      - name: Verify ULC preview application database binding
        if: inputs.operation == 'deploy'
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Remove generated ULC preview config
        if: always()
        shell: bash
        run: |
          rm -f ./apps/ulc-linz/wrangler.preview.generated.json
          rm -f ./apps/ulc-linz/wrangler.preview.bootstrap.generated.json

name: ULC Linz D4 Preview

run-name: ULC D4 Preview · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit ULC D4 preview lifecycle operation
        required: true
        type: choice
        options:
          - hyperdrives
          - migrate
          - bootstrap
          - deploy
      apply:
        description: Explicitly authorize this mutating preview operation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  preview:
    name: ULC Linz D4 preview ${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require main branch
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC D4 preview mutations are main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Resolve and validate ULC preview app
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/generated-app-preview-plan.mjs)"
          test "$(jq -r '.appId' <<<"$PLAN")" = 'ulc-linz' || {
            echo 'ULC D4 preview plan resolved an unexpected app.' >&2
            exit 1
          }
          printf 'worker_name=%s\n' "$(jq -r '.workerName' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'migration_target=%s\n' "$(jq -r '.migrationTarget' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          printf 'entrypoint=%s\n' "$(jq -r '.entrypoint' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Require explicit preview authorization
        shell: bash
        env:
          APPBASIS_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPBASIS_APPLY" = '1' || {
            echo 'ULC D4 preview operation was not explicitly authorized.' >&2
            exit 1
          }

      - name: Validate and mask isolated preview database credentials
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_MIGRATION_DATABASE_URL" || {
            echo 'Missing ULC D4 migration-owner database credential.' >&2
            exit 1
          }
          test -n "$APPBASIS_DATABASE_URL" || {
            echo 'Missing ULC D4 application-runtime database credential.' >&2
            exit 1
          }
          test -n "$APPBASIS_SECURITY_LOG_DATABASE_URL" || {
            echo 'Missing ULC D4 security-log database credential.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_MIGRATION_DATABASE_URL"
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          echo "::add-mask::$APPBASIS_SECURITY_LOG_DATABASE_URL"
          node --input-type=module <<'NODE'
          import { validateUlcLinzD4PreviewDatabaseCredentials } from "./tooling/ulc-linz-d4-preview-hyperdrive.mjs";
          validateUlcLinzD4PreviewDatabaseCredentials({
            migrationDatabaseUrl: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            applicationDatabaseUrl: process.env.APPBASIS_DATABASE_URL,
            securityLogDatabaseUrl: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          });
          NODE

      - name: Validate and mask Cloudflare credentials
        if: inputs.operation != 'migrate'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Validate protected identity secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || {
            echo 'Missing protected Better Auth secret.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          node --input-type=module <<'NODE'
          const secret = process.env.APPBASIS_BETTER_AUTH_SECRET;
          if (
            typeof secret !== "string" ||
            secret.trim() !== secret ||
            secret.length < 32
          ) {
            process.exit(1);
          }
          NODE

      - name: Create or reconcile isolated ULC preview Hyperdrives
        if: inputs.operation == 'hyperdrives'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_HYPERDRIVES: ${{ inputs.apply && '1' || '0' }}
        run: node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs ensure >/dev/null

      - name: Apply ULC preview database manifest
        if: inputs.operation == 'migrate'
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_MIGRATION_TARGET: ${{ steps.plan.outputs.migration_target }}
          APPBASIS_APPLY_MIGRATIONS: ${{ inputs.apply && '1' || '0' }}
        run: node --experimental-transform-types ./tooling/generated-app-preview-migrate.mjs

      - name: Reconcile separated ULC preview runtime database access
        if: inputs.operation == 'migrate' || inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_APPLY_DATABASE_ACCESS: ${{ inputs.apply && '1' || '0' }}
        run: node ./tooling/ulc-linz-d4-preview-database-access.mjs >/dev/null

      - name: Resolve ULC workers.dev origin
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          echo "APPBASIS_GENERATED_PREVIEW_URL=https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev" >> "$GITHUB_ENV"

      - name: Resolve isolated ULC preview Hyperdrives
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        id: hyperdrives
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          TARGETS="$(node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs resolve)"
          APPLICATION_ID="$(jq -r '.applicationId' <<<"$TARGETS")"
          SECURITY_LOG_ID="$(jq -r '.securityLogId' <<<"$TARGETS")"
          test -n "$APPLICATION_ID" || { echo 'ULC D4 application Hyperdrive was not resolved.' >&2; exit 1; }
          test -n "$SECURITY_LOG_ID" || { echo 'ULC D4 security-log Hyperdrive was not resolved.' >&2; exit 1; }
          test "$APPLICATION_ID" != "$SECURITY_LOG_ID" || { echo 'ULC D4 Hyperdrive IDs must be distinct.' >&2; exit 1; }
          echo "::add-mask::$APPLICATION_ID"
          echo "::add-mask::$SECURITY_LOG_ID"
          printf 'application_id=%s\nsecurity_log_id=%s\n' "$APPLICATION_ID" "$SECURITY_LOG_ID" >> "$GITHUB_OUTPUT"

      - name: Render ULC preview config
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.application_id }}
          APPBASIS_SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.security_log_id }}
          APPBASIS_ENTRYPOINT: ${{ steps.plan.outputs.entrypoint }}
          APPBASIS_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewBootstrapWranglerConfig,
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          const outputPath =
            process.env.APPBASIS_OPERATION === "bootstrap"
              ? "./apps/ulc-linz/wrangler.preview.bootstrap.generated.json"
              : "./apps/ulc-linz/wrangler.preview.generated.json";
          const input = {
            appId: "ulc-linz",
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            securityLogHyperdriveId:
              process.env.APPBASIS_SECURITY_LOG_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: process.env.APPBASIS_ENTRYPOINT,
            outputPath,
          };
          if (process.env.APPBASIS_OPERATION === "bootstrap") {
            await writeGeneratedPreviewBootstrapWranglerConfig(input);
          } else {
            await writeGeneratedPreviewWranglerConfig(input);
          }
          NODE

      - name: Create ULC preview Worker when absent
        if: inputs.operation == 'bootstrap'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          set +e
          HTTP_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${APPBASIS_GENERATED_WORKER_NAME}")"
          CURL_STATUS=$?
          set -e
          if (( CURL_STATUS != 0 )); then
            echo 'Unable to determine whether the ULC preview Worker exists.' >&2
            exit 1
          fi
          case "$HTTP_STATUS" in
            200)
              echo 'ULC preview Worker already exists; bootstrap deploy skipped.'
              ;;
            404)
              pnpm exec wrangler deploy \
                --cwd "../ulc-linz" \
                --config wrangler.preview.bootstrap.generated.json \
                --experimental-provision=false \
                --experimental-auto-create=false
              ;;
            *)
              echo 'Unable to determine whether the ULC preview Worker exists.' >&2
              exit 1
              ;;
          esac

      - name: Require bootstrapped ULC preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'ULC preview Worker is not bootstrapped.' >&2
            exit 1
          }

      - name: Validate ULC preview bundle without provisioning
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize ULC preview identity secret
        if: inputs.operation == 'bootstrap' || inputs.operation == 'deploy'
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.plan.outputs.worker_name }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET \
            --name "$APPBASIS_GENERATED_WORKER_NAME" \
            --experimental-provision=false \
            --experimental-auto-create=false >/dev/null
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'ULC preview Worker is missing BETTER_AUTH_SECRET after synchronization.' >&2
            exit 1
          }

      - name: Deploy ULC preview Worker
        if: inputs.operation == 'deploy'
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify ULC preview UI, protected countdown and persisted audit event
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
        run: node ./tooling/ulc-linz-d4-preview-audit-smoke.mjs

      - name: Verify ULC preview application database binding
        if: inputs.operation == 'deploy'
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Remove generated ULC preview config
        if: always()
        shell: bash
        run: |
          rm -f ./apps/ulc-linz/wrangler.preview.generated.json
          rm -f ./apps/ulc-linz/wrangler.preview.bootstrap.generated.json

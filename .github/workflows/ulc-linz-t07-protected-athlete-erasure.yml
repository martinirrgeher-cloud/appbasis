name: ULC T07 Protected Athlete Erasure

run-name: T07 ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect structured owner state (non-destructive), or separately authorize structured-only erasure'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - erase-structured-only
          - erase-catalog-owner-only
          - erase-identity-owner-only
          - redact-session-note-only
          - redact-exact-owner-text-only
      confirmation:
        description: 'Exact INSPECT, ERASE-FOUR, ERASE-VERIFIED-IDENTITY/CATALOG, or REDACT-EXACT-SESSION-NOTE token'
        required: true
        type: string
      administrator_username:
        description: 'ULC authenticated technical administrator username (not a member account)'
        required: true
        type: string
      expected_head_sha:
        description: 'REQUIRED exact operator-reviewed main commit SHA (40 lowercase hex)'
        # Subject ID and source timestamp are NOT inputs. Configure the
        # environment secrets ULC_T07_TARGET_SUBJECT_ID and
        # ULC_T07_SOURCE_COMPLETED_AT privately before an authorized run.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  protected-t07-operator:
    name: Protected four-owner T07 inspection / explicit structured-only erasure
    if: github.ref == 'refs/heads/main'
    environment: m4-dr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Public repository: never put personal or pseudonymized subject IDs in
      # workflow_dispatch inputs, run-name, job summary or issue comments.
      # The subject and source timestamp are protected Environment secrets.
      - name: Require exact main commit and separate T07 operator decision
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SUBJECT_ID: ${{ secrets.ULC_T07_TARGET_SUBJECT_ID }}
          SOURCE_COMPLETED_AT: ${{ secrets.ULC_T07_SOURCE_COMPLETED_AT }}
          SESSION_ID: ${{ secrets.ULC_T07_TARGET_SESSION_ID }}
          SESSION_DATE: ${{ secrets.ULC_T07_TARGET_SESSION_DATE }}
          SESSION_NOTE_SHA256: ${{ secrets.ULC_T07_TARGET_SESSION_NOTE_SHA256 }}
          TEXT_TARGET: ${{ secrets.ULC_T07_TEXT_TARGET }}
          TEXT_KEY_1: ${{ secrets.ULC_T07_TEXT_KEY_1 }}
          TEXT_KEY_2: ${{ secrets.ULC_T07_TEXT_KEY_2 }}
          TEXT_KEY_3: ${{ secrets.ULC_T07_TEXT_KEY_3 }}
          TEXT_SHA256: ${{ secrets.ULC_T07_TEXT_SHA256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          T07_DESTRUCTIVE_ENABLED: ${{ vars.ULC_T07_ERASURE_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || exit 1
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'T07 does not allow reruns under a stale erasure approval.' >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA" || { echo 'T07 exact approved head differs from main.' >&2; exit 1; }
          [[ "$SUBJECT_ID" =~ ^[a-zA-Z0-9._:-]{1,200}$ ]] || { echo 'Opaque subject ID invalid.' >&2; exit 1; }
          echo "::add-mask::$SUBJECT_ID"
          case "$OPERATION" in
            inspect)
              test "$CONFIRMATION" = 'INSPECT-ULC-T07-STRUCTURED-OWNERS' || exit 1
              ;;
            erase-structured-only|erase-catalog-owner-only|erase-identity-owner-only|redact-session-note-only|redact-exact-owner-text-only)
              test "$T07_DESTRUCTIVE_ENABLED" = 1 || { echo 'T07 erasure activation is not authorized in this protected environment.' >&2; exit 1; }
              if test "$OPERATION" = 'erase-catalog-owner-only'; then
                test "$CONFIRMATION" = 'ERASE-ULC-T07-VERIFIED-CATALOG-OWNER' || exit 1
              elif test "$OPERATION" = 'erase-identity-owner-only'; then
                test "$CONFIRMATION" = 'ERASE-ULC-T07-VERIFIED-IDENTITY-OWNER' || exit 1
              elif test "$OPERATION" = 'redact-session-note-only'; then
                test "$CONFIRMATION" = 'REDACT-ULC-T07-EXACT-SESSION-NOTE' || exit 1
                [[ "$SESSION_ID" =~ ^[a-zA-Z0-9._:-]{1,200}$ ]] || exit 1
                [[ "$SESSION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
                [[ "$SESSION_NOTE_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
                echo "::add-mask::$SESSION_ID"
                echo "::add-mask::$SESSION_DATE"
                echo "::add-mask::$SESSION_NOTE_SHA256"
              elif test "$OPERATION" = 'redact-exact-owner-text-only'; then
                test "$CONFIRMATION" = 'REDACT-ULC-T07-EXACT-OWNER-TEXT' || exit 1
                case "$TEXT_TARGET" in
                  registration-note|registration-change-note|documentation-revision-note|\
                  training-plan-revision-note|training-plan-item-note|training-plan-item-comment|\
                  training-block-revision-note|training-block-item-note|\
                  training-block-usage-note|training-block-usage-source-ref|\
                  exercise-catalog-usage-note|exercise-catalog-usage-source-ref) ;;
                  *) echo 'Unknown exact owner field.' >&2; exit 1 ;;
                esac
                [[ "$TEXT_KEY_1" =~ ^[a-zA-Z0-9._:-]{1,200}$ ]] || exit 1
                if test -n "$TEXT_KEY_2"; then
                  [[ "$TEXT_KEY_2" =~ ^[a-zA-Z0-9._:-]{1,200}$ ]] || exit 1
                fi
                if test -n "$TEXT_KEY_3"; then
                  test -n "$TEXT_KEY_2" || exit 1
                  [[ "$TEXT_KEY_3" =~ ^[a-zA-Z0-9._:-]{1,200}$ ]] || exit 1
                fi
                [[ "$TEXT_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
                for sensitive in "$TEXT_TARGET" "$TEXT_KEY_1" "$TEXT_KEY_2" "$TEXT_KEY_3" "$TEXT_SHA256"; do
                  if test -n "$sensitive"; then echo "::add-mask::$sensitive"; fi
                done
              else
                test "$CONFIRMATION" = 'ERASE-ULC-T07-FOUR-STRUCTURED-OWNERS' || exit 1
              fi
              [[ "$SOURCE_COMPLETED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]] || exit 1
              echo "::add-mask::$SOURCE_COMPLETED_AT"
              ;;
            *) echo 'T07 operation denied.' >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact repository contracts
        run: pnpm run verify:repo

      - name: Validate and mask protected inputs
        shell: bash
        env:
          ADMINISTRATOR_USERNAME: ${{ inputs.administrator_username }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_API_WRITE_TOKEN \
            ULC_LINZ_PRODUCTION_DATABASE_URL \
            ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET \
            ULC_LINZ_PRODUCTION_ADMIN_PASSWORD
          do
            value="${!name:-}"
            test -n "$value" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::$value"
          done
          node --input-type=module <<'NODE'
          import { parseUlcLinzProductionDatabaseUrl } from './tooling/ulc-linz-m6-production-hyperdrive.mjs';
          parseUlcLinzProductionDatabaseUrl(process.env.ULC_LINZ_PRODUCTION_DATABASE_URL);
          const secret = process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET ?? '';
          if (secret.length < 32 || secret !== secret.trim()) {
            throw new Error('ULC production Better Auth secret is invalid.');
          }
          const username = process.env.ADMINISTRATOR_USERNAME ?? '';
          if (!/^[a-z0-9._]{3,30}$/.test(username)) {
            throw new Error('ULC production administrator username is invalid.');
          }
          const password = process.env.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD ?? '';
          if (password.length < 8 || password.length > 128 || password.trim().length === 0) {
            throw new Error('ULC production administrator credential is invalid.');
          }
          NODE

      - name: Resolve canonical production Hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          app="$(node ./tooling/ulc-linz-m6-production-hyperdrive.mjs resolve)"
          test -n "$app" || { echo 'Canonical production Hyperdrive did not resolve.' >&2; exit 1; }
          echo "::add-mask::$app"
          printf 'APP_HYPERDRIVE_ID=%s\n' "$app" >> "$GITHUB_ENV"

      - name: Require existing workers.dev account subdomain
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/workers-subdomain-before.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > "$state"
          SUBDOMAIN_STATE="$state" node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { readFileSync } from 'node:fs';
          const response = JSON.parse(readFileSync(process.env.SUBDOMAIN_STATE, 'utf8'));
          const subdomain = response?.result?.subdomain;
          if (response?.success !== true || typeof subdomain !== 'string' || !/^[A-Za-z0-9-]{1,63}$/.test(subdomain)) {
            throw new Error('Protected lifecycle operation refuses remote execution without an existing workers.dev account subdomain.');
          }
          process.stdout.write(`WORKERS_DEV_SUBDOMAIN_BEFORE=${subdomain}\n`);
          NODE

      - name: Render isolated non-deployed T07 Wrangler harness binding
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$GITHUB_WORKSPACE/apps/ulc-linz/worker/t07-protected-operator-harness.ts"
          test -f "$HARNESS"
          CONFIG="$RUNNER_TEMP/t07-protected-erasure.wrangler.json"
          CONFIG="$CONFIG" HARNESS="$HARNESS" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { renderGeneratedProductionWranglerConfig } from './tooling/generated-production-deploy-config.mjs';
          const expected = renderGeneratedProductionWranglerConfig({
            appId: 'ulc-linz',
            hyperdriveId: process.env.APP_HYPERDRIVE_ID,
            securityLogHyperdriveId: 'unused-t07-protected-binding',
            baseURL: 'https://app.ulc-linz.at',
            entrypoint: './worker/index.ts',
          });
          const config = {
            name: 'appbasis-ulc-linz-t07-operator-isolated',
            main: process.env.HARNESS,
            compatibility_date: expected.compatibility_date,
            compatibility_flags: expected.compatibility_flags,
            hyperdrive: [{ binding: 'HYPERDRIVE', id: process.env.APP_HYPERDRIVE_ID }],
            dev: { ip: '127.0.0.1', port: 8787 },
          };
          writeFileSync(process.env.CONFIG, JSON.stringify(config) + '\n', { mode: 0o600 });
          NODE
          printf 'T07_WRANGLER_CONFIG=%s\n' "$CONFIG" >> "$GITHUB_ENV"

      - name: Execute isolated, explicit T07 operation through existing Hyperdrive
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SUBJECT_ID: ${{ secrets.ULC_T07_TARGET_SUBJECT_ID }}
          SOURCE_COMPLETED_AT: ${{ secrets.ULC_T07_SOURCE_COMPLETED_AT }}
          SESSION_ID: ${{ secrets.ULC_T07_TARGET_SESSION_ID }}
          SESSION_DATE: ${{ secrets.ULC_T07_TARGET_SESSION_DATE }}
          SESSION_NOTE_SHA256: ${{ secrets.ULC_T07_TARGET_SESSION_NOTE_SHA256 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          ULC_LINZ_PRODUCTION_ADMIN_USERNAME: ${{ inputs.administrator_username }}
          ULC_LINZ_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.ULC_LINZ_PRODUCTION_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          operation_token="$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(32).toString('hex'))")"
          echo "::add-mask::$operation_token"
          echo "::add-mask::$SUBJECT_ID"
          log="$RUNNER_TEMP/t07-private-wrangler.log"
          pnpm --dir apps/reference exec wrangler dev --remote \
            --config "$T07_WRANGLER_CONFIG" \
            --ip 127.0.0.1 --port 8787 \
            --var "BETTER_AUTH_SECRET:$ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET" \
            --var "ADMINISTRATOR_USERNAME:$ULC_LINZ_PRODUCTION_ADMIN_USERNAME" \
            --var "ADMINISTRATOR_PASSWORD:$ULC_LINZ_PRODUCTION_ADMIN_PASSWORD" \
            --var "T07_OPERATION_TOKEN:$operation_token" > "$log" 2>&1 &
          dev_pid=$!
          cleanup() { kill "$dev_pid" 2>/dev/null || true; wait "$dev_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --show-error --connect-timeout 1 --max-time 2 -o /dev/null http://127.0.0.1:8787/; then
              ready=true; break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              echo 'T07 isolated worker failed to start; log withheld to protect credentials.' >&2
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true || { echo 'T07 private worker never became ready.' >&2; exit 1; }
          body="$RUNNER_TEMP/t07-result.json"
          extra=()
          if test "$OPERATION" != 'inspect'; then
            extra+=( -H "x-appbasis-t07-source-completed-at: $SOURCE_COMPLETED_AT" )
          fi
          if test "$OPERATION" = 'redact-session-note-only'; then
            extra+=( -H "x-appbasis-t07-session-id: $SESSION_ID"
                     -H "x-appbasis-t07-session-date: $SESSION_DATE"
                     -H "x-appbasis-t07-session-note-sha256: $SESSION_NOTE_SHA256" )
          fi
          if test "$OPERATION" = 'redact-exact-owner-text-only'; then
            extra+=( -H "x-appbasis-t07-text-target: $TEXT_TARGET"
                     -H "x-appbasis-t07-text-key-1: $TEXT_KEY_1"
                     -H "x-appbasis-t07-text-sha256: $TEXT_SHA256" )
            if test -n "$TEXT_KEY_2"; then
              extra+=( -H "x-appbasis-t07-text-key-2: $TEXT_KEY_2" )
            fi
            if test -n "$TEXT_KEY_3"; then
              extra+=( -H "x-appbasis-t07-text-key-3: $TEXT_KEY_3" )
            fi
          fi
          status="$(curl --silent --show-error --connect-timeout 5 --max-time 120 \
            -o "$body" -w '%{http_code}' -X POST \
            -H "x-appbasis-t07-token: $operation_token" \
            -H "x-appbasis-t07-operation: $OPERATION" \
            -H "x-appbasis-t07-confirmation: $CONFIRMATION" \
            -H "x-appbasis-t07-subject-id: $SUBJECT_ID" \
            "${extra[@]}" \
            http://127.0.0.1:8787/__appbasis/t07/athlete-erasure)"
          test "$status" = 200 || { echo 'T07 operation failed; possible partial owner state requires separate review.' >&2; exit 1; }
          RESULT_PATH="$body" OPERATION="$OPERATION" node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const response = JSON.parse(readFileSync(process.env.RESULT_PATH, 'utf8'));
          if (response === null || typeof response !== 'object' || Array.isArray(response) ||
              response.fullErasureAuthorized !== false || response.olderRestorePromotionAuthorized !== false) {
            throw new Error('T07 operation returned unsafe privacy/restore flags.');
          }
          const safe = ['status', 'sourceDecisionAt', 'planMarkerPresent', 'usageMarkerPresent',
            'documentationMarkerPresent', 'historyMarkerPresent', 'documentationOwned',
            'documentationOtherRevisions', 'attendanceRows', 'registrationRows',
            'registrationHistoryRows', 'residualReview', 'eightOwnerReview',
            'structuredOwnersVerified', 'catalogOwnerProofVerified',
            'identityOwnerProofVerified', 'blockFavoriteMarkerVerified',
            'sessionNoteProofVerified', 'exactOwnerTextProofVerified',
            'fullErasureAuthorized',
            'olderRestorePromotionAuthorized'];
          if (Object.keys(response).some(key => !safe.includes(key))) {
            throw new Error('T07 operation returned non-whitelisted fields.');
          }
          if (process.env.OPERATION === 'inspect') {
            const allowed = ['source-unverifiable', 'owner-marker-conflict',
              'structured-follow-up-pending', 'structured-owner-markers-match'];
            if (!allowed.includes(response.status) || 'structuredOwnersVerified' in response) {
              throw new Error('T07 private inspection result malformed.');
            }
            const review = response.residualReview;
            const eight = response.eightOwnerReview;
            if (response.status === 'source-unverifiable') {
              if (review !== null || eight !== null)
                throw new Error('T07 cannot inspect owners without source authority.');
            } else {
              const expectedKeys = ['sourceIdentityLinks', 'subjectScopedReferenceRows',
                'identityScopedReferenceRows', 'actorAndAuditReferenceRows',
                'organizationWideFreeTextCandidates',
                'organizationWideAmbiguousUsageCandidates',
                'organizationWidePrivateMediaMetadata', 'identityMappingReviewRequired',
                'freeTextReviewed', 'actorAuditReviewed',
                'mediaProviderAbsenceVerified', 'fullPrivacyComplete'];
              if (review === null || typeof review !== 'object' || Array.isArray(review) ||
                  Object.keys(review).length !== expectedKeys.length ||
                  Object.keys(review).some(key => !expectedKeys.includes(key))) {
                throw new Error('T07 privacy residual review is missing or unexpected.');
              }
              for (const key of expectedKeys.slice(0, 7)) {
                const v = review[key];
                if (v !== null && (!Number.isSafeInteger(v) || v < 0)) {
                  throw new Error('T07 privacy residual count is invalid.');
                }
              }
              if (review.freeTextReviewed !== false || review.actorAuditReviewed !== false ||
                  review.mediaProviderAbsenceVerified !== false ||
                  review.fullPrivacyComplete !== false) {
                throw new Error('T07 operation must never certify full privacy or provider media absence.');
              }
              const ownerNames = ['identity', 'permissions', 'athletes', 'exercise-catalog',
                'training-blocks', 'training-documentation', 'training-plans',
                'ulc-linz-lifecycle'];
              const allowedState = [
                'identity-link-unverified', 'owner-marker-missing',
                'explicit-references-remain',
                'actor-audit-review-required',
                'scoped-evidence-clear-manual-review-required'
              ];
              if (!eight || typeof eight !== 'object' || Array.isArray(eight) ||
                  !Array.isArray(eight.owners) || eight.owners.length !== 8 ||
                  eight.allEightOwnersProvenComplete !== false ||
                  eight.olderRestorePromotionAllowed !== false ||
                  eight.privacyReady !== false ||
                  eight.humanFreeTextReviewRequired !== true ||
                  eight.auditRetentionDecisionRequired !== true ||
                  eight.providerMediaAbsenceRequired !== true ||
                  !Number.isSafeInteger(eight.linkedIdentityCount) ||
                  eight.linkedIdentityCount < 0 || eight.linkedIdentityCount > 1) {
                throw new Error('T07 eight-owner proof is missing or unsafe.');
              }
              for (let idx = 0; idx < ownerNames.length; idx++) {
                const item = eight.owners[idx];
                if (!item || item.owner !== ownerNames[idx] ||
                    !allowedState.includes(item.status) ||
                    (item.remainingReferences !== null &&
                      (!Number.isSafeInteger(item.remainingReferences) ||
                       item.remainingReferences < 0))) {
                  throw new Error('T07 eight-owner scope/row evidence is invalid.');
                }
              }
            }
          } else if (process.env.OPERATION === 'erase-structured-only') {
            if (response.status !== 'four-structured-owners-complete-only' ||
                response.structuredOwnersVerified !== true) {
              throw new Error('T07 four-owner mutation verification incomplete.');
            }
          } else if (process.env.OPERATION === 'erase-catalog-owner-only') {
            if (response.status !== 'catalog-owner-complete-only' ||
                response.catalogOwnerProofVerified !== true) {
              throw new Error('T07 catalogue owner deletion verification incomplete.');
            }
          } else if (process.env.OPERATION === 'redact-session-note-only') {
            if (response.status !== 'one-shared-session-note-redacted-only' ||
                response.sessionNoteProofVerified !== true) {
              throw new Error('T07 exact private session note redaction verification incomplete.');
            }
          } else if (process.env.OPERATION === 'redact-exact-owner-text-only') {
            if (response.status !== 'one-exact-owner-text-cell-redacted-only' ||
                response.exactOwnerTextProofVerified !== true) {
              throw new Error('T07 exact owner text redaction verification incomplete.');
            }
          } else if (
            response.status !== 'identity-block-favorites-owner-complete-only' ||
            response.identityOwnerProofVerified !== true ||
            response.blockFavoriteMarkerVerified !== true
          ) {
            throw new Error('T07 identity and block favorites owner proof incomplete.');
          }
          // The repo is PUBLIC. Preserve only the non-linkable operation
          // status and broad manual-review flags. The exact source time,
          // subject ID, numeric counts and free text stay off GitHub logs.
          const summary = ['### T07 protected operator review',
            '| Prüfbereich | Ergebnis |', '|---|---|'];
          if (process.env.OPERATION === 'inspect') {
            const review = response.residualReview;
            summary.push('| Strukturierte Löschung | ' + response.status + ' |');
            summary.push('| Identitätszuordnung | ' +
              (review === null || review.identityMappingReviewRequired ? 'NICHT NACHGEWIESEN' : 'IDENTITY-LINK VORHANDEN') + ' |');
            summary.push('| Freitext-/Trainer-/Actor-/Auditkontrolle | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Private Medien / ältere Backups | PROVIDERNACHWEIS / RESTORE GESPERRT |');
          } else if (process.env.OPERATION === 'erase-structured-only') {
            summary.push('| Vier-Owner-Prüfung | TECHNISCH ABGESCHLOSSEN – KEIN 8-OWNER-PASS |');
            summary.push('| Freitext / Actor / Audit | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Alte Backups | WIEDERHERSTELLUNG GESPERRT |');
          } else if (process.env.OPERATION === 'erase-catalog-owner-only') {
            summary.push('| Katalog-Owner | TECHNISCH ABGESCHLOSSEN – KEIN 8-OWNER-PASS |');
            summary.push('| Freitext / Actor / Audit | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Alte Backups | WIEDERHERSTELLUNG GESPERRT |');
          } else if (process.env.OPERATION === 'redact-session-note-only') {
            summary.push('| Exakte gemeinsame Trainingsnotiz | EINMALIG REDIGIERT – KEIN FREITEXT- ODER 8-OWNER-GESAMT-PASS |');
            summary.push('| Trainer / Actor / Audit | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Alte Backups | WIEDERHERSTELLUNG GESPERRT |');
          } else if (process.env.OPERATION === 'redact-exact-owner-text-only') {
            summary.push('| Exakte Owner-Freitextzelle | EINMALIG REDIGIERT – KEIN FREITEXT- ODER 8-OWNER-GESAMT-PASS |');
            summary.push('| Trainer / Actor / Audit | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Alte Backups | WIEDERHERSTELLUNG GESPERRT |');
          } else {
            summary.push('| Identity/Permissions/Block-Favoriten | TECHNISCH ABGESCHLOSSEN – KEIN 8-OWNER-PASS |');
            summary.push('| Freitext / Actor / Audit | MANUELLE PRÜFUNG OFFEN |');
            summary.push('| Alte Backups | WIEDERHERSTELLUNG GESPERRT |');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          NODE
          cleanup
          trap - EXIT

      - name: Verify workers.dev account subdomain remained unchanged
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/workers-subdomain-after.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > "$state"
          SUBDOMAIN_STATE="$state" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const response = JSON.parse(readFileSync(process.env.SUBDOMAIN_STATE, 'utf8'));
          if (response?.success !== true || response?.result?.subdomain !== process.env.WORKERS_DEV_SUBDOMAIN_BEFORE) {
            throw new Error('Protected lifecycle operation changed the workers.dev account subdomain state.');
          }
          NODE


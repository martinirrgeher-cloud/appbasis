name: ULC D4 Preview Access Bootstrap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Explicitly authorize ULC D4 preview access bootstrap
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz-access
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap ULC D4 preview administrator access
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: generated-preview-ulc-linz

    steps:
      - name: Require main branch
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC D4 preview access bootstrap is main-only.' >&2
            exit 1
          }

      - name: Require explicit authorization
        shell: bash
        env:
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          test "$APPLY" = '1' || {
            echo 'ULC D4 preview access bootstrap was not explicitly authorized.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate protected access inputs
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_ROOT_ADMIN_PASSWORD: ${{ secrets.APPBASIS_ROOT_ADMIN_PASSWORD }}
          APPBASIS_PREVIEW_USER_TEMPORARY_PASSWORD: ${{ secrets.APPBASIS_PREVIEW_USER_TEMPORARY_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in             APPBASIS_DATABASE_URL             APPBASIS_BETTER_AUTH_SECRET             APPBASIS_ROOT_ADMIN_PASSWORD             APPBASIS_PREVIEW_USER_TEMPORARY_PASSWORD             CLOUDFLARE_ACCOUNT_ID             CLOUDFLARE_API_TOKEN
          do
            value="${!name:-}"
            test -n "$value" || { echo "Missing protected ULC D4 access input: $name" >&2; exit 1; }
            echo "::add-mask::$value"
          done
          node --check ./apps/ulc-linz/tooling/bootstrap-preview-admin.mjs

      - name: Resolve exact ULC D4 preview origin
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header 'Accept: application/json'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          ORIGIN="https://appbasis-ulc-linz.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$ORIGIN/api/health"             | jq -e '.status == "ok" and .appId == "ulc-linz"' >/dev/null

      - name: Bootstrap ULC D4 preview administrator
        env:
          ULC_LINZ_D4_PREVIEW_ACCESS_APPLY: "1"
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          APPBASIS_ROOT_ADMIN_PASSWORD: ${{ secrets.APPBASIS_ROOT_ADMIN_PASSWORD }}
          APPBASIS_PREVIEW_USER_TEMPORARY_PASSWORD: ${{ secrets.APPBASIS_PREVIEW_USER_TEMPORARY_PASSWORD }}
        run: node ./apps/ulc-linz/tooling/bootstrap-preview-admin.mjs

      - name: Record access result
        if: success()
        run: |
          {
            echo '### ULC D4 preview access'
            echo '- URL: `https://appbasis-ulc-linz.<workers-subdomain>.workers.dev`'
            echo '- login user: `preview.admin`'
            echo '- temporary password: protected environment secret'
            echo '- first login: password change required'
            echo '- role: `ulc-linz:admin`'
            echo '- production: not modified'
          } >> "$GITHUB_STEP_SUMMARY"

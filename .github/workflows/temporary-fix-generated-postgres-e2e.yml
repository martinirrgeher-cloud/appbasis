name: Temporary Fix Generated PostgreSQL E2E

on:
  push:
    branches:
      - agent/generated-postgres-worker-runtime

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/appbasis_generated_e2e
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: appbasis_generated_e2e
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appbasis_generated_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Isolate generated Tasks schema before migration
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path("tooling/generated-runtime-template.mjs")
          text = template.read_text()
          old = 'beforeAll(async () => {\\n  const migration = await readFile(migrationUrl, "utf8");\\n  await administrativeConnection.client.unsafe(migration);\\n});'
          new = 'beforeAll(async () => {\\n  await administrativeConnection.client.unsafe(\\n    "DROP TABLE IF EXISTS appbasis_task CASCADE",\\n  );\\n  const migration = await readFile(migrationUrl, "utf8");\\n  await administrativeConnection.client.unsafe(migration);\\n});'
          if text.count(old) != 1:
              raise SystemExit(f"expected one generated beforeAll block, found {text.count(old)}")
          template.write_text(text.replace(old, new, 1))

          test = Path("tooling/generated-runtime-template.test.mjs")
          text = test.read_text()
          old = '  assert.match(postgresTest, /Persistent generated task/);\n  assert.match(postgresTest, /DATABASE_URL/);'
          new = '  assert.match(postgresTest, /Persistent generated task/);\n  assert.match(postgresTest, /DROP TABLE IF EXISTS appbasis_task CASCADE/);\n  assert.match(postgresTest, /DATABASE_URL/);'
          if text.count(old) != 1:
              raise SystemExit(f"expected one postgres test assertion block, found {text.count(old)}")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Regenerate tasks-minimal through production generator
        run: |
          rm -rf apps/tasks-minimal
          node ./tooling/create-app.mjs \
            --app-id tasks-minimal \
            --display-name "AppBasis Tasks Minimal" \
            --module tasks \
            --platform-service identity \
            --platform-service permissions

      - name: Verify generated runtime and real PostgreSQL flow
        run: |
          pnpm verify:apps
          pnpm typecheck
          pnpm --filter @appbasis/app-tasks-minimal test
          pnpm --filter @appbasis/app-tasks-minimal test:postgres
          git diff --check

      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/generated-runtime-template.mjs tooling/generated-runtime-template.test.mjs apps/tasks-minimal pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "test: isolate generated PostgreSQL E2E schema"
            git push origin HEAD:agent/generated-postgres-worker-runtime
          fi

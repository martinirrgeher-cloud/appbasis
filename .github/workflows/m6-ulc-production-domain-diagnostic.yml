name: M6 ULC Production Domain Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DIAGNOSE-ULC-M6-PRODUCTION-DOMAIN to perform one bounded production custom-domain write diagnostic'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  diagnose-domain:
    name: Diagnose exact ULC production custom-domain write
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m4-dr
    env:
      TARGET_HOSTNAME: app.ulc-linz.at
      TARGET_WORKER: appbasis-ulc-linz-production

    steps:
      - name: Require explicit diagnostic production-write approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo 'Production domain diagnostic must be dispatched from main.' >&2; exit 1; }
          test "$CONFIRMATION" = "DIAGNOSE-ULC-M6-PRODUCTION-DOMAIN" || { echo 'Exact production domain diagnostic confirmation is required.' >&2; exit 1; }

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate protected provider inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_API_WRITE_TOKEN; do
            test -n "${!name:-}" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done

      - name: Recheck exact domain state before diagnostic write
        id: before
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/domains-before.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$TARGET_HOSTNAME" > "$before"
          jq -e '.success == true and (.result | type == "array")' "$before" >/dev/null || { echo 'Production domain inventory is malformed or unsuccessful.' >&2; exit 1; }
          count="$(jq --arg h "$TARGET_HOSTNAME" '[.result[] | select(.hostname == $h)] | length' "$before")"
          test "$count" -le 1 || { echo 'Production hostname is bound more than once.' >&2; exit 1; }
          if test "$count" = 1; then
            service="$(jq -r --arg h "$TARGET_HOSTNAME" '.result[] | select(.hostname == $h) | .service' "$before")"
            test "$service" = "$TARGET_WORKER" || { echo 'Production hostname is already bound to another service; diagnostic write refused.' >&2; exit 1; }
            echo 'write_required=false' >> "$GITHUB_OUTPUT"
          else
            echo 'write_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Perform one bounded production custom-domain diagnostic write
        if: steps.before.outputs.write_required == 'true'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          body="$(jq -nc --arg hostname "$TARGET_HOSTNAME" --arg service "$TARGET_WORKER" '{hostname:$hostname,service:$service}')"
          response="$RUNNER_TEMP/domain-diagnostic.json"
          http_status="$(
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains"
          )"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            jq -r '
              (.errors // [])[:5][]
              | "Cloudflare error \(.code // "unknown"): \((.message // "unspecified") | tostring | gsub("[\\r\\n]"; " ") | .[0:300])"
            ' "$response" >&2 2>/dev/null || true
            echo "Cloudflare custom domain diagnostic failed with HTTP $http_status." >&2
            exit 1
          fi
          jq -e '.success == true' "$response" >/dev/null || { echo 'Cloudflare custom domain diagnostic returned an unsuccessful response.' >&2; exit 1; }

      - name: Verify exact domain state after diagnostic
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          after="$RUNNER_TEMP/domains-after.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$TARGET_HOSTNAME" > "$after"
          node --input-type=module - "$after" <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { evaluateUlcLinzM6ProductionDomainEvidence } from './tooling/ulc-linz-m6-production-domain-evidence.mjs';
          const payload = JSON.parse(await readFile(process.argv[2], 'utf8'));
          if (evaluateUlcLinzM6ProductionDomainEvidence(payload).productionDomainReady !== true) process.exit(1);
          NODE

      - name: Record diagnostic-only result
        if: success()
        run: |
          {
            echo '### ULC M6 production domain diagnostic'
            echo '- exact target hostname/service binding: verified'
            echo '- purpose: provider-write diagnosis only'
            echo '- M5 production evidence: not established by this run'
            echo '- M6 Production Ready: not established by this run'
            echo '- final production release: not authorized'
          } >> "$GITHUB_STEP_SUMMARY"

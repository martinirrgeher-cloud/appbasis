name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and toolchain
        run: pnpm run verify:repo

      - name: Test ULC private runtime refresh safety contract
        run: node --test ./tooling/ulc-linz-m6-private-runtime-refresh.test.mjs

      - name: Test ULC M6 pilot lifecycle contract
        run: node --test ./tooling/ulc-linz-m6-production-pilot-ingress-workflow.test.mjs ./tooling/ulc-linz-m6-pilot-lifecycle-contract.test.mjs

      - name: Test ULC M6 refresh-chain regressions
        run: node --test ./tooling/ulc-linz-m6-refresh-chain-cancellation.test.mjs ./tooling/ulc-linz-m6-refresh-chain-dispatch-correlation.test.mjs ./tooling/ulc-linz-m6-refresh-chain-wall-clock.test.mjs ./tooling/ulc-linz-m6-pilot-runtime-smoke-workflow.test.mjs

      - name: Test M5 restore credential preflight
        run: node --test ./tooling/ulc-linz-m5-restore-credential-preflight.test.mjs

      - name: Test M5 restore authority regressions
        run: node --test ./tooling/ulc-linz-m5-restore-authority-regression.test.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

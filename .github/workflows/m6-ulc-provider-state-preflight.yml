name: M6 ULC Provider State Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-ulc-provider-state-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only ULC production provider preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ULC_LINZ_M6_NEON_CREATE_METHOD: neon-api-v2-project-create-region-id

    steps:
      - name: Require main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'M6 provider preflight must be dispatched from main.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Validate and mask read-only provider inputs
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || { echo 'Missing NEON_API_KEY.' >&2; exit 1; }
          test -n "$NEON_ORG_ID" || { echo 'Missing NEON_ORG_ID.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$NEON_ORG_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

      - name: Run read-only provider-state preflight
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESULT_PATH="$RUNNER_TEMP/m6-provider-state-preflight.json"
          node ./tooling/ulc-linz-m6-provider-state-preflight.mjs > "$RESULT_PATH"
          RESULT_PATH="$RESULT_PATH" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const result = JSON.parse(await readFile(process.env.RESULT_PATH, "utf8"));
          if (
            result?.application !== "ulc-linz" ||
            result?.environment !== "production" ||
            result?.providerInventoryVerified !== true ||
            result?.readOnlyProviderStatePreflightVerified !== true ||
            result?.cloudflareWorkerInventoryVerified !== true ||
            result?.noExistingCloudflareWorkerCandidate !== true ||
            result?.providerWriteAllowed !== false ||
            result?.executionAuthorized !== false ||
            result?.explicitApprovalRequired !== true ||
            result?.publicExposureAllowed !== false ||
            result?.productionReady !== false
          ) {
            throw new Error("M6 provider preflight result violated the read-only safety contract.");
          }
          NODE
          echo 'M6 read-only provider inventory verified; no provider write is authorized.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary provider evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/m6-provider-state-preflight.json"

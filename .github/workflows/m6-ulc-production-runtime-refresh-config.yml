name: M6 ULC Production Runtime Refresh Configuration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME to upload the exact current runtime as an undeployed private version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  production-runtime-refresh-config:
    name: Upload exact current runtime without changing deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m4-dr

    env:
      TARGET_WORKER: appbasis-ulc-linz-production
      TARGET_VERSION_TAG: ulc-linz-production-runtime-v1

    steps:
      - name: Require explicit main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'Production runtime refresh configuration must be dispatched from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME" || {
            echo 'Exact production runtime refresh-configuration confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and mask protected inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ULC_LINZ_PRODUCTION_DATABASE_URL ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET; do
            test -n "${!name:-}" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node -e 'const value = process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET?.trim() ?? ""; if (value.length < 32 || value !== process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET) process.exit(1);' || {
            echo 'Production Better Auth secret must be trimmed and at least 32 characters.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import {
            parseUlcLinzProductionDatabaseUrl,
            parseUlcLinzSecurityLogIngestDatabaseUrl,
          } from './tooling/ulc-linz-m6-production-hyperdrive.mjs';
          const app = parseUlcLinzProductionDatabaseUrl(process.env.ULC_LINZ_PRODUCTION_DATABASE_URL);
          const security = parseUlcLinzSecurityLogIngestDatabaseUrl(process.env.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL);
          if (app.user === security.user) throw new Error('Production app and security-log ingest roles must be distinct.');
          NODE

      - name: Derive current auth-secret HMAC fingerprint
        id: auth
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          AUTH_SECRET_FINGERPRINT="$(node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          const secret = process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET;
          process.stdout.write(createHmac('sha256', secret).update('appbasis-ulc-linz-production-auth-secret-v1').digest('hex'));
          NODE
          )"
          echo "::add-mask::$AUTH_SECRET_FINGERPRINT"
          printf 'fingerprint=%s\n' "$AUTH_SECRET_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Read and validate current closed private runtime state
        id: state
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_AUTH_SECRET_FINGERPRINT: ${{ steps.auth.outputs.fingerprint }}
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/ulc-linz-refresh-state.json"
          CURRENT_FILE="$RUNNER_TEMP/ulc-linz-refresh-current.json"
          node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs observe > "$STATE_FILE"
          node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs current "$STATE_FILE" > "$CURRENT_FILE"
          CURRENT_ID="$(node --input-type=module "$CURRENT_FILE" <<'NODE'
          import { readFileSync } from 'node:fs';
          const value = JSON.parse(readFileSync(process.argv[1], 'utf8'));
          if (value.currentVersionId !== null && typeof value.currentVersionId !== 'string') process.exit(1);
          process.stdout.write(value.currentVersionId ?? '');
          NODE
          )"
          DEPLOYED_ID="$(node --input-type=module "$CURRENT_FILE" <<'NODE'
          import { readFileSync } from 'node:fs';
          const value = JSON.parse(readFileSync(process.argv[1], 'utf8'));
          if (typeof value.deployedVersionId !== 'string' || value.deployedVersionId.length === 0) process.exit(1);
          process.stdout.write(value.deployedVersionId);
          NODE
          )"
          printf 'current_id=%s\n' "$CURRENT_ID" >> "$GITHUB_OUTPUT"
          printf 'deployed_id=%s\n' "$DEPLOYED_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve exact dedicated production Hyperdrives
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          APP_HYPERDRIVE_ID="$(node ./tooling/ulc-linz-m6-production-hyperdrive.mjs resolve-app)"
          SECURITY_LOG_HYPERDRIVE_ID="$(node ./tooling/ulc-linz-m6-production-hyperdrive.mjs resolve-security-log)"
          test -n "$APP_HYPERDRIVE_ID" && test -n "$SECURITY_LOG_HYPERDRIVE_ID"
          test "$APP_HYPERDRIVE_ID" != "$SECURITY_LOG_HYPERDRIVE_ID"
          echo "::add-mask::$APP_HYPERDRIVE_ID"
          echo "::add-mask::$SECURITY_LOG_HYPERDRIVE_ID"
          printf 'app_id=%s\n' "$APP_HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"
          printf 'security_log_id=%s\n' "$SECURITY_LOG_HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"

      - name: Render exact private production version config
        shell: bash
        env:
          APP_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.app_id }}
          SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.security_log_id }}
        run: node ./tooling/ulc-linz-m6-production-runtime-config.mjs render "$RUNNER_TEMP/ulc-linz-production-runtime.json"

      - name: Upload exact current runtime as an undeployed version
        if: steps.state.outputs.current_id == ''
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
          AUTH_SECRET_FINGERPRINT: ${{ steps.auth.outputs.fingerprint }}
        run: |
          set -euo pipefail
          VERSION_MESSAGE="AppBasis ulc-linz production runtime ${GITHUB_SHA} auth-hmac:${AUTH_SECRET_FINGERPRINT}"
          pnpm exec wrangler versions upload --dry-run --config "$RUNNER_TEMP/ulc-linz-production-runtime.json" --name "$TARGET_WORKER"
          pnpm exec wrangler versions upload --config "$RUNNER_TEMP/ulc-linz-production-runtime.json" --name "$TARGET_WORKER" --tag "$TARGET_VERSION_TAG" --message "$VERSION_MESSAGE"

      - name: Verify exact current version and unchanged private deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_AUTH_SECRET_FINGERPRINT: ${{ steps.auth.outputs.fingerprint }}
          EXPECTED_DEPLOYED_VERSION_ID: ${{ steps.state.outputs.deployed_id }}
        run: node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs verify-upload

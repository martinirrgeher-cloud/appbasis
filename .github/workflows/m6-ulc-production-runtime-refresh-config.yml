name: M6 ULC Production Runtime Refresh Configuration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME to upload the exact current runtime while preserving the existing private deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  refresh-runtime-config:
    name: Upload exact current runtime without changing deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: m4-dr
    env:
      TARGET_WORKER: appbasis-ulc-linz-production
      TARGET_VERSION_TAG: ulc-linz-production-runtime-v1

    steps:
      - name: Require explicit main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'Production runtime refresh configuration must be dispatched from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "REFRESH-CONFIGURE-ULC-PRODUCTION-RUNTIME" || {
            echo 'Exact production runtime refresh-configuration confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and mask protected inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ULC_LINZ_PRODUCTION_DATABASE_URL ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET; do
            test -n "${!name:-}" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::${!name}"
          done
          node -e 'const value = process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET?.trim() ?? ""; if (value.length < 32 || value !== process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET) process.exit(1);' || {
            echo 'Production Better Auth secret must be trimmed and at least 32 characters.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import {
            parseUlcLinzProductionDatabaseUrl,
            parseUlcLinzSecurityLogIngestDatabaseUrl,
          } from './tooling/ulc-linz-m6-production-hyperdrive.mjs';
          const app = parseUlcLinzProductionDatabaseUrl(process.env.ULC_LINZ_PRODUCTION_DATABASE_URL);
          const security = parseUlcLinzSecurityLogIngestDatabaseUrl(process.env.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL);
          if (app.user === security.user) throw new Error('Production app and security-log ingest roles must be distinct.');
          NODE

      - name: Derive current auth-secret HMAC fingerprint
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          AUTH_SECRET_FINGERPRINT="$(node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto';
          process.stdout.write(createHmac('sha256', process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET).update('appbasis:ulc-linz:production:better-auth-secret:v1').digest('hex'));
          NODE
          )"
          [[ "$AUTH_SECRET_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "::add-mask::$AUTH_SECRET_FINGERPRINT"
          printf 'AUTH_SECRET_FINGERPRINT=%s\n' "$AUTH_SECRET_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Read and validate current closed private runtime state
        id: state
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          worker="$RUNNER_TEMP/worker.json"
          versions="$RUNNER_TEMP/versions.json"
          deployments="$RUNNER_TEMP/deployments.json"
          scripts="$RUNNER_TEMP/scripts.json"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/workers/$TARGET_WORKER" > "$worker"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/workers/$TARGET_WORKER/versions?page=1&per_page=100" > "$versions"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/$TARGET_WORKER/deployments" > "$deployments"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts" > "$scripts"
          state="$(node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs state "$worker" "$versions" "$deployments" "$scripts")"
          current_id="$(jq -r '.currentVersionId // empty' <<<"$state")"
          deployed_id="$(jq -r '.deployedVersionId' <<<"$state")"
          test -n "$deployed_id" || { echo 'Trusted private deployment identity is missing.' >&2; exit 1; }
          echo "::add-mask::$deployed_id"
          if [ -n "$current_id" ]; then echo "::add-mask::$current_id"; fi
          printf 'current_id=%s\n' "$current_id" >> "$GITHUB_OUTPUT"
          printf 'deployed_id=%s\n' "$deployed_id" >> "$GITHUB_OUTPUT"

      - name: Reuse exact Hyperdrives from trusted deployed runtime
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_VERSION_ID: ${{ steps.state.outputs.deployed_id }}
        run: |
          set -euo pipefail
          detail="$RUNNER_TEMP/deployed-version-detail.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/versions/$DEPLOYED_VERSION_ID" > "$detail"
          ids="$(VERSION_ID="$DEPLOYED_VERSION_ID" node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs binding-ids "$detail")"
          app="$(jq -r '.applicationHyperdriveId // empty' <<<"$ids")"
          security="$(jq -r '.securityLogHyperdriveId // empty' <<<"$ids")"
          test -n "$app" && test -n "$security" && test "$app" != "$security"
          echo "::add-mask::$app"; echo "::add-mask::$security"
          printf 'id=%s\nsecurity_log_id=%s\n' "$app" "$security" >> "$GITHUB_OUTPUT"

      - name: Render exact private production version config
        env:
          HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
          SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.security_log_id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeGeneratedProductionWranglerConfig } from './tooling/generated-production-deploy-config.mjs';
          await writeGeneratedProductionWranglerConfig({ appId: 'ulc-linz', hyperdriveId: process.env.HYPERDRIVE_ID, securityLogHyperdriveId: process.env.SECURITY_LOG_HYPERDRIVE_ID, baseURL: 'https://app.ulc-linz.at', entrypoint: './worker/index.ts', outputPath: './apps/ulc-linz/wrangler.production.generated.json' });
          NODE

      - name: Upload exact current runtime as an undeployed version
        id: upload
        if: steps.state.outputs.current_id == ''
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_WRITE_TOKEN }}
          ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET: ${{ secrets.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d)"; trap 'rm -rf "$temporary_directory"' EXIT
          secrets_file="$temporary_directory/secrets.json"; output_file="$temporary_directory/wrangler-output.json"
          SECRETS_FILE="$secrets_file" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile(process.env.SECRETS_FILE, `${JSON.stringify({ BETTER_AUTH_SECRET: process.env.ULC_LINZ_PRODUCTION_BETTER_AUTH_SECRET })}\n`, { encoding: 'utf8', mode: 0o600, flag: 'wx' });
          NODE
          pnpm exec wrangler versions upload --cwd ../ulc-linz --config wrangler.production.generated.json --name "$TARGET_WORKER" --secrets-file "$secrets_file" --strict --dry-run --experimental-provision=false --experimental-auto-create=false
          WRANGLER_OUTPUT_FILE_PATH="$output_file" pnpm exec wrangler versions upload --cwd ../ulc-linz --config wrangler.production.generated.json --name "$TARGET_WORKER" --secrets-file "$secrets_file" --strict --tag "$TARGET_VERSION_TAG" --message "AppBasis ulc-linz production runtime ${GITHUB_SHA} auth-hmac:${AUTH_SECRET_FINGERPRINT}" --experimental-provision=false --experimental-auto-create=false
          id="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$output_file" | tail -n 1)"
          test -n "$id" || { echo 'Wrangler did not report a version ID.' >&2; exit 1; }
          echo "::add-mask::$id"; printf 'id=%s\n' "$id" >> "$GITHUB_OUTPUT"

      - name: Verify exact current version and unchanged private deployment
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
          SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.security_log_id }}
          BEFORE_DEPLOYED_ID: ${{ steps.state.outputs.deployed_id }}
          EXISTING_CURRENT_ID: ${{ steps.state.outputs.current_id }}
          UPLOADED_ID: ${{ steps.upload.outputs.id }}
        run: |
          set -euo pipefail
          version_id="${EXISTING_CURRENT_ID:-${UPLOADED_ID:-}}"
          test -n "$version_id" || { echo 'Current runtime version identity is missing.' >&2; exit 1; }
          worker="$RUNNER_TEMP/worker-after.json"; versions="$RUNNER_TEMP/versions-after.json"; deployments="$RUNNER_TEMP/deployments-after.json"; scripts="$RUNNER_TEMP/scripts-after.json"; detail="$RUNNER_TEMP/version-detail.json"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/workers/$TARGET_WORKER" > "$worker"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/workers/$TARGET_WORKER/versions?page=1&per_page=100" > "$versions"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/$TARGET_WORKER/deployments" > "$deployments"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts" > "$scripts"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/$TARGET_WORKER/versions/$version_id" > "$detail"
          state="$(node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs deploy-state "$worker" "$versions" "$deployments" "$scripts")"
          test "$(jq -r '.currentVersionId' <<<"$state")" = "$version_id" || { echo 'Current version post-check drifted.' >&2; exit 1; }
          test "$(jq -r '.deployedVersionId' <<<"$state")" = "$BEFORE_DEPLOYED_ID" || { echo 'Runtime configuration changed the private deployment unexpectedly.' >&2; exit 1; }
          VERSION_ID="$version_id" node ./tooling/ulc-linz-m6-private-runtime-refresh.mjs bindings "$detail"
          echo 'Exact current runtime version is configured; the previous private deployment was not changed.' >> "$GITHUB_STEP_SUMMARY"

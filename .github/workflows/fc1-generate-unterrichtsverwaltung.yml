name: FC1 Generate Unterrichtsverwaltung

on:
  push:
    branches:
      - feat/fc1-unterrichtsverwaltung

permissions:
  contents: write

concurrency:
  group: fc1-generate-unterrichtsverwaltung
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-unterrichtsverwaltung]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/fc1-unterrichtsverwaltung
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Generate canonical Factory app
        shell: bash
        run: |
          set -euo pipefail
          if test -e apps/unterrichtsverwaltung/appbasis.app.json; then
            echo "Unterrichtsverwaltung already generated."
            exit 0
          fi
          node ./tooling/create-app.mjs             --app-id unterrichtsverwaltung             --display-name Unterrichtsverwaltung             --module tasks             --platform-service identity             --platform-service permissions

      - name: Verify generated app locally
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @appbasis/app-unterrichtsverwaltung typecheck
          pnpm --filter @appbasis/app-unterrichtsverwaltung test

      - name: Commit canonical generated app locally
        id: generated_commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/unterrichtsverwaltung pnpm-lock.yaml && \
             test -z "$(git status --short --untracked-files=all -- apps/unterrichtsverwaltung pnpm-lock.yaml)"; then
            echo "No generated changes to commit."
            echo "created=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "appbasis-factory-bot"
          git config user.email "appbasis-factory-bot@users.noreply.github.com"
          git add apps/unterrichtsverwaltung pnpm-lock.yaml
          git commit -m "feat: generate Unterrichtsverwaltung app [generated-unterrichtsverwaltung]"
          echo "created=1" >> "$GITHUB_OUTPUT"

      - name: Verify repository with clean generated commit
        if: steps.generated_commit.outputs.created == '1'
        run: pnpm run verify:apps

      - name: Publish canonical generated app commit
        if: steps.generated_commit.outputs.created == '1'
        run: git push origin HEAD:feat/fc1-unterrichtsverwaltung

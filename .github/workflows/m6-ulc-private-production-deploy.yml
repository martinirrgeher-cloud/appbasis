name: M6 ULC Private Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-ULC-PRIVATE-PRODUCTION to deploy the exact configured version while keeping public ingress disabled'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-private-production-deploy
  cancel-in-progress: false

jobs:
  deploy-private-runtime:
    name: Deploy exact ULC production version privately
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_WORKER: appbasis-ulc-linz-production
      TARGET_VERSION_TAG: ulc-linz-production-runtime-v1

    steps:
      - name: Require explicit main dispatch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'Private production deployment must be dispatched from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "DEPLOY-ULC-PRIVATE-PRODUCTION" || {
            echo 'Exact private production deployment confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and mask provider inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Require exact closed worker and exact current undeployed version
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          WORKER_PATH="$RUNNER_TEMP/m6-private-deploy-worker-before.json"
          VERSIONS_PATH="$RUNNER_TEMP/m6-private-deploy-versions-before.json"
          DEPLOYMENTS_PATH="$RUNNER_TEMP/m6-private-deploy-deployments-before.json"

          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$TARGET_WORKER" \
            > "$WORKER_PATH"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$TARGET_WORKER/versions?page=1&per_page=100" \
            > "$VERSIONS_PATH"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            > "$DEPLOYMENTS_PATH"

          VERSION_ID="$(
            WORKER_PATH="$WORKER_PATH" VERSIONS_PATH="$VERSIONS_PATH" DEPLOYMENTS_PATH="$DEPLOYMENTS_PATH" TARGET_VERSION_TAG="$TARGET_VERSION_TAG" GITHUB_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const workerResponse = JSON.parse(await readFile(process.env.WORKER_PATH, "utf8"));
          const versionsResponse = JSON.parse(await readFile(process.env.VERSIONS_PATH, "utf8"));
          const deploymentsResponse = JSON.parse(await readFile(process.env.DEPLOYMENTS_PATH, "utf8"));
          const worker = workerResponse?.result;
          if (
            workerResponse?.success !== true ||
            worker?.name !== "appbasis-ulc-linz-production" ||
            worker?.subdomain?.enabled !== false ||
            worker?.subdomain?.previews_enabled !== false ||
            !Array.isArray(worker?.references?.domains) ||
            worker.references.domains.length !== 0
          ) {
            throw new Error("ULC production Worker is not provably closed.");
          }
          if (
            deploymentsResponse?.success !== true ||
            !Array.isArray(deploymentsResponse?.result?.deployments) ||
            deploymentsResponse.result.deployments.length !== 0
          ) {
            throw new Error("Private production deploy requires zero existing deployments.");
          }
          if (
            versionsResponse?.success !== true ||
            !Array.isArray(versionsResponse?.result) ||
            versionsResponse.result.length !== 1
          ) {
            throw new Error("Private production deploy requires exactly one configured version.");
          }
          const version = versionsResponse.result[0];
          const versionIdPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const message = version?.annotations?.["workers/message"];
          if (
            !versionIdPattern.test(version?.id ?? "") ||
            version?.annotations?.["workers/tag"] !== process.env.TARGET_VERSION_TAG ||
            typeof message !== "string" ||
            !message.startsWith(`AppBasis ulc-linz production runtime ${process.env.GITHUB_SHA} auth-hmac:`) ||
            !/auth-hmac:[0-9a-f]{64}$/.test(message)
          ) {
            throw new Error("Configured ULC production version is not bound to the exact current main runtime.");
          }
          process.stdout.write(version.id);
          NODE
          )"
          echo "::add-mask::$VERSION_ID"
          printf 'id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy exact configured version at 100 percent
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ steps.preflight.outputs.id }}
        run: |
          set -euo pipefail
          pnpm exec wrangler versions deploy "$VERSION_ID@100%" \
            --name "$TARGET_WORKER" \
            --message "AppBasis private ULC production deploy ${GITHUB_SHA}" \
            --experimental-provision=false \
            --experimental-auto-create=false \
            -y

      - name: Verify deployment and closed ingress state
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ steps.preflight.outputs.id }}
        run: |
          set -euo pipefail
          WORKER_PATH="$RUNNER_TEMP/m6-private-deploy-worker-after.json"
          DEPLOYMENTS_PATH="$RUNNER_TEMP/m6-private-deploy-deployments-after.json"

          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$TARGET_WORKER" \
            > "$WORKER_PATH"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            > "$DEPLOYMENTS_PATH"

          WORKER_PATH="$WORKER_PATH" DEPLOYMENTS_PATH="$DEPLOYMENTS_PATH" VERSION_ID="$VERSION_ID" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const workerResponse = JSON.parse(await readFile(process.env.WORKER_PATH, "utf8"));
          const deploymentsResponse = JSON.parse(await readFile(process.env.DEPLOYMENTS_PATH, "utf8"));
          const worker = workerResponse?.result;
          if (
            workerResponse?.success !== true ||
            worker?.name !== "appbasis-ulc-linz-production" ||
            worker?.subdomain?.enabled !== false ||
            worker?.subdomain?.previews_enabled !== false ||
            !Array.isArray(worker?.references?.domains) ||
            worker.references.domains.length !== 0
          ) {
            throw new Error("ULC production Worker became publicly reachable after private deployment.");
          }
          const deployments = deploymentsResponse?.result?.deployments;
          if (
            deploymentsResponse?.success !== true ||
            !Array.isArray(deployments) ||
            deployments.length !== 1
          ) {
            throw new Error("Private production deployment inventory is not exact.");
          }
          const deployment = deployments[0];
          const versions = deployment?.versions;
          if (
            !Array.isArray(versions) ||
            versions.length !== 1 ||
            versions[0]?.version_id !== process.env.VERSION_ID ||
            versions[0]?.percentage !== 100
          ) {
            throw new Error("Private production deployment does not point 100 percent to the approved version.");
          }
          NODE

          echo 'Exact ULC production version is deployed while public ingress remains disabled.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary deployment evidence
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/m6-private-deploy-*.json

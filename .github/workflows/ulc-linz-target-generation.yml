name: Generate ULC Linz AppBasis target

on:
  push:
    branches:
      - feature/ulc-linz-generated-target

permissions:
  contents: write

concurrency:
  group: ulc-linz-target-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ULC Linz target
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Generate target through canonical AppBasis path
        run: >-
          node ./tooling/create-app.mjs
          --app-id ulc-linz
          --display-name "ULC Linz"
          --platform-service identity
          --platform-service permissions

      - name: Verify generated repository state
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:apps
          pnpm run verify:migrations
          git diff --check
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(apps/ulc-linz(/.*)?|pnpm-lock\.yaml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Generator changed unexpected paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test -f apps/ulc-linz/appbasis.app.json
          test -f apps/ulc-linz/appbasis.database.json
          test -f apps/ulc-linz/package.json

      - name: Commit canonical generated target
        shell: bash
        run: |
          set -euo pipefail
          git add apps/ulc-linz pnpm-lock.yaml
          git diff --cached --exit-code && {
            echo 'Canonical generator produced no repository changes.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: generate ULC Linz AppBasis target [skip ci]'
          git push origin HEAD

name: M3 Preview Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Deploy the pre-provisioned m3-preview Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: m3-preview-worker-appbasis-m3-preview
  cancel-in-progress: false

jobs:
  deploy:
    name: M3 preview deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: m3-preview
    env:
      APPBASIS_GENERATED_APP_ID: m3-preview
      APPBASIS_GENERATED_WORKER_NAME: appbasis-m3-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and explicit deployment confirmation
        shell: bash
        env:
          APPBASIS_M3_PREVIEW_DEPLOY_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          set -euo pipefail
          pnpm run verify:repo
          test "$APPBASIS_M3_PREVIEW_DEPLOY_APPLY" = '1' || {
            echo 'm3-preview deployment was not explicitly confirmed.' >&2
            exit 1
          }

      - name: Validate and mask deployment-only inputs
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing dedicated m3-preview database connection.' >&2; exit 1; }
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || { echo 'Missing protected Better Auth secret.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          node --input-type=module <<'NODE' || {
          const secret = process.env.APPBASIS_BETTER_AUTH_SECRET;
          if (
            typeof secret !== "string" ||
            secret.trim() !== secret ||
            secret.length < 32
          ) {
            process.exit(1);
          }
          NODE
            echo 'Protected Better Auth secret does not satisfy the generated runtime contract.' >&2
            exit 1
          }

      - name: Verify m3-preview database schema before provider changes
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: node ./apps/m3-preview/tooling/verify-preview-schema.mjs

      - name: Resolve generated workers.dev origin
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || { echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2; exit 1; }
          ORIGIN="https://${APPBASIS_GENERATED_WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          echo "APPBASIS_GENERATED_PREVIEW_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Resolve and verify dedicated m3-preview Hyperdrive
        id: hyperdrive
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
        run: |
          set -euo pipefail
          HYPERDRIVE_ID="$(node ./tooling/m3-preview-hyperdrive.mjs resolve)"
          test -n "$HYPERDRIVE_ID" || { echo 'Dedicated m3-preview Hyperdrive was not resolved.' >&2; exit 1; }
          echo "::add-mask::$HYPERDRIVE_ID"
          printf 'id=%s\n' "$HYPERDRIVE_ID" >> "$GITHUB_OUTPUT"

      - name: Render required-secret deployment config
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          node --input-type=module <<'NODE'
          import { writeGeneratedPreviewWranglerConfig } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: process.env.APPBASIS_GENERATED_APP_ID,
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_GENERATED_PREVIEW_URL,
            entrypoint: "./worker/preview.ts",
            outputPath: "./apps/m3-preview/wrangler.preview.generated.json",
          });
          NODE

      - name: Require pre-provisioned m3-preview Worker
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'm3-preview Worker is not pre-provisioned.' >&2
            exit 1
          }

      - name: Validate m3-preview Worker bundle without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd ../m3-preview
          --config wrangler.preview.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize required Worker secret without Worker creation
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          secret_response="$(mktemp)"
          trap 'rm -f "$secret_response"' EXIT

          node -e 'process.stdout.write(JSON.stringify({ name: "BETTER_AUTH_SECRET", text: process.env.APPBASIS_BETTER_AUTH_SECRET, type: "secret_text" }))' \
            | curl --fail-with-body --silent --show-error \
              --request PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$APPBASIS_GENERATED_WORKER_NAME/secrets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              > "$secret_response"

          SECRET_RESPONSE="$secret_response" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const response = JSON.parse(readFileSync(process.env.SECRET_RESPONSE, 'utf8'));
          if (
            response?.success !== true ||
            response?.result?.name !== 'BETTER_AUTH_SECRET' ||
            response?.result?.type !== 'secret_text'
          ) {
            console.error('Cloudflare secret synchronization returned an unexpected response.');
            process.exit(1);
          }
          NODE

      - name: Verify required Worker secret is present
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRET_LIST="$(pnpm exec wrangler secret list --name "$APPBASIS_GENERATED_WORKER_NAME" --format json)"
          jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<<"$SECRET_LIST" >/dev/null || {
            echo 'm3-preview Worker is missing BETTER_AUTH_SECRET after synchronization.' >&2
            exit 1
          }

      - name: Deploy m3-preview Worker without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd ../m3-preview
          --config wrangler.preview.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Verify deployed m3-preview runtime boundary
        run: node ./tooling/generated-preview-smoke.mjs

      - name: Verify deployed m3-preview database binding
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Remove generated deployment config
        if: always()
        run: rm -f ./apps/m3-preview/wrangler.preview.generated.json

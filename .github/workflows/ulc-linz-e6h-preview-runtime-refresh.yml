name: ULC Linz Preview – Aktuelle App aktualisieren

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Deploy the current main standard-module ULC preview runtime without migrations
        required: true
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: generated-preview-ulc-linz
  cancel-in-progress: false

jobs:
  refresh:
    name: Aktuelle ULC-App in isolierter Preview aktualisieren
    if: ${{ inputs.apply == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: generated-preview-ulc-linz
    env:
      APPBASIS_GENERATED_APP_ID: ulc-linz

    steps:
      - name: Require exact main preview scope
        shell: bash
        env:
          APPBASIS_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$APPBASIS_REF" = 'refs/heads/main' || {
            echo 'ULC E6H preview runtime refresh is main-only.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Validate and mask protected inputs
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPBASIS_MIGRATION_DATABASE_URL APPBASIS_DATABASE_URL APPBASIS_SECURITY_LOG_DATABASE_URL APPBASIS_BETTER_AUTH_SECRET CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            value="${!name:-}"
            test -n "$value" || {
              echo "Missing protected input: $name" >&2
              exit 1
            }
            echo "::add-mask::$value"
          done

      # A02.3 on main requires these v11 registration-note columns. A
      # UI-only refresh must fail BEFORE any Worker/secret mutation if the
      # isolated preview database has not been separately migrated.
      - name: Require compatible Preview registration-note schema
        shell: bash
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createPostgresDatabase } from './packages/database/src/node-runtime.mjs';
          import { validateUlcLinzD4PreviewDatabaseCredentials } from './tooling/ulc-linz-d4-preview-hyperdrive.mjs';

          validateUlcLinzD4PreviewDatabaseCredentials({
            migrationDatabaseUrl: process.env.APPBASIS_MIGRATION_DATABASE_URL,
            applicationDatabaseUrl: process.env.APPBASIS_DATABASE_URL,
            securityLogDatabaseUrl: process.env.APPBASIS_SECURITY_LOG_DATABASE_URL,
          });
          const db = createPostgresDatabase(process.env.APPBASIS_MIGRATION_DATABASE_URL);
          try {
            const columns = await db.client.unsafe(`
              SELECT table_name, data_type, is_nullable
                FROM information_schema.columns
               WHERE table_schema = 'public'
                 AND column_name = 'note'
                 AND table_name IN (
                   'ulc_linz_training_registration',
                   'ulc_linz_training_registration_change'
                 )
               ORDER BY table_name
            `);
            const expectedTables = [
              'ulc_linz_training_registration',
              'ulc_linz_training_registration_change',
            ];
            const columnsValid = columns.length === expectedTables.length
              && columns.every((col, i) => col.table_name === expectedTables[i]
                && col.data_type === 'text' && col.is_nullable === 'YES');
            const constraints = await db.client.unsafe(`
              SELECT conname, convalidated
                FROM pg_catalog.pg_constraint
               WHERE connamespace = 'public'::regnamespace
                 AND conname IN (
                   'ulc_linz_training_registration_note_check',
                   'ulc_linz_training_registration_change_note_check'
                 )
               ORDER BY conname
            `);
            const expectedConstraints = [
              'ulc_linz_training_registration_change_note_check',
              'ulc_linz_training_registration_note_check',
            ];
            const checksValid = constraints.length === expectedConstraints.length
              && constraints.every((row, i) => row.conname === expectedConstraints[i]
                && row.convalidated === true);
            if (!columnsValid || !checksValid) {
              throw new Error(
                'Preview is missing app-owned ULC registration-note schema v11. '
                + 'STOP before Worker update; migration requires separate operator approval.',
              );
            }
            console.log('Read-only ULC registration-note schema v11 preflight PASS.');
          } finally {
            await db.client.end().catch(() => {});
          }
          NODE
      # Block deploy before secrets/Worker mutation if schema v13 is not installed.
      - name: Require current youth-content schema-v13 before preview runtime refresh
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-youth-content-preview.mjs verify

      - name: Require shared youth categories schema-v14 before preview runtime refresh
        env:
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: node ./tooling/ulc-linz-youth-categories-preview.mjs verify

      - name: Resolve preview worker and URL
        id: preview
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          PLAN="$(node ./tooling/ulc-linz-d4-preview-plan.mjs)"
          WORKER_NAME="$(jq -r '.workerName' <<<"$PLAN")"
          [[ "$WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'ULC preview worker name is invalid.' >&2
            exit 1
          }
          RESPONSE="$(curl --fail-with-body --silent --show-error             --header 'Accept: application/json'             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(jq -r 'if .success == true then (.result.subdomain // "") else "" end' <<<"$RESPONSE")"
          [[ "$SUBDOMAIN" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || {
            echo 'Cloudflare Workers account subdomain is unavailable or invalid.' >&2
            exit 1
          }
          BASE_URL="https://${WORKER_NAME}.${SUBDOMAIN}.workers.dev"
          printf 'worker_name=%s\nbase_url=%s\n' "$WORKER_NAME" "$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Require existing standard-module preview runtime
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name "$APPBASIS_GENERATED_WORKER_NAME" --json >/dev/null 2>&1 || {
            echo 'ULC preview Worker is not bootstrapped.' >&2
            exit 1
          }

      - name: Verify current runtime remains standard-module
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Resolve isolated ULC preview Hyperdrives
        id: hyperdrives
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_SECURITY_LOG_DATABASE_URL: ${{ secrets.APPBASIS_SECURITY_LOG_DATABASE_URL }}
        run: |
          set -euo pipefail
          TARGETS="$(node ./tooling/ulc-linz-d4-preview-hyperdrive.mjs resolve)"
          APPLICATION_ID="$(jq -r '.applicationId' <<<"$TARGETS")"
          SECURITY_LOG_ID="$(jq -r '.securityLogId' <<<"$TARGETS")"
          test -n "$APPLICATION_ID"
          test -n "$SECURITY_LOG_ID"
          test "$APPLICATION_ID" != "$SECURITY_LOG_ID"
          echo "::add-mask::$APPLICATION_ID"
          echo "::add-mask::$SECURITY_LOG_ID"
          printf 'application_id=%s\nsecurity_log_id=%s\n' "$APPLICATION_ID" "$SECURITY_LOG_ID" >> "$GITHUB_OUTPUT"

      - name: Render standard-module preview config
        shell: bash
        env:
          APPBASIS_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.application_id }}
          APPBASIS_SECURITY_LOG_HYPERDRIVE_ID: ${{ steps.hyperdrives.outputs.security_log_id }}
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            writeGeneratedPreviewWranglerConfig,
          } from "./tooling/generated-preview-deploy-config.mjs";

          await writeGeneratedPreviewWranglerConfig({
            appId: "ulc-linz",
            hyperdriveId: process.env.APPBASIS_HYPERDRIVE_ID,
            securityLogHyperdriveId:
              process.env.APPBASIS_SECURITY_LOG_HYPERDRIVE_ID,
            baseURL: process.env.APPBASIS_BASE_URL,
            buildSha: process.env.GITHUB_SHA,
            entrypoint: "./worker/preview-exercise-catalog-standard.ts",
            r2BucketName: "appbasis-ulc-linz-preview-exercise-media",
            r2Jurisdiction: "eu",
            outputPath:
              "./apps/ulc-linz/wrangler.preview.e6h-refresh.generated.json",
          });
          NODE

      - name: Validate preview bundle without provisioning
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.e6h-refresh.generated.json
          --dry-run
          --experimental-provision=false
          --experimental-auto-create=false

      - name: Synchronize preview identity secret
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPBASIS_GENERATED_WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$APPBASIS_BETTER_AUTH_SECRET"             | pnpm exec wrangler secret put BETTER_AUTH_SECRET                 --name "$APPBASIS_GENERATED_WORKER_NAME" >/dev/null

      - name: Deploy standard-module ULC preview runtime
        working-directory: apps/reference
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler deploy
          --cwd "../ulc-linz"
          --config wrangler.preview.e6h-refresh.generated.json
          --experimental-provision=false
          --experimental-auto-create=false

      # Before any acceptance, prove the newly deployed Worker is the exact
      # currently approved main commit, not a cached older preview revision.
      - name: Verify exact deployed ULC app build
        shell: bash
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 20); do
            STATUS="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/ulc-current-preview-build.json" \
              --write-out '%{http_code}' \
              "$APPBASIS_GENERATED_PREVIEW_URL/api/health/build" || true)"
            if [ "$STATUS" = '200' ] \
               && jq -e --arg sha "$APPBASIS_EXPECTED_GIT_SHA" \
                 '.status == "ok" and .appId == "ulc-linz" and .gitSha == $sha' \
                 "$RUNNER_TEMP/ulc-current-preview-build.json" >/dev/null; then
              READY=1
              break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 2; fi
          done
          test "$READY" = '1' || {
            echo 'Preview did not deploy the exact current main commit.' >&2
            exit 1
          }

      - name: Verify standard-module runtime is live
        env:
          APPBASIS_BASE_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_EXPECTED_MODE: standard-module
        run: node ./tooling/ulc-linz-exercise-catalog-preview-runtime-smoke.mjs

      - name: Verify preview application database binding
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: node ./tooling/generated-preview-database-smoke.mjs

      - name: Verify preview UI and protected audit path
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
          APPBASIS_MIGRATION_DATABASE_URL: ${{ secrets.APPBASIS_MIGRATION_DATABASE_URL }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
        run: node ./tooling/ulc-linz-d4-preview-audit-smoke.mjs

      - name: Verify clone UI is deployed
        shell: bash
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          HTML="$(curl --fail-with-body --silent --show-error "$APPBASIS_GENERATED_PREVIEW_URL/")"
          grep -F 'id="exercise-catalog-clone"' <<<"$HTML" >/dev/null || {
            echo 'The deployed preview does not contain the exercise clone action.' >&2
            exit 1
          }

      - name: Verify A10 home, U12 contents and protected training APIs
        shell: bash
        env:
          APPBASIS_GENERATED_PREVIEW_URL: ${{ steps.preview.outputs.base_url }}
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 20); do
            if HTML="$(curl --fail-with-body --silent --show-error \
              "$APPBASIS_GENERATED_PREVIEW_URL/" 2>/dev/null)"; then
              if grep -F 'id="registration-dashboard" data-dashboard-view="registration" hidden' <<<"$HTML" >/dev/null \
                && grep -F 'id="user-admin-dashboard" hidden data-dashboard-view="users"' <<<"$HTML" >/dev/null \
                && grep -F 'data-dashboard-view="attendance" hidden' <<<"$HTML" >/dev/null \
                && grep -F 'data-nav-view="attendance"' <<<"$HTML" >/dev/null \
                && grep -F 'id="u12-content-card"' <<<"$HTML" >/dev/null \
                && ! grep -F '<span class="app-badge">AppBasis</span>' <<<"$HTML" >/dev/null; then
                READY=1
                break
              fi
            fi
            if [ "$attempt" -lt 20 ]; then sleep 2; fi
          done
          test "$READY" = '1' || {
            echo 'Preview is missing the current role-aware attendance dashboard or U12 content editor.' >&2
            exit 1
          }
          for path in /api/modules/training-plans /api/modules/training-documentation; do
            HTTP_STATUS="$(curl --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              "$APPBASIS_GENERATED_PREVIEW_URL$path")"
            case "$HTTP_STATUS" in
              401|403) ;;
              *)
                echo "Unauthenticated preview API access unexpectedly returned HTTP $HTTP_STATUS." >&2
                exit 1
                ;;
            esac
          done

      - name: Record preview refresh
        shell: bash
        run: |
          {
            echo 'ULC preview refreshed to the exact current main commit.'
            echo 'A10 role-aware attendance dashboard, U12 content editor and private API guards verified.'
            echo 'Standard-module entrypoint preserved.'
            echo 'No database migration or R2 provisioning was executed.'
            echo 'Production was not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated preview config
        if: always()
        shell: bash
        run: rm -f ./apps/ulc-linz/wrangler.preview.e6h-refresh.generated.json

name: Reference Preview Permission Cutover

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upgrade the existing Reference permission schema and persist legacy member/admin assignments
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reference-preview-deploy
  cancel-in-progress: false

jobs:
  cutover:
    name: Reference permission authority cutover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reference-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository and explicit cutover confirmation
        shell: bash
        env:
          APPBASIS_PERMISSION_CUTOVER_APPLY: ${{ inputs.apply && '1' || '0' }}
        run: |
          pnpm run verify:repo
          test "$APPBASIS_PERMISSION_CUTOVER_APPLY" = '1' || { echo 'Reference permission cutover was not explicitly confirmed.' >&2; exit 1; }

      - name: Snapshot existing Reference Worker permission bindings
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare credential.' >&2; exit 1; }
          umask 077
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/appbasis-reference/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output ./apps/reference/tooling/.reference-worker-settings.json
          test -s ./apps/reference/tooling/.reference-worker-settings.json || { echo 'Reference Worker settings snapshot is empty.' >&2; exit 1; }

      - name: Build isolated permission foundation runner
        run: pnpm --filter @appbasis/reference build:permission-foundation

      - name: Ensure versioned permission foundation exists
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_PERMISSION_FOUNDATION_TARGET: reference-preview
        run: |
          set -euo pipefail
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing protected Reference preview database connection.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          node ./apps/reference/tooling/.permission-foundation-dist/reference-preview-permission-foundation.mjs

      - name: Build isolated permission cutover runner
        run: pnpm --filter @appbasis/reference build:permission-cutover

      - name: Apply versioned permission upgrade and legacy assignment cutover
        shell: bash
        env:
          APPBASIS_DATABASE_URL: ${{ secrets.APPBASIS_DATABASE_URL }}
          APPBASIS_PERMISSION_CUTOVER_TARGET: reference-preview
          APPBASIS_PERMISSION_CUTOVER_MODE: apply
          APPBASIS_REFERENCE_WORKER_SETTINGS_PATH: ${{ github.workspace }}/apps/reference/tooling/.reference-worker-settings.json
        run: |
          set -euo pipefail
          test -n "$APPBASIS_DATABASE_URL" || { echo 'Missing protected Reference preview database connection.' >&2; exit 1; }
          echo "::add-mask::$APPBASIS_DATABASE_URL"
          node ./apps/reference/tooling/.permission-cutover-dist/reference-preview-permission-cutover.mjs

      - name: Remove transient cutover artifacts
        if: always()
        shell: bash
        run: |
          rm -f ./apps/reference/tooling/.reference-worker-settings.json
          rm -rf ./apps/reference/tooling/.permission-foundation-dist
          rm -rf ./apps/reference/tooling/.permission-cutover-dist

name: Reference Role Admin Secret Bootstrap

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Install the existing Reference auth secret on the internal role admin Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reference-role-admin-secret-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Reference role admin secret bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reference-preview

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify:repo

      - name: Require existing internal role administration Worker
        working-directory: apps/reference
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if ! pnpm exec wrangler deployments list --name appbasis-reference-role-admin --json >/dev/null 2>&1; then
            echo 'Expected pre-created Worker appbasis-reference-role-admin was not found or is not readable.' >&2
            exit 1
          fi

      - name: Verify existing role administration Worker has no public ingress
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ./tooling/reference-role-admin-ingress.mjs

      - name: Install existing Reference auth secret on internal role administration Worker
        shell: bash
        env:
          APPBASIS_ROLE_ADMIN_SECRET_BOOTSTRAP_APPLY: ${{ inputs.apply && '1' || '0' }}
          APPBASIS_BETTER_AUTH_SECRET: ${{ secrets.APPBASIS_BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$APPBASIS_ROLE_ADMIN_SECRET_BOOTSTRAP_APPLY" = '1' || { echo 'Reference role admin secret bootstrap was not explicitly confirmed.' >&2; exit 1; }
          test -n "$APPBASIS_BETTER_AUTH_SECRET" || { echo 'Missing protected existing Reference auth secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing required Cloudflare deployment account.' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing required Cloudflare deployment credential.' >&2; exit 1; }
          node -e 'const secret = process.env.APPBASIS_BETTER_AUTH_SECRET?.trim() ?? ""; if (secret.length < 32) process.exit(1);' || {
            echo 'Protected existing Reference auth secret does not satisfy the role admin runtime contract.' >&2
            exit 1
          }
          echo "::add-mask::$APPBASIS_BETTER_AUTH_SECRET"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

          secret_response="$(mktemp)"
          trap 'rm -f "$secret_response"' EXIT

          node -e 'process.stdout.write(JSON.stringify({ name: "BETTER_AUTH_SECRET", text: process.env.APPBASIS_BETTER_AUTH_SECRET, type: "secret_text" }))' \
            | curl --fail-with-body --silent --show-error \
              --request PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/appbasis-reference-role-admin/secrets" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              > "$secret_response"

          SECRET_RESPONSE="$secret_response" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const response = JSON.parse(readFileSync(process.env.SECRET_RESPONSE, 'utf8'));
          if (
            response?.success !== true ||
            response?.result?.name !== 'BETTER_AUTH_SECRET' ||
            response?.result?.type !== 'secret_text'
          ) {
            console.error('Cloudflare secret bootstrap returned an unexpected response.');
            process.exit(1);
          }
          NODE

      - name: Verify role administration Worker still has no public ingress
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ./tooling/reference-role-admin-ingress.mjs

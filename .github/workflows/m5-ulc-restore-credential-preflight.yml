name: M5 ULC Restore Credential Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  restore-credential-preflight:
    name: Verify isolated restore credentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: m4-dr

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify all isolated restore credentials
        env:
          APPBASIS_M4_RESTORE_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_DATABASE_URL }}
          APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_APPLICATION_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_INGEST_DATABASE_URL }}
          APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.APPBASIS_M4_RESTORE_SECURITY_LOG_READ_DATABASE_URL }}
        run: node ./tooling/ulc-linz-m5-restore-credential-preflight.mjs credentials-only

name: M5 ULC ACL Semantic Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN-ULC-M5-ACL-DIAGNOSTIC to collect sanitized read-only ACL semantics'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m6-ulc-production-runtime-config
  cancel-in-progress: false

jobs:
  diagnose-acl:
    name: Diagnose sanitized ULC production ACL semantics
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: m4-dr
    timeout-minutes: 15

    steps:
      - name: Require explicit read-only production diagnostic approval
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo 'ULC M5 ACL diagnostic must run from main.' >&2
            exit 1
          }
          test "$CONFIRMATION" = "RUN-ULC-M5-ACL-DIAGNOSTIC" || {
            echo 'Exact ULC M5 ACL diagnostic confirmation is required.' >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact repository contracts before production diagnostic
        run: pnpm run verify:repo

      - name: Validate and mask protected database credentials
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_OWNER_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_OWNER_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          for name in \
            ULC_LINZ_PRODUCTION_OWNER_DATABASE_URL \
            ULC_LINZ_PRODUCTION_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL \
            ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL
          do
            value="${!name:-}"
            test -n "$value" || { echo "Missing $name." >&2; exit 1; }
            echo "::add-mask::$value"
          done

      - name: Collect sanitized read-only ACL semantics
        shell: bash
        env:
          ULC_LINZ_PRODUCTION_OWNER_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_OWNER_DATABASE_URL }}
          ULC_LINZ_PRODUCTION_DATABASE_URL: ${{ secrets.ULC_LINZ_PRODUCTION_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_INGEST_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_CLEANUP_DATABASE_URL }}
          ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL: ${{ secrets.ULC_LINZ_SECURITY_LOG_READ_DATABASE_URL }}
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/ulc-m5-acl-semantic-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          node ./tooling/ulc-linz-m5-acl-semantic-diagnostic.mjs > "$RESULT"
          RESULT="$RESULT" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const value = JSON.parse(await readFile(process.env.RESULT, 'utf8'));
          if (
            value?.schemaVersion !== 1 ||
            value?.application !== 'ulc-linz' ||
            value?.environment !== 'production' ||
            !Number.isInteger(value?.unexpectedGrantCount) ||
            value.unexpectedGrantCount < 0 ||
            !Array.isArray(value?.unexpectedGrants) ||
            value.unexpectedGrants.length !== value.unexpectedGrantCount ||
            !Number.isInteger(value?.protectedMembershipCount) ||
            value.protectedMembershipCount < 0 ||
            !Array.isArray(value?.protectedMemberships) ||
            value.protectedMemberships.length !== value.protectedMembershipCount ||
            value?.productionReleaseAuthorized !== false
          ) {
            throw new Error('ULC M5 ACL semantic diagnostic result is invalid.');
          }
          const safe = JSON.stringify(value);
          if (/postgres(?:ql)?:\/\//iu.test(safe) || /password|token|secret/iu.test(safe)) {
            throw new Error('ULC M5 ACL semantic diagnostic output is not sanitized.');
          }
          process.stdout.write(`${safe}\n`);
          process.env.GITHUB_STEP_SUMMARY && await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_STEP_SUMMARY, `\n### Sanitized M5 ACL semantic diagnostic\n\n\`${safe}\`\n`));
          NODE
          rm -f -- "$RESULT"
